<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<title>Aliança Seguros — Descomplicar (exemplar Eagle Marketing)</title>
<style>
  @font-face { font-family: 'Montserrat'; src: url('assets/montserrat-latin.woff2') format('woff2'); font-weight: 100 900; }
  :root { --navy: #172554; --navy2: #1b2a5c; --red: #B7021C; --red2: #c41a2c; --paper: #F4F2F2; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--paper); }
  body { font-family: 'Montserrat', sans-serif; color: var(--navy); position: relative; }
  .abs { position: absolute; }
  .layer { position: absolute; inset: 0; }
  .center-x { left: 0; right: 0; text-align: center; }
  .mask { overflow: hidden; display: inline-block; vertical-align: top; padding: 0 6px; }
  .mask > span { display: inline-block; will-change: transform; }
  .word { display: inline-block; margin: 0 10px; }
  .card { position: absolute; left: 70px; width: 940px; height: 360px; background: #fff; border-radius: 34px;
          box-shadow: 0 30px 60px rgba(0,0,0,.25); overflow: hidden; display: flex; align-items: center; }
  .card .pic { width: 360px; height: 360px; overflow: hidden; flex: none; position: relative; }
  .card .pic img, .card .pic svg { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .txt { padding: 0 44px; }
  .card .num { font-size: 30px; font-weight: 800; color: var(--red); letter-spacing: 4px; }
  .card .ttl { font-size: 54px; font-weight: 800; line-height: 1.08; color: var(--navy); margin-top: 10px; }
  .card .bar { height: 8px; width: 90px; background: var(--red); border-radius: 4px; margin-top: 22px; }
  .wm-pill { position: absolute; top: 56px; right: 56px; padding: 14px 26px; border-radius: 40px; background: rgba(23,37,84,.82);
             color: #fff; font-size: 24px; font-weight: 700; letter-spacing: 3px; z-index: 50; }
  .wm-pill b { color: #ff5a6a; }
  .wm-big { position: absolute; inset: -400px; display: flex; flex-wrap: wrap; align-content: center; justify-content: center;
            transform: rotate(-28deg); z-index: 49; pointer-events: none; opacity: .045; gap: 160px 200px; }
  .wm-big span { font-size: 64px; font-weight: 900; letter-spacing: 8px; color: #000; white-space: nowrap; }
</style>
<script src="../../engine/motion-lib.js"></script>
</head>
<body>
  <div id="bg" class="layer"></div>
  <svg id="deco" class="layer" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>

  <!-- Cena 1/2: complicado -> descomplicamos -->
  <div id="s1" class="layer">
    <div id="s1-seg" class="abs center-x" style="top:700px;font-size:190px;font-weight:900;letter-spacing:-4px">
      <span class="mask"><span>Seguros</span></span></div>
    <div id="s1-comp" class="abs center-x" style="top:930px;font-size:96px;font-weight:800;color:var(--red)">
      <span class="mask"><span>complicados?</span></span></div>
    <svg id="scribble" class="layer" width="1080" height="1920" viewBox="0 0 1080 1920">
      <path id="scr-path" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <img id="car" class="abs" src="assets/car.png" style="width:270px;left:0;top:0">
    <div id="s2-txt" class="abs center-x" style="top:600px;font-size:104px;font-weight:900;line-height:1.05"></div>
  </div>

  <!-- Cena 3: vantagens -->
  <div id="s3" class="layer">
    <div id="s3-head" class="abs center-x" style="top:290px;font-size:84px;font-weight:900;color:#fff">
      <span class="mask"><span>Com a Aliança</span></span></div>
    <div id="s3-sub" class="abs center-x" style="top:400px;font-size:40px;font-weight:600;color:#c9d2ee;letter-spacing:6px">
      <span class="mask"><span>SEGURO AUTOMÓVEL</span></span></div>
    <div class="card" id="c1" style="top:540px">
      <div class="pic" id="c1p" style="background:var(--navy)">
        <svg viewBox="0 0 360 360" id="price-ico">
          <rect width="360" height="360" fill="#e9ecf6"/>
          <g id="tag" transform="translate(180 185)">
            <path d="M-70 -95 H40 L95 -40 V95 H-70 Z" fill="var(--navy)" transform="rotate(-12)"/>
            <circle cx="10" cy="-55" r="14" fill="#e9ecf6" transform="rotate(-12)"/>
          </g>
          <g id="arrow" transform="translate(250 120)">
            <circle r="52" fill="var(--red)"/>
            <path d="M0 -26 V22 M-20 4 L0 24 L20 4" stroke="#fff" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          </g>
        </svg>
      </div>
      <div class="txt"><div class="num">01</div><div class="ttl">Preços mais competitivos</div><div class="bar"></div></div>
    </div>
    <div class="card" id="c2" style="top:940px">
      <div class="pic"><img id="c2i" src="assets/assistencia.png"></div>
      <div class="txt"><div class="num">02</div><div class="ttl">Assistência gratuita ao veículo</div><div class="bar"></div></div>
    </div>
    <div class="card" id="c3" style="top:1340px">
      <div class="pic"><img id="c3i" src="assets/vidros.png"></div>
      <div class="txt"><div class="num">03</div><div class="ttl">Proteção de vidros</div><div class="bar"></div></div>
    </div>
  </div>

  <!-- Cena 4: um ano -->
  <div id="s4" class="layer">
    <svg class="layer" width="1080" height="1920" viewBox="0 0 1080 1920">
      <circle id="s4-ring" cx="540" cy="800" r="330" fill="none" stroke="#fff" stroke-width="18" stroke-linecap="round"
              transform="rotate(-90 540 800)"/>
    </svg>
    <div id="s4-one" class="abs center-x" style="top:470px;font-size:560px;font-weight:900;color:#fff;line-height:1">1</div>
    <div id="s4-ano" class="abs center-x" style="top:1160px;font-size:110px;font-weight:900;color:#fff;letter-spacing:30px">ANO</div>
    <div id="s4-txt" class="abs center-x" style="top:1320px;font-size:62px;font-weight:700;color:#fff;line-height:1.25;padding:0 90px"></div>
  </div>

  <!-- Cena 5: assinatura -->
  <div id="s5" class="layer">
    <svg id="rings" class="layer" width="1080" height="1920" viewBox="0 0 1080 1920">
      <defs><clipPath id="bottomHalf"><rect x="-1000" y="0" width="3000" height="2000"/></clipPath></defs>
      <g id="rings-g">
        <circle id="ringA" r="150" fill="none" stroke="#172554" stroke-width="78"/>
        <circle id="ringB" r="150" fill="none" stroke="#B7021C" stroke-width="78"/>
        <circle id="ringA2" r="150" fill="none" stroke="#172554" stroke-width="78" clip-path="url(#bottomHalf)"/>
      </g>
    </svg>
    <img id="logo" class="abs" src="assets/logo.png" style="width:820px;left:130px;top:640px">
    <div id="s5-slogan" class="abs center-x" style="top:1010px;font-size:64px;font-weight:800">
      <span class="mask"><span>Proteção sem complicação!</span></span></div>
    <div id="s5-cta" class="abs" style="top:1180px;left:50%;transform:translateX(-50%);background:var(--red);color:#fff;
         font-size:46px;font-weight:800;padding:34px 64px;border-radius:70px;white-space:nowrap">Simule e contrate online</div>
    <div id="s5-url" class="abs center-x" style="top:1360px;font-size:46px;font-weight:600;letter-spacing:2px">aliancaseguros.cv</div>
  </div>

  <!-- transições -->
  <div id="wipe" class="layer" style="background:var(--navy)"></div>
  <svg id="iris" class="layer" width="1080" height="1920" viewBox="0 0 1080 1920"><circle id="iris-c" cx="540" cy="960" r="0"/></svg>

  <!-- marca d'água -->
  <div class="wm-big" id="wm-big"></div>
  <div class="wm-pill">EXEMPLAR · <b>EAGLE</b> MARKETING</div>

<script>
window.COMP = { width: 1080, height: 1920, fps: 30, duration: 18 };
const { p, lerp, clamp, set, easeOutCubic, easeInCubic, easeInOutCubic, easeOutExpo, easeInExpo, easeInOutExpo, easeOutBack, spring } = M;
const $ = (id) => document.getElementById(id);
const NAVY = '#172554', RED = '#B7021C', PAPER = '#F4F2F2';

// watermark tiles
$('wm-big').innerHTML = Array.from({ length: 40 }, () => '<span>EAGLE MARKETING</span>').join('');

// word builders
function words(el, parts) {
  el.innerHTML = parts.map(([w, c]) => `<span class="mask"><span style="color:${c || 'inherit'}">${w}</span></span>`).join(' ');
  return [...el.querySelectorAll('.mask > span')];
}
$('s2-txt').innerHTML = '<div><span class="mask"><span>Nós</span></span></div><div style="color:var(--red)"><span class="mask"><span>descomplicamos.</span></span></div>';
const s2w = [...$('s2-txt').querySelectorAll('.mask > span')];
const s4w = words($('s4-txt'), 'a descomplicar os seguros em Cabo Verde'.split(' ').map(w => [w]));

// reveal a masked word: k 0..1 in, o 0..1 out
function rev(el, k, o = 0) {
  const y = (1 - easeOutExpo(k)) * 110 - easeInExpo(o) * 110;
  set(el, { transform: `translateY(${y}%)` });
}

// scribble: prolate cycloid loops that straighten into a road
const N = 600;
function scribble(t) {
  const draw = easeInOutCubic(p(t, 0.7, 2.1));
  const straight = easeInOutExpo(p(t, 2.7, 3.7));
  const R = 85 * (1 - straight);
  const yc = lerp(905, 1250, straight);
  const x0 = lerp(120, -40, straight), x1 = lerp(960, 1120, straight);
  let d = '';
  const n = Math.max(2, Math.floor(N * draw));
  for (let i = 0; i < n; i++) {
    const s = i / (N - 1);
    const env = Math.sin(Math.PI * s);
    const r = R * (0.55 + 0.45 * env) * (1 + 0.25 * Math.sin(s * 23));
    const a = s * Math.PI * 2 * 7.5 + 2.2 * Math.sin(s * 9.3);
    const x = lerp(x0, x1, s) + r * Math.sin(a) * 1.15;
    const y = yc + r * Math.cos(a) * 1.35 + (1 - straight) * 26 * Math.sin(s * 11 + 1);
    d += (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1);
  }
  const path = $('scr-path');
  path.setAttribute('d', d);
  path.setAttribute('stroke', straight > 0.5 ? NAVY : RED);
  path.setAttribute('stroke-width', lerp(13, 12, straight));
  return yc;
}

function bg(t) {
  // paper -> navy (wipe at ~6.2) -> red (iris ~11.6) -> paper (iris ~14.6)
  let c = PAPER;
  if (t >= 6.45) c = NAVY;
  if (t >= 12.15) c = RED;
  if (t >= 15.1) c = PAPER;
  $('bg').style.background = c;
}

function deco(t) {
  // slow brand rings floating in the background
  const g = [];
  const col = t < 6.45 ? 'rgba(23,37,84,.06)' : t < 12.15 ? 'rgba(255,255,255,.06)' : t < 15.1 ? 'rgba(255,255,255,.08)' : 'rgba(23,37,84,.05)';
  const items = [[180, 260, 210], [930, 1650, 280], [980, 380, 120], [120, 1720, 150]];
  items.forEach(([x, y, r], i) => {
    const dy = Math.sin(t * 0.6 + i) * 30, dx = Math.cos(t * 0.5 + i * 2) * 20;
    g.push(`<circle cx="${x + dx}" cy="${y + dy}" r="${r}" fill="none" stroke="${col}" stroke-width="${40 + i * 8}"/>`);
  });
  $('deco').innerHTML = g.join('');
}

window.renderFrame = function (t) {
  bg(t); deco(t);

  // ---------- cena 1 + 2 ----------
  const s1on = t < 6.5;
  $('s1').style.display = s1on ? 'block' : 'none';
  if (s1on) {
    const segIn = p(t, 0.15, 0.75), out = p(t, 2.55, 3.0);
    rev($('s1-seg').querySelector('.mask>span'), segIn, out);
    rev($('s1-comp').querySelector('.mask>span'), p(t, 1.05, 1.6), p(t, 2.6, 3.05));
    // shake "complicados?" a bit while scribble is messy
    const shake = (t > 1.3 && t < 2.6) ? Math.sin(t * 60) * 4 : 0;
    $('s1-comp').style.transform = `translateX(${shake}px)`;

    const roadY = scribble(t);
    // car drives in on the road
    const carK = easeOutExpo(p(t, 3.2, 4.3));
    const carOut = easeInExpo(p(t, 5.55, 6.3));
    const cx = lerp(-320, 405, carK) + carOut * 900;
    const bounce = Math.abs(Math.sin(t * 18)) * 6 * (1 - carK * 0.7);
    set($('car'), { left: cx + 'px', top: (roadY - 247 - 6 - bounce) + 'px', opacity: t > 3.1 ? 1 : 0,
                    transform: `rotate(${(1 - carK) * -3}deg)` });

    s2w.forEach((w, i) => rev(w, p(t, 3.35 + i * 0.18, 3.95 + i * 0.18), p(t, 5.6 + i * 0.05, 6.0 + i * 0.05)));
  }

  // wipe paper -> navy
  const wk = easeInOutExpo(p(t, 5.95, 6.45)), wo = easeInOutExpo(p(t, 6.45, 6.9));
  set($('wipe'), { display: t > 5.9 && t < 6.95 ? 'block' : 'none',
                   clipPath: `polygon(0 ${100 - wk * 130}%, 100% ${130 - wk * 130}%, 100% 100%, 0 100%)`,
                   background: NAVY, opacity: 1 - wo });

  // ---------- cena 3 ----------
  const s3on = t >= 6.4 && t < 12.3;
  $('s3').style.display = s3on ? 'block' : 'none';
  if (s3on) {
    rev($('s3-head').querySelector('.mask>span'), p(t, 6.55, 7.1), p(t, 11.3, 11.7));
    rev($('s3-sub').querySelector('.mask>span'), p(t, 6.8, 7.3), p(t, 11.35, 11.75));
    ['c1', 'c2', 'c3'].forEach((id, i) => {
      const a = 7.1 + i * 0.75;
      const k = easeOutExpo(p(t, a, a + 0.9));
      const o = easeInExpo(p(t, 11.2 + i * 0.1, 11.75 + i * 0.1));
      const x = (1 - k) * 1150 - o * 1250;
      set($(id), { transform: `translateX(${x}px) rotate(${(1 - k) * 4}deg)` });
      const bar = $(id).querySelector('.bar');
      bar.style.width = (easeOutCubic(p(t, a + 0.4, a + 1.0)) * 120) + 'px';
    });
    // ken burns + icon motion
    const kb = (a) => `scale(${lerp(1.18, 1.0, easeOutCubic(p(t, a, a + 3)))})`;
    $('c2i').style.transform = kb(7.85);
    $('c3i').style.transform = kb(8.6);
    const ak = spring(p(t, 7.6, 8.8));
    $('arrow').setAttribute('transform', `translate(250 ${lerp(40, 120, ak)}) scale(${ak})`);
    $('tag').setAttribute('transform', `translate(180 185) rotate(${Math.sin(t * 2.2) * 4})`);
  }

  // iris to red at 11.6
  const iris = $('iris-c');
  const ir1 = easeInOutExpo(p(t, 11.65, 12.15)), ir2 = easeInOutExpo(p(t, 14.6, 15.1));
  if (t >= 11.6 && t < 12.2) { iris.setAttribute('r', ir1 * 1150); iris.setAttribute('fill', RED); $('iris').style.display = 'block'; }
  else if (t >= 14.55 && t < 15.15) { iris.setAttribute('r', ir2 * 1150); iris.setAttribute('fill', PAPER); $('iris').style.display = 'block'; }
  else $('iris').style.display = 'none';

  // ---------- cena 4 ----------
  const s4on = t >= 12.1 && t < 15.15;
  $('s4').style.display = s4on ? 'block' : 'none';
  if (s4on) {
    const sk = spring(p(t, 12.2, 13.2), 3.5, 5);
    const out = easeInCubic(p(t, 14.2, 14.7));
    set($('s4-one'), { transform: `scale(${sk * (1 + out * 0.6)})`, opacity: 1 - out });
    const ring = $('s4-ring'), L = 2 * Math.PI * 330;
    ring.setAttribute('stroke-dasharray', L);
    ring.setAttribute('stroke-dashoffset', L * (1 - easeInOutCubic(p(t, 12.45, 13.35))));
    ring.style.opacity = 1 - out;
    set($('s4-ano'), { opacity: easeOutCubic(p(t, 12.85, 13.3)) * (1 - out),
                       letterSpacing: lerp(80, 30, easeOutExpo(p(t, 12.85, 13.6))) + 'px' });
    s4w.forEach((w, i) => rev(w, p(t, 13.05 + i * 0.07, 13.55 + i * 0.07), p(t, 14.2, 14.55)));
  }

  // ---------- cena 5 ----------
  const s5on = t >= 15.0;
  $('s5').style.display = s5on ? 'block' : 'none';
  if (s5on) {
    const k = easeOutBack(easeOutCubic(p(t, 15.1, 16.0)), 1.1);
    const sep = lerp(520, 92, k);
    const cx = 540, cy = 820;
    const rot = (1 - easeOutCubic(p(t, 15.1, 16.0))) * 160;
    $('ringA').setAttribute('cx', cx - sep); $('ringA').setAttribute('cy', cy);
    $('ringA2').setAttribute('cx', cx - sep); $('ringA2').setAttribute('cy', cy);
    $('ringB').setAttribute('cx', cx + sep); $('ringB').setAttribute('cy', cy);
    document.querySelector('#bottomHalf rect').setAttribute('y', cy);
    // rings collapse to logo symbol position and fade into the real logo
    const m = easeInOutExpo(p(t, 16.2, 16.8));
    const gs = lerp(1, 0.48, m);
    const tx = lerp(cx, 279, m), ty = lerp(cy, 786, m);
    $('rings-g').setAttribute('transform', `translate(${tx} ${ty}) rotate(${rot}) scale(${gs}) translate(${-cx} ${-cy})`);
    $('rings').style.opacity = 1 - easeOutCubic(p(t, 16.65, 16.95));
    const lg = easeOutCubic(p(t, 16.55, 17.0));
    set($('logo'), { opacity: lg, transform: `scale(${lerp(0.96, 1, lg)})` });
    rev($('s5-slogan').querySelector('.mask>span'), p(t, 16.75, 17.25));
    const ck = easeOutBack(p(t, 17.0, 17.45));
    set($('s5-cta'), { transform: `translateX(-50%) scale(${ck})` });
    $('s5-url').style.opacity = easeOutCubic(p(t, 17.25, 17.6));
  }
};
window.renderFrame(0);
</script>
</body>
</html>
