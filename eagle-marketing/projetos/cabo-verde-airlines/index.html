  ring.position.copy(b.clone().multiplyScalar(1.004)); ring.lookAt(b.clone().multiplyScalar(2)); globe.add(ring);
  const dot = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
  dot.position.copy(b.clone().multiplyScalar(1.006)); dot.scale.setScalar(0.05); globe.add(dot);
  Object.assign(d, { curve, mesh, head, ring, dot, count: tube.index.count, end: b });
  const lab = document.createElement('div'); lab.className = 'label';
  lab.innerHTML = `<div class="line"></div><div class="box"><div class="n">${d.name}</div><div class="pr">desde <b>${d.price}$</b></div></div>`;
  $('labels').appendChild(lab); d.lab = lab;
});
const hubSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: 0xffd27a, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
hubSprite.position.copy(a0.clone().multiplyScalar(1.01)); globe.add(hubSprite);
const hubLab = document.createElement('div'); hubLab.className = 'label';
hubLab.innerHTML = `<div class="box" style="top:18px"><div class="n" style="font-size:30px;letter-spacing:7px;color:#F6CB6B;font-weight:700">CABO VERDE</div></div>`;
$('labels').appendChild(hubLab);

const sceneO = new THREE.Scene();
const whiteMat = new THREE.MeshBasicMaterial({ color: 0xe6eeff, transparent: true, opacity: 0, depthTest: false });
const whiteQ = new THREE.Mesh(new THREE.PlaneGeometry(W, H), whiteMat); whiteQ.position.set(W / 2, H / 2, 0); sceneO.add(whiteQ);
const composer = new EffectComposer(renderer);
const passA = new RenderPass(sceneA, camA), passB = new RenderPass(sceneB, camB);
composer.addPass(passA); composer.addPass(passB);
const passO = new RenderPass(sceneO, camA); passO.clear = false; passO.clearDepth = true;
const bloom = new UnrealBloomPass(new THREE.Vector2(W / 2, H / 2), 0.9, 0.55, 0.62); composer.addPass(bloom);
composer.insertPass(passO, 2);
composer.addPass(new OutputPass());
composer.setSize(W, H);

// orientação: Cabo Verde ligeiramente abaixo do centro, Atlântico Norte à vista
function aimGlobe(lon, lat) {
  const q1 = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), -(lon + 90) * Math.PI / 180);
  const q2 = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), lat * Math.PI / 180);
  globe.quaternion.copy(q2.multiply(q1));
}
const tmp = new THREE.Vector3();
function project(v3) { tmp.copy(v3).applyMatrix4(globe.matrixWorld).project(camB); return [(tmp.x + 1) / 2 * W, (1 - tmp.y) / 2 * H, tmp.z]; }

window.renderFrame = function (t) {
  const inA = t < 6.3, inB = t >= 5.9 && t < 15.0;

  // ---------------- Cena A ----------------
  passA.enabled = inA; passB.enabled = !inA && inB; bloom.enabled = !inA; passB.clear = true; passA.clear = true;
  $('A').style.display = inA ? 'block' : 'none';
  if (inA) {
    skyMat.uniforms.uT.value = t; cloudMid.uniforms.uT.value = t; cloudNear.uniforms.uT.value = t; cloudWisp.uniforms.uT.value = t;
    const push = eInCubic(p(t, 4.7, 6.3));
    const white = eInOut(p(t, 5.0, 6.25));
    cloudNear.uniforms.uWhite.value = white; cloudWisp.uniforms.uWhite.value = eInOut(p(t, 4.6, 6.0)) * .9;
    const enter = eOutExpo(p(t, 0, 2.2));
    // o avião fica sempre com a cauda fora do quadro (lado esquerdo)
    const bobY = Math.sin(t * 1.6) * 10 + Math.sin(t * 3.7) * 4;
    const sc = lerp(0.82, 1.0, enter) * (1 + push * 1.6) * (1 + eInOut(p(t, 1.2, 5.2)) * 0.09);
    // borda esquerda da imagem (onde o recorte corta a asa) sempre fora do quadro
    const leftEdge = lerp(-760, -40, enter) - push * 380 - eInOut(p(t, 1.2, 5.2)) * 70;
    const py = H - lerp(1180, 900, enter) + bobY + push * 160;
    plane.position.set(leftEdge + (PW * sc) / 2, py, 0);
    plane.scale.setScalar(sc); plane.rotation.z = (Math.sin(t * 1.1) * 0.7 + (1 - enter) * 6 + eInOut(p(t, 1.5, 5.5)) * 2.2) * Math.PI / 180;
    haze.position.copy(plane.position); haze.scale.copy(plane.scale); haze.rotation.z = plane.rotation.z;
    whiteMat.opacity = eInCubic(p(t, 5.85, 6.3));
    letters(A1, t, 1.6, { stagger: 0.03, dur: 1.1, out: 4.7, rise: 30, blur: 16 });
    letters(A2, t, 1.95, { stagger: 0.04, dur: 1.2, out: 4.8, rise: 50, blur: 24 });
    $('A2').style.letterSpacing = lerp(18, -4, eOutExpo(p(t, 1.95, 3.6))) + 'px';
  }

  // ---------------- Cena B ----------------
  $('B').style.display = inB && !inA ? 'block' : 'none';
  if (inB && !inA) {
    bloom.strength = 1.0; bloom.threshold = 0.55; bloom.radius = 0.6;
    whiteMat.opacity = Math.max(1 - eOutCubic(p(t, 6.3, 6.95)), eInOut(p(t, 14.1, 14.8)));
    const k = eInOut(p(t, 6.25, 10.0));
    // aproxima-se de Cabo Verde vindo das nuvens e recua para ver o mundo
    const dist = lerp(1.65, 5.6, k);
    const fin = eInOut(p(t, 13.7, 14.95));
    camB.position.set(0, 0.32 * k * (1 - fin), dist * (1 - fin * 0.55));
    camB.lookAt(0, 0.32 * k * (1 - fin), 0);
    aimGlobe(lerp(lerp(CV.lon, -36 + (t - 9) * 0.8, k), CV.lon, fin), lerp(lerp(CV.lat, 22, k), CV.lat, fin));
    globe.updateMatrixWorld(true);
    const intro = eOutCubic(p(t, 6.0, 6.8));
    $('B').style.opacity = intro * (1 - eInCubic(p(t, 14.2, 14.9)));
    letters(B1, t, 7.0, { stagger: 0.03, dur: 1.0, out: 13.6, rise: 26, blur: 14 });
    letters(B2, t, 7.3, { stagger: 0.03, dur: 1.1, out: 13.65, rise: 36, blur: 20 });
    hubSprite.scale.setScalar((0.012 + Math.sin(t * 5) * 0.002) * camB.position.z);
    const [hx, hy] = project(a0.clone().multiplyScalar(1.01));
    hubLab.style.left = (hx - 112) + 'px'; hubLab.style.top = hy + 'px';
    hubLab.style.opacity = eOutCubic(p(t, 7.6, 8.2)) * (1 - eInCubic(p(t, 13.6, 14.1)));
    DEST.forEach((d) => {
      const g = eInOut(p(t, d.t, d.t + 1.25));
      d.mesh.geometry.setDrawRange(0, Math.floor(d.count * g / 6) * 6);
      d.mesh.visible = g > 0;
      const hp = d.curve.getPointAt(Math.min(0.999, g));
      d.head.position.copy(hp); d.head.material.opacity = g > 0 && g < 1 ? 1 : 0;
      const arrive = p(t, d.t + 1.2, d.t + 2.2);
      const pulse = (t - d.t - 1.2) % 1.4 / 1.4;
      d.ring.scale.setScalar(arrive > 0 ? 1 + pulse * 2.2 : 0.001); d.ring.material.opacity = arrive > 0 ? (1 - pulse) * .8 : 0;
      d.dot.material.opacity = eOutCubic(arrive);
      const [x, y, z] = project(d.end.clone().multiplyScalar(1.006));
      const lk = eOutExpo(p(t, d.t + 1.25, d.t + 2.1)), lo = eInCubic(p(t, 13.5, 14.0));
      const len = 70 * lk;
      const line = d.lab.querySelector('.line'), box = d.lab.querySelector('.box');
      const reveal = 1 - eOutExpo(p(t, d.t + 1.45, d.t + 2.3));
      if (d.side === 0) {
        // etiqueta por cima do ponto, com linha vertical
        d.lab.style.left = x + 'px'; d.lab.style.top = (y - 16) + 'px';
        line.style.width = '2px'; line.style.height = '46px'; line.style.top = '-46px';
        line.style.transformOrigin = '50% 100%'; line.style.transform = `scaleY(${lk})`;
        box.style.left = '0'; box.style.right = 'auto'; box.style.top = '-150px'; box.style.textAlign = 'center';
        box.style.transform = 'translateX(-50%)';
        box.style.clipPath = `inset(0 0 ${reveal * 100}% 0)`;
      } else {
        d.lab.style.left = (d.side > 0 ? x + 14 : x - 14 - 70) + 'px'; d.lab.style.top = y + 'px';
        line.style.width = '70px'; line.style.transform = `scaleX(${lk})`;
        line.style.transformOrigin = d.side > 0 ? '0 50%' : '100% 50%';
        if (d.side > 0) { box.style.left = '84px'; box.style.right = 'auto'; box.style.textAlign = 'left'; }
        else { box.style.left = 'auto'; box.style.right = '84px'; box.style.textAlign = 'right'; }
        box.style.clipPath = `inset(0 ${d.side > 0 ? reveal * 100 : 0}% 0 ${d.side < 0 ? reveal * 100 : 0}%)`;
      }
      d.lab.style.opacity = (z < 1 ? 1 : 0) * (1 - lo);
    });
  }

  // ---------------- Cena C ----------------
  const inC = t >= 14.95 && t < 18.45;
  $('C').style.display = inC ? 'block' : 'none';
  if (inC) {
    const ink = eOutCubic(p(t, 14.95, 15.6)), out = eInCubic(p(t, 17.8, 18.3));
    $('C').style.opacity = 1;
    $('C').style.filter = `brightness(${(1 + (1 - ink) * 1.6).toFixed(2)})`;
    $('sal').style.transform = `scale(${lerp(1.22, 1.04, eOutCubic(p(t, 14.6, 18.3)))}) translateY(${lerp(30, 0, p(t, 14.6, 18.3))}px)`;
    $('leak').style.opacity = 0.6 + 0.4 * Math.sin(t * 2);
    $('C0').style.transform = `scale(${eOutBack(p(t, 15.0, 15.4))})`;
    letters(C1, t, 15.15, { stagger: 0.035, dur: 0.9, out: 17.7, center: false, rise: 30, blur: 14 });
    const ar = eOutExpo(p(t, 15.5, 16.2));
    $('Carrow').style.opacity = ar; $('Carrow').style.transform = `rotate(${(1 - ar) * -180}deg)`;
    letters(C2, t, 15.55, { stagger: 0.06, dur: 1.0, out: 17.75, center: false, rise: 60, blur: 22 });
    letters(C3, t, 16.0, { stagger: 0.015, dur: 0.8, out: 17.75, center: false, rise: 16, blur: 8 });
    const pk = eOutExpo(p(t, 16.3, 17.1));
    $('Cprice').style.opacity = pk * (1 - out); $('Cprice').style.transform = `translateY(${(1 - pk) * 80}px)`;
  }

  // ---------------- Cena D ----------------
  const inD = t >= 17.9;
  $('D').style.display = inD ? 'block' : 'none';
  if (inD || (t >= 14.95 && t < 17.9)) { passA.enabled = false; passB.enabled = false; }
  if (inD) {
    document.body.style.background = '#04215e';
    $('D').style.background = 'radial-gradient(120% 70% at 50% 35%, #0b4fb0 0%, #04215e 55%, #021338 100%)';
    const cur = eInOutExpo(p(t, 17.9, 18.45)); $('D').style.clipPath = `inset(${((1 - cur) * 100).toFixed(2)}% 0 0 0)`;
    // logótipo revelado por uma varredura de luz da esquerda para a direita
    const lw = eOutExpo(p(t, 18.3, 19.4));
    $('logoWrap').style.clipPath = `inset(-20px ${((1 - lw) * 100).toFixed(2)}% -20px 0)`;
    $('logoWrap').style.filter = lw < 1 ? `blur(${((1 - eOutCubic(p(t, 18.3, 19.0))) * 8).toFixed(2)}px)` : 'none';
    $('logoWrap').style.transform = `translateX(${((1 - lw) * -30).toFixed(1)}px)`;
    letters(D1, t, 18.9, { stagger: 0.02, dur: 0.8, rise: 14, blur: 8 });
    const pk = eOutExpo(p(t, 19.05, 19.8));
    $('D2').style.opacity = pk; $('D2').style.filter = `blur(${((1 - pk) * 16).toFixed(1)}px)`; $('D2').style.transform = `scale(${lerp(1.12, 1, pk)})`;
    $('Dcta').style.transform = `translateX(-50%) scale(${eOutBack(p(t, 19.6, 20.1))})`;
    $('shine').style.left = lerp(-160, 520, eInOut(p(t, 20.1, 20.8))) + 'px';
    $('Durl').style.opacity = eOutCubic(p(t, 19.9, 20.4));
    $('Dnote').style.opacity = eOutCubic(p(t, 20.1, 20.6)) * .9;
  } else { document.body.style.background = '#020b24'; }

  if (passA.enabled || passB.enabled) { $('gl').style.display = 'block'; composer.render(); }
  else $('gl').style.display = 'none';
};
window.renderFrame(0);
window.READY = true;
</script>
