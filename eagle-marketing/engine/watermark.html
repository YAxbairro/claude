<!doctype html>
<html><head><meta charset="utf-8"><style>
  @font-face { font-family: 'Outfit'; src: url('../projetos/cabo-verde-airlines/assets/outfit.woff2') format('woff2'); font-weight: 100 900; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: transparent; font-family: 'Outfit', sans-serif; }
  .wm-pill { position: absolute; top: 56px; right: 56px; padding: 14px 26px; border-radius: 40px; background: rgba(0,0,0,.4);
             color: #fff; font-size: 24px; font-weight: 600; letter-spacing: 3px; }
  .wm-pill b { color: #F6CB6B; }
  .wm-big { position: absolute; inset: -400px; display: flex; flex-wrap: wrap; align-content: center; justify-content: center;
            transform: rotate(-28deg); opacity: .05; gap: 160px 200px; }
  .wm-big span { font-size: 64px; font-weight: 900; letter-spacing: 8px; color: #fff; white-space: nowrap; }
</style></head><body>
  <div class="wm-big" id="b"></div>
  <div class="wm-pill">EXEMPLAR · <b>EAGLE</b> MARKETING</div>
  <script>document.getElementById('b').innerHTML = Array.from({ length: 40 }, () => '<span>EAGLE MARKETING</span>').join('');</script>
</body></html>
