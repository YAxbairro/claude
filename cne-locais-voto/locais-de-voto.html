/* Layout: header band, then a split view — station list on the left, vector map on the right; stacks map-over-list on phones. */
:root{
  --ink:#0d1b3d; --muted:#56627a; --line:#d5dbe6; --paper:#ffffff; --panel:#f4f6fa;
  --accent:#0b3a8f;           /* azul da bandeira */
  --alt:#c8102e;              /* vermelho: local alterado */
  --alt-soft:#fde8eb;
  --star:#f2c200;
  --sea:#dfe8f2; --land:#fbfcfe; --land2:#eef1f6; --border:#b3bfd1;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Public Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ink:#e8edf7; --muted:#9aa6bd; --line:#2a3650; --paper:#111a2c; --panel:#0c1424;
  --accent:#7fa6ff; --alt:#ff5a6e; --alt-soft:#3a1720; --star:#f2c200;
  --sea:#0a1220; --land:#1a2539; --land2:#141d2e; --border:#33435f; color-scheme:dark}}
:root[data-theme="dark"]{
  --ink:#e8edf7; --muted:#9aa6bd; --line:#2a3650; --paper:#111a2c; --panel:#0c1424;
  --accent:#7fa6ff; --alt:#ff5a6e; --alt-soft:#3a1720; --star:#f2c200;
  --sea:#0a1220; --land:#1a2539; --land2:#141d2e; --border:#33435f; color-scheme:dark}

html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.top{padding-block:18px 14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 32px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px;font-weight:700}
.stars{display:inline-flex;gap:2px}
.stars i{width:6px;height:6px;border-radius:50%;background:var(--star);display:block}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,4vw,38px);line-height:1.05;margin:6px 0 0;letter-spacing:-.01em;text-wrap:balance}
.stats{display:flex;flex-wrap:wrap;gap:6px 22px;font-variant-numeric:tabular-nums}
.stat b{font-family:var(--f-display);font-size:22px;font-weight:800;display:block;line-height:1}
.stat span{font-size:12px;color:var(--muted)}
.stat.alt b{color:var(--alt)}

.app{display:grid;grid-template-columns:minmax(300px,390px) 1fr;height:calc(100% - var(--hdr,96px));min-height:520px}
.panel{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;min-height:0}
.controls{padding:14px 16px 10px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.search{position:relative}
.search input{width:100%;font:inherit;font-size:16px;padding:11px 12px 11px 38px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}
.search input:focus{border-color:var(--accent);outline:none}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{font:inherit;font-size:13px;font-weight:700;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);padding:6px 12px;border-radius:999px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.seg button.altbtn[aria-pressed="true"]{background:var(--alt);border-color:var(--alt);color:#fff}
.seg .n{font-variant-numeric:tabular-nums;opacity:.75;font-weight:400}

.list{overflow-y:auto;flex:1;padding:4px 0 24px;min-height:0}
.group h2{font-family:var(--f-display);font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0;padding:14px 16px 6px;position:sticky;top:0;background:var(--panel);z-index:1}
.item{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:none;border:0;border-left:4px solid transparent;padding:9px 16px 9px 12px;cursor:pointer}
.item:hover{background:var(--land2)}
.item.on{background:var(--paper);border-left-color:var(--accent)}
.item.alt{border-left-color:var(--alt)}
.item .row{display:flex;align-items:baseline;gap:8px;justify-content:space-between}
.item .nm{font-weight:700;font-size:15px}
.item .lc{color:var(--muted);font-size:13px;display:block;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--alt);background:var(--alt-soft);padding:2px 7px;border-radius:4px;white-space:nowrap}
.meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{padding:24px 16px;color:var(--muted)}

.mapwrap{position:relative;min-width:0;min-height:0}
#map{position:absolute;inset:0;background:var(--sea)}
.leaflet-container{background:var(--sea);font-family:var(--f-body)}
.views{position:absolute;top:12px;right:12px;z-index:500;display:flex;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:4px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.views button{font:inherit;font-size:13px;font-weight:700;border:0;background:none;color:var(--ink);padding:6px 10px;border-radius:7px;cursor:pointer}
.views button:hover{background:var(--land2)}
.views button[aria-pressed="true"]{background:var(--accent);color:var(--paper)}
.legend{position:absolute;left:12px;bottom:12px;z-index:500;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12.5px;display:grid;gap:5px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.legend div{display:flex;align-items:center;gap:8px}
.leaflet-control-zoom a{background:var(--paper)!important;color:var(--ink)!important;border-color:var(--line)!important}
.leaflet-control-attribution{background:color-mix(in srgb,var(--paper) 80%,transparent)!important;color:var(--muted)!important;font-size:10px}
.leaflet-control-attribution a{color:var(--muted)!important}

.pin{display:block;border-radius:50%;background:var(--accent);border:2.5px solid var(--paper);box-shadow:0 1px 4px rgba(0,0,0,.35);width:100%;height:100%}
.pin.alt{background:var(--alt)}
.pinwrap.alt::before{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid var(--alt);opacity:.55;animation:ring 2.2s ease-out infinite}
.pinwrap{position:relative}
.pinwrap.dim{opacity:.22}
.pinwrap.sel .pin{box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 35%,transparent),0 1px 4px rgba(0,0,0,.35)}
@keyframes ring{0%{transform:scale(.6);opacity:.7}100%{transform:scale(1.5);opacity:0}}
@media (prefers-reduced-motion:reduce){.pinwrap.alt::before{animation:none;opacity:.5}}
.lg-dot{width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--paper);box-shadow:0 0 0 1px var(--line)}
.lg-dot.alt{background:var(--alt);width:15px;height:15px}

.leaflet-popup-content-wrapper{background:var(--paper);color:var(--ink);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.leaflet-popup-tip{background:var(--paper)}
.leaflet-popup-content{margin:14px 16px;font-size:14px;line-height:1.45;width:min(300px,72vw)!important}
.leaflet-container a.leaflet-popup-close-button{color:var(--muted)}
.pop h3{font-family:var(--f-display);font-weight:800;font-size:20px;margin:4px 0 0;line-height:1.1}
.pop .cc{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.pop p{margin:8px 0}
.pop .mesas{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.pop .mesa{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:6px;padding:3px 7px;background:var(--panel)}
.pop .mesa small{font-family:var(--f-body);color:var(--muted)}
.pop .note{font-size:13px;background:var(--alt-soft);border-radius:8px;padding:7px 9px}
.pop .note.info{background:var(--panel)}
.pop .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pop .acts a,.pop .acts button{font:inherit;font-size:13px;font-weight:700;border-radius:8px;padding:8px 11px;cursor:pointer;text-decoration:none;border:1.5px solid var(--accent)}
.pop .acts a{background:var(--accent);color:var(--paper)!important}
.pop .acts button{background:none;color:var(--accent)}
.lbl{background:none;border:0;box-shadow:none;color:var(--muted);font-family:var(--f-display);font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:0;text-shadow:0 0 3px var(--land),0 0 3px var(--land)}
.lbl::before{display:none}
.tip{font-family:var(--f-body);font-weight:700;font-size:12.5px;background:var(--paper);color:var(--ink);border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.tip::before{display:none}

.foot{font-size:12px;color:var(--muted);padding:10px 16px;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;font-weight:700;font-size:13px;z-index:2000}

@media (max-width:760px){
  html,body{height:auto}
  .app{display:flex;flex-direction:column;height:auto}
  .mapwrap{height:62vh;min-height:360px;order:-1}
  .panel{border-right:0}
  .list{overflow:visible}
  .stats{gap:6px 16px}
  .stat b{font-size:19px}
  .views{top:10px;right:10px}
  .legend{display:none}
}
</style>

<header class="top" id="top">
  <div>
    <div class="eyebrow"><span class="stars" aria-hidden="true"><i></i><i></i><i></i></span>Eleição Presidencial de Cabo Verde · 15 de novembro de 2026</div>
    <h1>Onde votar em Portugal</h1>
  </div>
  <div class="stats" id="stats"></div>
</header>

<main class="app">
  <aside class="panel" aria-label="Lista de postos de votação">
    <div class="controls">
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <input id="q" type="search" placeholder="Procura a tua localidade ou escola" autocomplete="off" aria-label="Procurar posto de votação">
      </label>
      <div class="seg" role="group" aria-label="Filtro">

new MutationObserver(paint).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

const labels=L.layerGroup(CONCELHOS.features.filter(f=>f.properties.aml).map(f=>
  L.tooltip({permanent:true,direction:'center',className:'lbl',interactive:false}).setLatLng(f.properties.lp).setContent(f.properties.nome)));
const METRO=L.latLngBounds([38.3,-9.65],[39.35,-8.4]);
function layerVis(){
  const z=map.getZoom(), inMetro=METRO.contains(map.getCenter());
  const hidePt=z>=9.5&&inMetro;
  if(hidePt&&map.hasLayer(ptLayer))map.removeLayer(ptLayer);
  if(!hidePt&&!map.hasLayer(ptLayer)){ptLayer.addTo(map);ptLayer.bringToBack();}
  const showL=z>=10&&inMetro;
  if(showL&&!map.hasLayer(labels))labels.addTo(map);
  if(!showL&&map.hasLayer(labels))map.removeLayer(labels);
}
map.on('zoomend moveend',layerVis);

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function gmaps(p){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p.gq)}
function shareText(p){
  return `Eleição Presidencial de Cabo Verde, 15 de novembro de 2026\nPosto: ${p.posto} (${p.concelho})\nLocal de voto: ${p.local}\nMesas: ${p.mesas.map(m=>m[0]).join(', ')}\nMapa: ${gmaps(p)}`+(p.alt?`\nAtenção: este local de voto mudou.`:'');
}
function popup(p){
  return `<div class="pop">
    ${p.alt?'<span class="tag">Local alterado</span>':''}
    <h3>${esc(p.posto)}</h3><div class="cc">${esc(p.concelho)}</div>
    <p>${esc(p.local)}</p>
    <div class="mesas">${p.mesas.map(m=>`<span class="mesa">${esc(m[0])} <small>· ${fmt(m[1])} eleitores</small></span>`).join('')}</div>
    ${p.nota?`<div class="note ${p.aprox?'':'info'}">${esc(p.nota)}</div>`:''}
    <div class="acts"><a href="${gmaps(p)}" target="_blank" rel="noopener">Abrir no Google Maps</a><button type="button" data-copy="${p.id}">Copiar informação</button></div>
  </div>`;
}
const markers={};
POSTOS.forEach(p=>{
  const s=p.alt?18:13;
  const icon=L.divIcon({className:'',iconSize:[s,s],iconAnchor:[s/2,s/2],popupAnchor:[0,-s/2],
    html:`<span class="pinwrap ${p.alt?'alt':''}" style="display:block;width:${s}px;height:${s}px"><span class="pin ${p.alt?'alt':''}"></span></span>`});
  const m=L.marker([p.lat,p.lon],{icon,title:p.posto,riseOnHover:true,zIndexOffset:p.alt?1000:0,keyboard:true})
    .bindPopup(()=>popup(p),{maxWidth:320,autoPanPaddingTopLeft:[20,70]})
    .bindTooltip(p.posto,{direction:'top',offset:[0,-s/2],className:'tip'})
    .on('click',()=>select(p.id,false));
  m.addTo(map); markers[p.id]=m;
});

const VIEWS={pt:L.latLngBounds([36.95,-9.55],[42.15,-6.2]),lx:L.latLngBounds([38.5,-9.42],[38.9,-8.95]),az:L.latLngBounds([37.65,-28.9],[38.85,-25.1])};
const vbtn=[...document.querySelectorAll('.views button')];
function view(v,anim){vbtn.forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v));map.flyToBounds(VIEWS[v],{padding:[20,20],animate:!!anim,duration:.8});}
vbtn.forEach(b=>b.addEventListener('click',()=>view(b.dataset.v,true)));
map.on('dragstart',()=>vbtn.forEach(b=>b.setAttribute('aria-pressed','false')));
map.fitBounds(VIEWS.pt,{padding:[20,20]}); layerVis();

// list
const listEl=document.getElementById('list'), q=document.getElementById('q');
let onlyAlt=false, sel=null;
function render(){
  const t=norm(q.value.trim());
  const vis=POSTOS.filter(p=>(!onlyAlt||p.alt)&&(!t||p.key.includes(t)));
  const ids=new Set(vis.map(p=>p.id));
  POSTOS.forEach(p=>{const el=markers[p.id].getElement();if(el)el.firstChild.classList.toggle('dim',!ids.has(p.id));});
  if(!vis.length){listEl.innerHTML=`<div class="empty">Nenhum posto encontrado para “${esc(q.value)}”. Experimenta o nome da cidade ou da freguesia.</div>`;return}
  const groups={};vis.forEach(p=>(groups[p.concelho]=groups[p.concelho]||[]).push(p));
  listEl.innerHTML=Object.keys(groups).sort((a,b)=>a.localeCompare(b,'pt')).map(c=>`<section class="group"><h2>${esc(c)}</h2>${groups[c].map(p=>
    `<button class="item ${p.alt?'alt':''} ${sel===p.id?'on':''}" data-id="${p.id}"><span class="row"><span class="nm">${esc(p.posto)}</span>${p.alt?'<span class="tag">Alterado</span>':`<span class="meta">${p.mesas.length>1?p.mesas.length+' mesas':'1 mesa'}</span>`}</span><span class="lc">${esc(p.local)}</span></button>`).join('')}</section>`).join('');
  if(t&&vis.length<=12){map.flyToBounds(L.latLngBounds(vis.map(p=>[p.lat,p.lon])).pad(.3),{maxZoom:13,duration:.6});}
}
function select(id,fly){
  sel=id;const p=POSTOS[id];
  POSTOS.forEach(x=>{const el=markers[x.id].getElement();if(el)el.firstChild.classList.toggle('sel',x.id===id)});
  listEl.querySelectorAll('.item').forEach(b=>b.classList.toggle('on',+b.dataset.id===id));
  if(fly){
    if(matchMedia('(max-width:760px)').matches)document.querySelector('.mapwrap').scrollIntoView({behavior:'smooth',block:'start'});
    map.flyTo([p.lat,p.lon],Math.max(map.getZoom(),13.5),{duration:.8});
    map.once('moveend',()=>markers[id].openPopup());
  }
}
listEl.addEventListener('click',e=>{const b=e.target.closest('.item');if(b)select(+b.dataset.id,true)});
let tmr;q.addEventListener('input',()=>{clearTimeout(tmr);tmr=setTimeout(render,180)});
const fa=document.getElementById('f-all'),ft=document.getElementById('f-alt');
fa.onclick=()=>{onlyAlt=false;fa.setAttribute('aria-pressed',true);ft.setAttribute('aria-pressed',false);render()};
ft.onclick=()=>{onlyAlt=true;ft.setAttribute('aria-pressed',true);fa.setAttribute('aria-pressed',false);render();
  map.flyToBounds(L.latLngBounds(alt.map(p=>[p.lat,p.lon])).pad(.15),{duration:.8});};

function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-copy]');if(!b)return;
  const txt=shareText(POSTOS[+b.dataset.copy]);
  navigator.clipboard.writeText(txt).then(()=>toast('Informação copiada. Cola no WhatsApp.'),()=>{
    const ta=document.createElement('textarea');ta.value=txt;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');toast('Informação copiada.')}catch(_){toast('Seleciona e copia o texto manualmente.')}ta.remove();
  });
});
render();
})();
</script>
