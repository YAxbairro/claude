<!doctype html><html><head><meta charset="utf-8">
<!-- Final do Apelo/Proibições (70,6–91 s), refeito com movimento. Logos dos cantos vêm do segs3.py. -->
<style>
@font-face{font-family:M;font-weight:800;src:url(../fonts/M800.ttf)}
@font-face{font-family:M;font-weight:700;src:url(../fonts/M700.ttf)}
*{margin:0;padding:0;box-sizing:border-box}html,body{width:1920px;height:1080px;overflow:hidden;font-family:M;font-weight:800}
#bg{position:absolute;inset:0;background:radial-gradient(ellipse 1300px 900px at 40% 50%,#1496CC 0%,#0B5AA0 100%)}
.orb{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.16),rgba(255,255,255,0) 70%)}
.sc{position:absolute;inset:0;visibility:hidden}
.col{position:absolute;left:1060px;top:0;height:1080px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:10px}
.t{position:relative;display:inline-block;color:#fff;white-space:nowrap;padding:.16em .26em .08em;line-height:1}
.t.plain{text-shadow:0 4px 14px rgba(0,15,50,.45);padding-left:0}
.t .bx{position:absolute;inset:0;transform-origin:0 50%;box-shadow:0 8px 18px rgba(0,10,40,.3)}
.t.navy .bx{background:#19296D}.t.red .bx{background:#D4292E}
.t span{position:relative;display:inline-block}
svg{position:absolute;overflow:visible}
#card{position:absolute;inset:0;background:#E9F1F8;visibility:hidden}
.stripe{position:absolute;left:0;right:0;height:0}
</style></head><body><div id="bg"></div><div class="orb" id="o1" style="left:-200px;top:-200px;width:1100px;height:1100px"></div><div class="orb" id="o2" style="left:1100px;top:400px;width:1000px;height:1000px"></div>
<div class="sc" id="s1"></div><div class="sc" id="s2"></div><div class="sc" id="s3"></div><div id="card"></div>
<script src="gsap.min.js"></script><script>
const tl=gsap.timeline({paused:true}),NS='http://www.w3.org/2000/svg';
const el=(tg,c,p,css)=>{const e=document.createElement(tg);if(c)e.className=c;if(css)e.style.cssText=css;p.appendChild(e);return e};
const svg=(p,css,vb,inner)=>{const s=document.createElementNS(NS,'svg');s.setAttribute('viewBox',vb);s.style.cssText=css;s.innerHTML=inner;p.appendChild(s);
  s.querySelectorAll('.d').forEach(e=>{e.setAttribute('pathLength','1');e.style.strokeDasharray='1 1.02'});return s};
function T(p,text,st,sz,t,punch){const l=el('div','t '+st,p);l.style.fontSize=sz+'px';const bx=el('div','bx',l);
  text.split(' ').forEach((w,i)=>{const s=el('span','',l);s.textContent=w+(i<text.split(' ').length-1?' ':'')});
  const ws=l.querySelectorAll('span');tl.set(l,{opacity:0},0);tl.set(l,{opacity:1},t);
  if(st!='plain')tl.fromTo(bx,{scaleX:0},{scaleX:1,duration:.45,ease:'expo.out'},t);
  tl.fromTo(ws,{y:sz*.6,opacity:0},{y:0,opacity:1,duration:.5,ease:'power3.out',stagger:.07},t+.08);
  if(punch)tl.fromTo(l,{scale:1.35,transformOrigin:'0% 50%'},{scale:1,duration:.6,ease:'back.out(2)'},t);
  return l}
function show(id,a,b){tl.set('#'+id,{visibility:'visible'},a);if(b)tl.set('#'+id,{visibility:'hidden'},b)}
// ---------- 1 · NO DIA 15 · PARTICIPE · VOTE LIVREMENTE · RESPEITE AS REGRAS (71,0–76,4) ----------
const s1=document.getElementById('s1');show('s1',70.6,76.45);
const urn=svg(s1,'left:170px;top:250px;width:760px;height:640px','0 0 380 320',`
 <g fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
  <path class="d" d="M60,150 L320,150 L350,190 L30,190 Z"/><path class="d" d="M130,170 L250,170"/>
  <path class="d" d="M40,215 L340,215" stroke="#D4292E"/><path class="d" d="M40,240 L340,240"/></g>
 <g id="ballot"><rect x="140" y="20" width="100" height="110" rx="6" fill="#D4292E" transform="rotate(-12 190 75)"/>
  <path d="M168,52 L212,98 M212,52 L168,98" stroke="#fff" stroke-width="13" stroke-linecap="round" transform="rotate(-12 190 75)"/></g>`);
tl.fromTo(urn.querySelectorAll('.d'),{strokeDashoffset:1},{strokeDashoffset:0,duration:.7,ease:'power2.inOut',stagger:.12},71.1);
const bal=urn.querySelector('#ballot');tl.fromTo(bal,{y:-420,opacity:0},{y:-40,opacity:1,duration:.7,ease:'power3.out'},72.9);
tl.to(bal,{y:28,duration:.45,ease:'power2.in'},73.75);tl.to(bal,{y:12,duration:.35,ease:'back.out(3)'},74.2);
tl.fromTo(urn,{rotation:0},{rotation:-2,duration:.12,yoyo:true,repeat:1,transformOrigin:'50% 80%'},74.18);
const c1=el('div','col',s1);
const k=T(c1,'NO DIA 15 DE NOVEMBRO','red',54,71.08);
T(c1,'PARTICIPE','navy',112,72.96,true);T(c1,'VOTE LIVREMENTE','plain',84,73.78);T(c1,'RESPEITE AS REGRAS','red',66,75.3);
// "No dia 15" entra grande ao centro e vai para o lugar
tl.fromTo(k,{x:-560,y:0,scale:1.7},{x:0,y:0,scale:1,duration:.7,ease:'power3.inOut',immediateRender:false},72.45);tl.set(k,{x:-560,scale:1.7,transformOrigin:'0% 50%'},70.6);
tl.to(c1,{x:-60,opacity:0,duration:.35,ease:'power2.in'},76.1);tl.to(urn,{y:60,opacity:0,duration:.35,ease:'power2.in'},76.1);
// ---------- 2 · PARA MAIS INFORMAÇÕES · CONSULTE · WWW.CNE.CV (76,45–81,2) ----------
const s2=document.getElementById('s2');show('s2',76.45,81.25);
const mon=svg(s2,'left:150px;top:230px;width:820px;height:620px','0 0 410 310',`
 <g fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
 <rect class="d" x="15" y="15" width="380" height="230" rx="14"/><path class="d" d="M170,250 L160,292 M240,250 L250,292"/><path class="d" d="M120,295 L290,295"/></g>`);
tl.fromTo(mon.querySelectorAll('.d'),{strokeDashoffset:1},{strokeDashoffset:0,duration:.6,ease:'power2.inOut',stagger:.1},76.5);
const bar=el('div','',s2,'position:absolute;left:250px;top:400px;width:620px;height:96px;border-radius:48px;background:#fff;box-shadow:0 12px 30px rgba(0,20,60,.35);transform-origin:50% 50%');
const url=el('div','',bar,'position:absolute;left:98px;top:0;line-height:96px;font-size:50px;color:#19296D;white-space:nowrap');
const caret=el('div','',bar,'position:absolute;top:24px;width:5px;height:50px;background:#D4292E');
svg(bar,'left:30px;top:24px;width:48px;height:48px','0 0 24 24','<circle cx="10" cy="10" r="7" fill="none" stroke="#164B8C" stroke-width="3"/><path d="M15,15 L21,21" stroke="#164B8C" stroke-width="3" stroke-linecap="round"/>');
tl.fromTo(bar,{scaleX:0,opacity:0},{scaleX:1,opacity:1,duration:.55,ease:'expo.out'},77.4);
const typ={n:0},S='www.cne.cv',times=[78.54,78.62,78.7,78.78,79.18,79.32,79.46,79.6,80.0,80.12];
times.forEach((t,i)=>tl.set(typ,{n:i+1},t));
const cl=el('div','',s2,'position:absolute;width:40px;height:40px;border-radius:50%;border:5px solid #fff;opacity:0');
tl.fromTo(bar,{scale:1},{scale:1.06,duration:.18,yoyo:true,repeat:1},80.4);
tl.fromTo(cl,{opacity:1,scale:.4,left:'805px',top:'428px'},{opacity:0,scale:3,duration:.6,ease:'power2.out'},80.4);
const c2=el('div','col',s2);T(c2,'PARA MAIS INFORMAÇÕES','plain',54,76.56);T(c2,'CONSULTE','red',100,78.1,true);T(c2,'WWW.CNE.CV','navy',84,79.2);
tl.to([c2,mon,bar],{x:-60,opacity:0,duration:.35,ease:'power2.in'},80.9);
// ---------- 3 · COMISSÃO NACIONAL DE ELEIÇÕES · CADA VOTO CONTA (81,25–88,4) ----------
const s3=document.getElementById('s3');show('s3',81.25,88.45);
const rings=[0,1,2].map(i=>el('div','',s3,'position:absolute;left:290px;top:270px;width:540px;height:540px;border-radius:50%;border:4px solid rgba(255,255,255,.55)'));
rings.forEach((r,i)=>{for(let k=0;k<4;k++)tl.fromTo(r,{scale:1,opacity:.7},{scale:1.9,opacity:0,duration:1.8,ease:'power1.out',immediateRender:false},81.6+i*.6+k*1.8)});
tl.set(rings,{opacity:0},0);
const disc=el('div','',s3,'position:absolute;left:290px;top:270px;width:540px;height:540px;border-radius:50%;background:#fff;box-shadow:0 20px 50px rgba(0,20,60,.35)');
const lc=el('img','',disc,'position:absolute;left:70px;top:205px;width:400px');lc.src='lc.png';
tl.fromTo(disc,{scale:0},{scale:1,duration:.8,ease:'back.out(1.7)'},81.3);tl.fromTo(lc,{opacity:0,y:30},{opacity:1,y:0,duration:.5},81.7);
tl.to(disc,{y:-10,duration:1.5,yoyo:true,repeat:3,ease:'sine.inOut'},82.3);
const c3=el('div','col',s3);const cn=T(c3,'COMISSÃO NACIONAL DE ELEIÇÕES','plain',40,81.36);
T(c3,'CADA VOTO','plain',70,83.48);T(c3,'CONTA.','navy',150,84.08,true);T(c3,'O TEU TAMBÉM.','red',66,84.78);
T(c3,'PELA DEMOCRACIA,','plain',50,86.12);T(c3,'PARTICIPA.','red',90,87.6,true);
tl.to(c3,{scale:1.04,duration:5,ease:'none',transformOrigin:'0% 50%'},83.4);
// ---------- 4 · cartão final ----------
const card=document.getElementById('card');tl.set(card,{visibility:'visible'},88.45);
const st=['#19296D','#D4292E','#19296D'].map((c,i)=>el('div','stripe',document.body,`top:${i*360}px;height:360px;background:${c};transform-origin:0 50%;visibility:hidden`));
st.forEach((s,i)=>{tl.set(s,{visibility:'visible'},88.0);tl.fromTo(s,{scaleX:0,transformOrigin:'0% 50%'},{scaleX:1,duration:.3,ease:'power3.in'},88.0+i*.05);
  tl.to(s,{scaleX:0,transformOrigin:'100% 50%',duration:.4,ease:'power3.out'},88.45+i*.05);tl.set(s,{visibility:'hidden'},89.1)});
const le=el('img','',card,'position:absolute;left:50%;top:330px;width:620px;margin-left:-310px');le.src='le.png';
tl.fromTo(le,{scale:.7,opacity:0,y:30},{scale:1,opacity:1,y:0,duration:.9,ease:'back.out(1.6)'},88.6);
tl.fromTo(le,{scale:1},{scale:1.04,duration:2,ease:'none',immediateRender:false},89.5);
const dt=el('div','',card,'position:absolute;left:0;right:0;top:760px;text-align:center;color:#19296D;font-size:34px;letter-spacing:.12em');dt.textContent='— 15 DE NOVEMBRO —';
tl.fromTo(dt,{opacity:0,y:20},{opacity:1,y:0,duration:.6},89.3);
tl.set({},{},91.2);
window.renderAt=t=>{tl.seek(t,false);url.textContent=S.slice(0,typ.n);caret.style.left=(98+url.offsetWidth+6)+'px';caret.style.opacity=(Math.floor(t*2.5)%2||typ.n<10&&t>78.4)?1:0;
  document.getElementById('o1').style.transform=`translate(${Math.sin(t*.4)*120}px,${Math.cos(t*.33)*70}px)`;document.getElementById('o2').style.transform=`translate(${Math.cos(t*.37)*110}px,${Math.sin(t*.29)*80}px)`};
window.READY=Promise.all([document.fonts.load('800 50px M'),document.fonts.load('700 50px M')]).then(()=>Promise.all([...document.images].map(i=>i.decode().catch(()=>0)))).then(()=>{renderAt(70.6);return true});
</script></body></html>
