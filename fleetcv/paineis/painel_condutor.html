<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>FleetCV Condutor</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#EDF0F0; --surface:#FFFFFF; --surface2:#F4F7F7; --line:#D5DCDC; --line2:#E7ECEC;
  --ink:#0F1618; --muted:#5C6A6C;
  --accent:#0B7F8E; --accent-ink:#FFFFFF; --accent-wash:#E3F1F3;
  --ok:#3E7B22; --ok-wash:#EAF2E4;
  --warn:#A86A05; --warn-wash:#F8EEDC;
  --crit:#B02E20; --crit-wash:#F8E6E3;
  --terra:#EEF2F1; --rua:#A4B2B0; --rua2:#CCD6D4; --costa:#7BA3A8;
  --sombra:0 1px 2px rgba(15,22,24,.06), 0 10px 28px -20px rgba(15,22,24,.45);
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --sans:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  --display:'Archivo',var(--sans);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0B1011; --surface:#141A1B; --surface2:#1A2122; --line:#293233; --line2:#212929;
  --ink:#E3E9E8; --muted:#8A9897;
  --accent:#3FC0CE; --accent-ink:#06191C; --accent-wash:#122E32;
  --ok:#77C34B; --ok-wash:#17280F; --warn:#DCA43C; --warn-wash:#2E2310;
  --crit:#E4776A; --crit-wash:#331714;
  --terra:#0D1314; --rua:#47585A; --rua2:#263132; --costa:#42636A;
  --sombra:0 1px 2px rgba(0,0,0,.45), 0 10px 28px -20px rgba(0,0,0,.9);
}}
:root[data-theme="dark"]{
  --ground:#0B1011; --surface:#141A1B; --surface2:#1A2122; --line:#293233; --line2:#212929;
  --ink:#E3E9E8; --muted:#8A9897;
  --accent:#3FC0CE; --accent-ink:#06191C; --accent-wash:#122E32;
  --ok:#77C34B; --ok-wash:#17280F; --warn:#DCA43C; --warn-wash:#2E2310;
  --crit:#E4776A; --crit-wash:#331714;
  --terra:#0D1314; --rua:#47585A; --rua2:#263132; --costa:#42636A;
  --sombra:0 1px 2px rgba(0,0,0,.45), 0 10px 28px -20px rgba(0,0,0,.9);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0; background:var(--ground); color:var(--ink); font-family:var(--sans);
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column; overflow:hidden}
button{font:inherit; color:inherit}
.num{font-family:var(--mono); font-variant-numeric:tabular-nums}
h1{font-family:var(--display); font-size:23px; margin:0; letter-spacing:-.025em}
h2{font-family:var(--display); font-size:15px; margin:0; letter-spacing:-.01em}

.topo{flex:none; background:var(--surface); border-bottom:1px solid var(--line);
  padding:10px 16px; padding-top:calc(10px + env(safe-area-inset-top,0px));
  display:flex; gap:9px; align-items:center}
.marca{font-family:var(--display); font-weight:700; font-size:15px; display:flex;
  gap:7px; align-items:center}
.marca .pt{width:9px; height:9px; border-radius:50%; background:var(--accent)}
.topo .dir{margin-left:auto; display:flex; gap:6px}
.pill{font-size:11px; font-weight:600; padding:3px 9px; border-radius:20px;
  background:var(--surface2); color:var(--muted); border:1px solid var(--line2)}
.pill.viva{background:var(--ok-wash); color:var(--ok); border-color:transparent}
.pill.morta{background:var(--crit-wash); color:var(--crit); border-color:transparent}

main{flex:1; overflow-y:auto}
.col{max-width:560px; margin:0 auto; padding:16px; display:flex; flex-direction:column; gap:13px}
.col.cheia{height:100%}
.passo{font-size:11.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
  color:var(--accent)}
.sub{margin:0; font-size:14px; color:var(--muted)}

.rodape{flex:none; background:var(--surface); border-top:1px solid var(--line);
  padding:11px 16px calc(13px + env(safe-area-inset-bottom,0px))}
.rodape .col{padding:0; gap:8px; max-width:560px}
.bt{display:block; width:100%; border:none; border-radius:12px; padding:16px;
  font-family:var(--display); font-weight:600; font-size:16.5px; cursor:pointer}
.bt.pri{background:var(--accent); color:var(--accent-ink)}
.bt.sec{background:var(--surface2); color:var(--ink); border:1px solid var(--line)}
.bt.perigo{background:var(--crit); color:#fff}
.bt:disabled{opacity:.4}
.par{display:flex; gap:8px} .par>*{flex:1}
.lig{background:none; border:none; color:var(--accent); font-weight:600; font-size:13.5px;
  cursor:pointer; padding:8px; text-decoration:underline; text-underline-offset:3px;
  width:100%}

.cartao{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px}
.cartao.bom{background:var(--ok-wash); border-color:color-mix(in srgb,var(--ok) 30%,transparent)}
.cartao.aviso{background:var(--warn-wash); border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.cartao.mau{background:var(--crit-wash); border-color:color-mix(in srgb,var(--crit) 30%,transparent)}
.cartao.nota{background:var(--accent-wash); border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.p-nota{font-size:12.5px; color:var(--muted); line-height:1.55; margin:0}
.p-nota b{color:var(--ink)}

.campo{display:block}
.campo .lb{display:block; font-size:11.5px; font-weight:700; letter-spacing:.07em;
  text-transform:uppercase; color:var(--muted); margin-bottom:6px}
.campo .aj{display:block; font-size:12.5px; color:var(--muted); margin-top:6px}
input{width:100%; padding:14px; border-radius:11px; border:1px solid var(--line);
  background:var(--surface); color:var(--ink); font-family:var(--mono); font-size:19px;
  font-weight:500; -moz-appearance:textfield}
input[type=text]{font-family:var(--sans); font-size:16px}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input:focus-visible{outline:2px solid var(--accent); outline-offset:1px}

.escolha{display:flex; gap:12px; align-items:center; width:100%; text-align:left;
  background:var(--surface); border:1px solid var(--line); border-radius:12px;
  padding:14px; cursor:pointer}
.escolha:hover{border-color:var(--accent)}
.escolha.on{border-color:var(--accent); background:var(--accent-wash)}
.escolha .mat{font-family:var(--mono); font-weight:600; font-size:17px}
.escolha .s{font-size:12.5px; color:var(--muted)}
.escolha .d{margin-left:auto; text-align:right; font-family:var(--mono); font-size:14px}
.escolha .d small{display:block; font-family:var(--sans); font-size:11px; color:var(--muted)}

.foto{position:relative; display:block; border:2px dashed var(--line); border-radius:12px;
  padding:26px 14px; text-align:center; background:var(--surface2); cursor:pointer}
.foto.feita{border-style:solid; border-color:var(--ok); padding:0; overflow:hidden}
.foto img{width:100%; display:block; max-height:230px; object-fit:cover}
.foto input{position:absolute; inset:0; opacity:0; width:100%; height:100%}
.foto .ic{font-size:30px} .foto .t{font-weight:600; margin-top:8px; font-size:15px}
.foto .t2{font-size:12.5px; color:var(--muted); margin-top:3px}
.foto .re{position:absolute; right:8px; bottom:8px; background:rgba(0,0,0,.72); color:#fff;
  font-size:11.5px; font-weight:600; padding:5px 10px; border-radius:7px}
.ou{text-align:center; font-size:12px; font-weight:700; letter-spacing:.14em;
  text-transform:uppercase; color:var(--muted); margin:-2px 0}

/* volante */
.mapinha{position:relative; height:200px; border-radius:14px; overflow:hidden;
  border:1px solid var(--line); background:var(--surface2)}
.turno-lin{display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  padding:14px 15px; border-radius:14px; border:1px solid var(--line);
  background:var(--surface); box-shadow:var(--sombra); cursor:pointer;
  font-family:var(--sans); color:var(--ink)}
.turno-lin:hover{border-color:var(--accent)}
.turno-lin .selo{margin-left:auto; font-size:11px; font-weight:700;
  padding:3px 8px; border-radius:6px; white-space:nowrap}
.turno-lin .seta{color:var(--muted); font-size:19px}
.volante{position:relative; flex:1; min-height:320px; border-radius:16px; overflow:hidden;
  border:1px solid var(--line); background:var(--surface2); box-shadow:var(--sombra)}
.mapa{position:absolute; inset:0; width:100%; height:100%; display:block}
.hud{position:absolute; top:0; left:0; right:0; padding:14px 16px 0; display:flex;
  align-items:flex-start; justify-content:space-between; pointer-events:none}
.vel{display:flex; align-items:baseline; gap:7px; padding:8px 14px 7px; border-radius:13px;
  background:color-mix(in srgb,var(--surface) 84%,transparent); backdrop-filter:blur(9px);
  border:1px solid var(--line2)}
.vel .n{font-family:var(--mono); font-size:46px; font-weight:600; line-height:1;
  letter-spacing:-.05em}
.vel .u{font-size:11.5px; font-weight:700; color:var(--muted); letter-spacing:.07em}
.arco{width:46px; height:27px; margin-left:2px; align-self:center}
.onde{padding:7px 13px; border-radius:11px; font-size:13px; font-weight:600;
  letter-spacing:.01em; background:color-mix(in srgb,var(--surface) 84%,transparent);
  backdrop-filter:blur(9px); border:1px solid var(--line2); color:var(--muted)}
.baixo{position:absolute; left:0; right:0; bottom:0; display:grid;
  grid-template-columns:repeat(3,1fr);
  background:color-mix(in srgb,var(--surface) 90%,transparent); backdrop-filter:blur(9px);
  border-top:1px solid var(--line2)}
.baixo>div{padding:10px 6px; text-align:center}
.baixo>div+div{border-left:1px solid var(--line2)}
.baixo b{display:block; font-family:var(--mono); font-size:19px; font-weight:500}
.baixo span{font-size:10px; color:var(--muted); text-transform:uppercase;
  letter-spacing:.06em; font-weight:700}
.rec{display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--crit);
  margin-right:5px; vertical-align:middle; animation:pulsa 2s ease-in-out infinite}
@keyframes pulsa{0%,100%{opacity:1}50%{opacity:.2}}

.vf{display:flex; gap:11px; padding:11px 0; border-bottom:1px solid var(--line2);
  align-items:flex-start}
.vf:last-child{border-bottom:none}
.vf .mk{flex:none; width:21px; height:21px; border-radius:50%; display:grid;
  place-items:center; font-size:12px; font-weight:700; margin-top:1px}
.vf .mk.s{background:var(--ok-wash); color:var(--ok)}
.vf .mk.n{background:var(--crit-wash); color:var(--crit)}
.vf .t1{font-size:13.5px; font-weight:600}
.vf .t2{font-size:12px; color:var(--muted)}
.vf .vl{font-family:var(--mono); font-size:13px; white-space:nowrap; color:var(--muted)}
.vazio{text-align:center; padding:24px; color:var(--muted); font-size:13.5px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

  <div class="dir" id="dir"></div>
</div>

function bairrosDoRasto(pts){
  var ordem=[], ultimo=null;
  for(var i=0;i<(pts||[]).length;i+=Math.max(1,Math.floor(pts.length/90))){
    var b=bairroDe(pts[i][0], pts[i][1]);
    if(b&&b!==ultimo){ if(ordem.indexOf(b)<0) ordem.push(b); ultimo=b; } }
  return ordem;
}
function _toca(a,b){ return !(a[2]<b[0]||a[0]>b[2]||a[3]<b[1]||a[1]>b[3]); }

/* Projeção simples: à escala da Praia a Terra é plana o bastante. */
function _proj(caixa, W, H, pad){
  var kx = Math.cos((caixa[0]+caixa[2])/2 * Math.PI/180);
  var sO = (caixa[3]-caixa[1])*kx || 1e-9, sA = (caixa[2]-caixa[0]) || 1e-9;
  var s  = Math.min((W-2*pad)/sO, (H-2*pad)/sA);
  var ox = (W - sO*s)/2, oy = (H - sA*s)/2;
  return { s:s, caixa:caixa,
    X:function(lon){ return ox + (lon-caixa[1])*kx*s; },
    Y:function(lat){ return H - (oy + (lat-caixa[0])*s); } };
}

/* Estica a caixa até ao formato do ecrã, para o zoom ser igual nos
   dois sentidos, e nunca deixa apertar abaixo de ~1,2 km — senão o
   condutor via um risco sozinho, sem uma rua para se situar. */
function _caixa(cA, cO, spanA, spanO, minSpan, W, H, pad){
  var kx=Math.cos(cA*Math.PI/180), alvo=(W-2*pad)/(H-2*pad);
  spanA=Math.max(spanA||0, 1e-7); spanO=Math.max(spanO||0, 1e-7);
  /* 1 · encher até ao formato do ecrã, para não esticar o desenho */
  if((spanO*kx)/spanA < alvo) spanO = spanA*alvo/kx; else spanA = spanO*kx/alvo;
  /* 2 · o mínimo conta pelo lado maior: num ecrã ao alto é a altura */
  var maior=Math.max(spanA, spanO*kx);
  if(maior<minSpan){ var k=minSpan/maior; spanA*=k; spanO*=k; }
  return [cA-spanA/2, cO-spanO/2, cA+spanA/2, cO+spanO/2];
}
/* Aceita tanto pontos de rasto [lat,lon,…] como carros {lat,lon}. */
function _ponto(p){ return p==null ? null
  : (p.lat!=null ? [p.lat, p.lon] : (p.length>=2 ? [p[0], p[1]] : null)); }
function _abrange(lista, minSpan, W, H, pad){
  var mnA=1/0,mxA=-1/0,mnO=1/0,mxO=-1/0, n=0;
  for(var i=0;i<lista.length;i++){ var q=_ponto(lista[i]); if(!q) continue;
    n++; if(q[0]<mnA)mnA=q[0]; if(q[0]>mxA)mxA=q[0];
    if(q[1]<mnO)mnO=q[1]; if(q[1]>mxO)mxO=q[1]; }
  if(!n) return _caixa(14.9195,-23.5087,0,0,minSpan,W,H,pad);
  return _caixa((mnA+mxA)/2,(mnO+mxO)/2,mxA-mnA,mxO-mnO,minSpan,W,H,pad);
}

/* A seguir o carro: o mapa fica quieto enquanto o carro anda pelo
   meio do ecrã e só salta quando ele chega perto da borda — como
   um GPS de carro a sério, e assim o fundo não é redesenhado a
   cada segundo. */
function _seguir(vista, alvo, minSpan, W, H, pad){
  if(vista && vista.caixa){
    var c=vista.caixa;
    var fA=(alvo[0]-c[0])/(c[2]-c[0]), fO=(alvo[1]-c[1])/(c[3]-c[1]);
    if(fA>0.25&&fA<0.75&&fO>0.25&&fO<0.75) return c;
  }
  var nova=_caixa(alvo[0], alvo[1], 0, 0, minSpan, W, H, pad);
  if(vista) vista.caixa=nova;
  return nova;
}

function _caminho(plano, pr){
  var d='';
  for(var i=0;i<plano.length;i+=2)
    d += (i?'L':'M') + pr.X(plano[i+1]).toFixed(1) + ' ' + pr.Y(plano[i]).toFixed(1);
  return d;
}

/* O fundo (costa + ruas) muda pouco: guarda-se feito. */
function _fundo(caixa, W, H, pad){
  var chave = caixa.map(function(v){ return v.toFixed(5); }).join(',')+'|'+W+'x'+H+'x'+pad;
  if(_fundoCache[chave]) return _fundoCache[chave];
  var ix=_prepararIndice(), pr=_proj(caixa,W,H,pad), svg='';
  var mA=(caixa[2]-caixa[0])*0.25, mO=(caixa[3]-caixa[1])*0.25;
  var vista=[caixa[0]-mA, caixa[1]-mO, caixa[2]+mA, caixa[3]+mO];

  (MAPA_PRAIA.costa||[]).forEach(function(c,i){
    if(!_toca(ix.costa[i],vista)) return;
    svg += '<path d="'+_caminho(c,pr)+'" fill="none" stroke="var(--costa)" '+
      'stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>'; });

  /* as pequenas primeiro, as grandes por cima */
  var zoom=Math.max(0.8, Math.min(1.5, 2200/Math.max(400,
    (caixa[2]-caixa[0])*111320)));
  [['residential',1,'var(--rua2)'],['tertiary',1.5,'var(--rua2)'],
   ['secondary',2.4,'var(--rua)'],['primary',3.2,'var(--rua)']].forEach(function(x){
    var lista=MAPA_PRAIA.ruas[x[0]]; if(!lista) return;
    lista.forEach(function(r,i){
      if(!_toca(ix.ruas[x[0]][i],vista)) return;
      svg += '<path d="'+_caminho(r,pr)+'" fill="none" stroke="'+x[2]+'" stroke-width="'+
        (x[1]*zoom).toFixed(2)+'" stroke-linejoin="round" stroke-linecap="round"/>'; });
  });

  /* os nomes dos bairros: sem eles o condutor vê riscos, com eles
     sabe logo que está em Palmarejo ou na Achadinha */
  var largura=(caixa[3]-caixa[1])*111320*Math.cos(caixa[0]*Math.PI/180);
  var postos=[];                     /* onde já há um nome escrito */
  var cabe=function(x,y,w,alt){
    for(var i=0;i<postos.length;i++){ var c=postos[i];
      if(Math.abs(x-c[0])<(w+c[2])/2 && Math.abs(y-c[1])<(alt+c[3])/2) return false; }
    postos.push([x,y,w,alt]); return true; };
  /* os maiores primeiro: se dois nomes se pisarem, fica o mais conhecido */
  (MAPA_PRAIA.locais||[]).slice().sort(function(a,b){ return a.g-b.g; })
   .forEach(function(l){
    if(l.g===2 && largura>3000) return;      /* os pequenos só de perto */
    if(l.g===0 && largura<9000) return;      /* "Praia" só de muito longe */
    var x=pr.X(l.o), y=pr.Y(l.a);
    if(x<8||x>W-8||y<14||y>H-8) return;
    var tam=(l.g===0?13:11);
    if(!cabe(x, y, l.n.length*tam*0.55+10, tam+8)) return;
    svg += '<text x="'+x.toFixed(0)+'" y="'+y.toFixed(0)+'" text-anchor="middle" '+
      'fill="var(--muted)" font-size="'+tam+'" font-weight="600" '+
      'letter-spacing="'+(l.g===0?'.1em':'.04em')+'" '+
      'font-family="IBM Plex Sans,sans-serif" paint-order="stroke" '+
      'stroke="var(--terra)" stroke-width="3.5" opacity="'+(l.g===0?'.75':'.62')+'">'+
      l.n.replace(/[&<>]/g,'')+'</text>'; });

  var feito={svg:svg, pr:pr};
  var chaves=Object.keys(_fundoCache);
  if(chaves.length>16) delete _fundoCache[chaves[0]];
  _fundoCache[chave]=feito;
  return feito;
}

/* Desenha o mapa.
   pts        · o percurso [lat, lon, momento, precisão, velocidade]
   ate        · quantos pontos desenhar a cheio (para ver o carro andar)
   seguir     · zoom fixo colado ao carro (ecrã de condução)
   vista      · objeto do chamador onde fica guardado o enquadramento
   abast      · onde abasteceu
   carros     · setas extra {lat,lon,ang,rotulo} para a vista da frota
   centro     · [lat,lon] quando ainda não há percurso nenhum          */
function desenharMapa(op){
  op = op || {};
  var W=op.W||460, H=op.H||300, pad=op.pad||20, min=op.minSpan||0.011;
  var pts=(op.pts||[]).filter(function(p){ return p[3]==null||p[3]<=50; });
  var n = pts.length ? (op.ate==null ? pts.length
                                     : Math.max(1,Math.min(op.ate,pts.length))) : 0;
  var caixa;
  if(op.seguir && n)            caixa=_seguir(op.vista, pts[n-1], min, W, H, pad);
  else {
    var refs=pts.concat(op.carros||[]);
    if(!refs.length) refs=[op.centro||[14.9195,-23.5087]];
    caixa=_abrange(refs, refs.length>1?min:(op.minSpanVazio||min), W, H, pad);
  }
  var f=_fundo(caixa, W, H, pad), pr=f.pr;

  var svg='<svg class="mapa'+(op.classe?' '+op.classe:'')+'" viewBox="0 0 '+W+' '+H+'" '+
    'preserveAspectRatio="xMidYMid slice" role="img" aria-label="'+
    (op.rotulo||'Mapa da Praia')+'"><rect width="'+W+'" height="'+H+
    '" fill="var(--terra)"/>'+f.svg;

  /* postos de combustível */
  if(op.postos!==false)
    (MAPA_PRAIA.postos||[]).forEach(function(p){
      var x=pr.X(p.lon), y=pr.Y(p.lat);
      if(x<-14||x>W+14||y<-14||y>H+14) return;
      svg += '<g class="posto-mapa" data-posto-mapa="'+
        String(p.nome).replace(/[&<>"]/g,'')+'" role="button" tabindex="0" '+
        'transform="translate('+x.toFixed(1)+','+y.toFixed(1)+')">'+
        '<title>'+String(p.nome).replace(/[&<>]/g,'')+'</title>'+
        '<circle r="15" fill="transparent"/>'+
        '<circle r="6" fill="var(--warn-wash)" stroke="var(--warn)" stroke-width="1.2" '+
        'opacity=".9"/><path d="M-1.6 -2.6h3.2v5.2h-3.2z" fill="var(--warn)"/></g>'; });

  /* o percurso: cinzento até ao fim, aceso até onde vamos */
  if(pts.length>1){
    var partes=function(lista){
      var ps=[], act=[];
      for(var i=0;i<lista.length;i++){
        if(i&&(lista[i][2]-lista[i-1][2])>300000){ if(act.length>1) ps.push(act); act=[]; }
        act.push((act.length?'L':'M')+pr.X(lista[i][1]).toFixed(1)+' '+
          pr.Y(lista[i][0]).toFixed(1)); }
      if(act.length>1) ps.push(act); return ps; };
    if(op.ate!=null)
      partes(pts).forEach(function(p){ svg+='<path d="'+p.join(' ')+'" fill="none" '+
        'stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round" '+
        'stroke-linecap="round" opacity=".16"/>'; });
    partes(pts.slice(0,Math.max(2,n))).forEach(function(p){
      svg+='<path d="'+p.join(' ')+'" fill="none" stroke="var(--accent)" '+
        'stroke-width="4.6" stroke-linejoin="round" stroke-linecap="round" '+
        'opacity=".25"/><path d="'+p.join(' ')+'" fill="none" stroke="var(--accent)" '+
        'stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>'; });
    /* onde o sinal se perdeu — o buraco é a prova, não se esconde */
    if(op.buraco!==false)
      for(var i=1;i<n&&i<pts.length;i++)
        if((pts[i][2]-pts[i-1][2])>300000)
          svg+='<path d="M'+pr.X(pts[i-1][1]).toFixed(1)+' '+pr.Y(pts[i-1][0]).toFixed(1)+
            'L'+pr.X(pts[i][1]).toFixed(1)+' '+pr.Y(pts[i][0]).toFixed(1)+
            '" stroke="var(--crit)" stroke-width="2" stroke-dasharray="5 5" fill="none"/>';
  }

  /* onde abasteceu */
  (op.abast||[]).forEach(function(a){
    if(a.lat==null) return;
    var x=pr.X(a.lon), y=pr.Y(a.lat);
    svg += '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="12" fill="none" '+
      'stroke="var(--warn)" stroke-width="1.6" opacity=".65"/>'+
      '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="6" fill="var(--warn)" '+
      'stroke="var(--surface)" stroke-width="1.6"/>';
    if(a.posto) svg += '<text x="'+(x+16).toFixed(1)+'" y="'+(y+4).toFixed(1)+
      '" fill="var(--ink)" font-size="11" font-weight="600" '+
      'font-family="IBM Plex Sans,sans-serif" paint-order="stroke" '+
      'stroke="var(--terra)" stroke-width="3.5">'+
      String(a.posto).replace(/[&<>]/g,'')+'</text>';
  });

  /* o carro */
  if(n){
    var u=pts[n-1], ant=pts[Math.max(0,n-4)];
    var ang=(n>1)?Math.atan2(pr.X(u[1])-pr.X(ant[1]),
                             -(pr.Y(u[0])-pr.Y(ant[0])))*180/Math.PI:0;
    if(pts.length>1)
      svg += '<circle cx="'+pr.X(pts[0][1]).toFixed(1)+'" cy="'+pr.Y(pts[0][0]).toFixed(1)+
        '" r="5" fill="var(--surface)" stroke="var(--ok)" stroke-width="2.5"/>';
    svg += '<g transform="translate('+pr.X(u[1]).toFixed(1)+','+pr.Y(u[0]).toFixed(1)+')">'+
      (op.pulsar?'<circle r="15" fill="var(--accent)" opacity=".18">'+
        '<animate attributeName="r" values="11;20;11" dur="2.4s" repeatCount="indefinite"/>'+
        '<animate attributeName="opacity" values=".26;0;.26" dur="2.4s" '+
        'repeatCount="indefinite"/></circle>':'<circle r="13" fill="var(--accent)" '+
        'opacity=".16"/>')+
      '<g transform="rotate('+ang.toFixed(0)+')">'+
      '<path d="M0 -11 L7.5 9 L0 4.6 L-7.5 9 Z" fill="var(--accent)" '+
      'stroke="var(--surface)" stroke-width="1.8" stroke-linejoin="round"/></g>'+
      (op.rotuloCarro?'<text y="-22" text-anchor="middle" fill="var(--ink)" '+
        'font-size="12" font-weight="700" font-family="IBM Plex Mono,monospace" '+
        'paint-order="stroke" stroke="var(--terra)" stroke-width="3.5">'+
        String(op.rotuloCarro).replace(/[&<>]/g,'')+'</text>':'')+'</g>';
  }

  /* Os carros da frota. Cada um é um botão: quem toca num carro
     quer saber daquele carro, e não há motivo para o obrigar a
     procurá-lo depois numa lista por baixo do mapa. O círculo
     transparente por trás é o que se toca — a seta sozinha era
     pequena de mais para um dedo. */
  (op.carros||[]).forEach(function(c){
    var x=pr.X(c.lon), y=pr.Y(c.lat), cor=c.cor||'var(--ok)';
    var escolhido = op.escolhido && op.escolhido===c.id;
    svg += '<g class="carro-mapa'+(escolhido?' on':'')+'" '+
      (c.id?'data-vivo="'+String(c.id).replace(/[^\w-]/g,'')+'" ':'')+
      'transform="translate('+x.toFixed(1)+','+y.toFixed(1)+')" '+
      'role="button" tabindex="0" aria-label="'+
      String(c.rotulo||'carro').replace(/[&<>"]/g,'')+'">'+
      '<circle r="26" fill="transparent"/>'+
      (escolhido?'<circle r="21" fill="none" stroke="'+cor+'" stroke-width="2" '+
        'opacity=".85"/>':'')+
      '<circle r="16" fill="'+cor+'" opacity=".16"><animate attributeName="r" '+
      'values="12;20;12" dur="2.6s" repeatCount="indefinite"/></circle>'+
      '<g transform="rotate('+(c.ang||0).toFixed(0)+')">'+
      '<path d="M0 -11 L7.5 9 L0 4.6 L-7.5 9 Z" fill="'+cor+'" stroke="var(--surface)" '+
      'stroke-width="1.8" stroke-linejoin="round"/></g>'+
      '<text y="-22" text-anchor="middle" fill="var(--ink)" font-size="12" '+
      'font-weight="700" font-family="IBM Plex Mono,monospace" paint-order="stroke" '+
      'stroke="var(--terra)" stroke-width="3.5">'+
      String(c.rotulo||'').replace(/[&<>]/g,'')+'</text></g>'; });

  /* a escala, para se saber que distância é aquela */
  var mPorPx = 111320/pr.s, alvo=Math.min(W,H)*0.28*mPorPx;
  var passos=[50,100,200,500,1000,2000,5000,10000], esc=passos[0];
  passos.forEach(function(p){ if(Math.abs(p-alvo)<Math.abs(esc-alvo)) esc=p; });
  var larg=esc/mPorPx;
  if(larg>20&&larg<W*0.7)
    svg += '<g transform="translate(13,'+(H-12-(op.margemBaixo||0))+')">'+
      '<path d="M0 0H'+larg.toFixed(0)+'M0 -4V4M'+larg.toFixed(0)+' -4V4" '+
      'stroke="var(--muted)" stroke-width="1.3"/>'+
      '<text x="'+(larg/2).toFixed(0)+'" y="-7" text-anchor="middle" fill="var(--muted)" '+
      'font-size="10" font-family="IBM Plex Mono,monospace" paint-order="stroke" '+
      'stroke="var(--terra)" stroke-width="3">'+
      (esc>=1000?(esc/1000)+' km':esc+' m')+'</text></g>';

  if(op.aviso)
    svg += '<g transform="translate('+(W/2)+','+(H/2)+')">'+
      '<rect x="-108" y="-17" width="216" height="34" rx="17" fill="var(--surface)" '+
      'opacity=".92" stroke="var(--line)"/><text text-anchor="middle" y="4.5" '+
      'fill="var(--muted)" font-size="13" font-family="IBM Plex Sans,sans-serif">'+
      String(op.aviso).replace(/[&<>]/g,'')+'</text></g>';

  return svg + '</svg>';
}


/* ════════════════════════════════════════════════════════════
   ANDAR PELAS RUAS
   Para os ensaios e para os turnos de exemplo: em vez de inventar
   um risco no ar, o carro anda mesmo pelas ruas da Praia, virando
   nos cruzamentos. É o que o patrão vai ver quando isto for a
   sério, por isso é o que tem de ver agora.
   ════════════════════════════════════════════════════════════ */
var _rede = null;

function _redeDaPraia(){
  if(_rede) return _rede;
  var vias=[], grelha={};
  ['primary','secondary','tertiary','residential'].forEach(function(k){
    (MAPA_PRAIA.ruas[k]||[]).forEach(function(v){ if(v.length>=6) vias.push(v); }); });
  /* uma grelha de ~220 m para achar depressa o que está ao lado */
  var chave=function(a,o){ return Math.round(a/0.002)+'_'+Math.round(o/0.002); };
  vias.forEach(function(v, iv){
    for(var i=0;i<v.length;i+=2){
      var c=chave(v[i], v[i+1]);
      (grelha[c] || (grelha[c]=[])).push([iv, i]); } });
  _rede={vias:vias, grelha:grelha, chave:chave};
  return _rede;
}

function _vizinhos(rede, lat, lon, raio){
  var perto=[], ca=Math.round(lat/0.002), co=Math.round(lon/0.002);
  for(var da=-1;da<=1;da++) for(var dO=-1;dO<=1;dO++){
    var c=rede.grelha[(ca+da)+'_'+(co+dO)]; if(!c) continue;
    for(var k=0;k<c.length;k++){
      var v=rede.vias[c[k][0]], i=c[k][1];
      var dA=(v[i]-lat)*111320, dOo=(v[i+1]-lon)*111320*Math.cos(lat*Math.PI/180);
      if(dA*dA+dOo*dOo <= raio*raio) perto.push(c[k]); } }
  return perto;
}

/* Devolve uma lista de [lat,lon] espaçada de `passoM` metros.
   rnd() é a fonte de acaso, para o mesmo turno dar sempre o mesmo
   caminho e os ensaios serem repetíveis. */
function percursoPorRuas(rnd, quantos, passoM){
  var rede=_redeDaPraia();
  if(!rede.vias.length) return [];
  passoM = passoM || 30;
  var iv=Math.floor(rnd()*rede.vias.length), i=0, dir=1;
  var v=rede.vias[iv];
  i = (Math.floor(rnd()*(v.length/2))|0)*2;
  var pos=[v[i], v[i+1]], saida=[pos.slice()], sobra=0, desdeCurva=0;

  var avancar=function(){
    var prox=i+dir*2;
    if(prox<0 || prox>=rede.vias[iv].length) return false;
    var w=rede.vias[iv];
    var alvo=[w[prox], w[prox+1]];
    var m=_dist(pos[0],pos[1],alvo[0],alvo[1]);
    /* parte o troço em passos de passoM metros */
    var andado=0;
    while(andado + (passoM-sobra) <= m){
      andado += (passoM-sobra); sobra=0;
      var f=andado/m;
      saida.push([pos[0]+(alvo[0]-pos[0])*f, pos[1]+(alvo[1]-pos[1])*f]);
      if(saida.length>=quantos) return 'cheio';
    }
    sobra += (m-andado);
    pos=alvo; i=prox; desdeCurva++;
    return true;
  };

  for(var passos=0; passos<quantos*6 && saida.length<quantos; passos++){
    var r=avancar();
    if(r==='cheio') break;
    if(r && desdeCurva<6+Math.floor(rnd()*22)) continue;
    /* cruzamento: procura outra rua que passe aqui ao lado */
    var perto=_vizinhos(rede, pos[0], pos[1], 45).filter(function(x){
      return x[0]!==iv; });
    if(perto.length){
      var e=perto[Math.floor(rnd()*perto.length)];
      iv=e[0]; i=e[1]; desdeCurva=0;
      dir = (i===0) ? 1 : (i>=rede.vias[iv].length-2 ? -1 : (rnd()<0.5?-1:1));
      pos=[rede.vias[iv][i], rede.vias[iv][i+1]];
    } else if(!r){
      dir=-dir; desdeCurva=0;            /* rua sem saída: volta para trás */
    } else desdeCurva=0;
  }
  return saida;
}


/* ════════════════════════════════════════════════════════════
   A PROVA DO POSTO
   O talão diz um posto. O GPS diz por onde o carro andou. Isto junta
   as duas coisas num número que cabe no turno: a que distância o
   carro chegou do posto, e quanto tempo lá esteve parado.

   Fica calculado no telemóvel do condutor, quando ele fecha o turno,
   porque é lá que está o rasto inteiro. O patrão recebe só o
   resultado — assim não é preciso mandar milhares de pontos de GPS
   pela rede dele só para responder a uma pergunta de dois números.
   ════════════════════════════════════════════════════════════ */
function provaDoPosto(rasto, nomePosto, raio){
  if(!nomePosto || !(rasto||[]).length) return null;
  var posto=null;
  (MAPA_PRAIA.postos||[]).forEach(function(x){ if(x.nome===nomePosto) posto=x; });
  if(!posto) return null;                  /* posto escrito à mão: não dá */
  raio = raio || 150;
  var perto=[], maisPerto=1e9;
  for(var i=0;i<rasto.length;i++){
    var d=_dist(rasto[i][0], rasto[i][1], posto.lat, posto.lon);
    if(d<maisPerto) maisPerto=d;
    if(d<=raio) perto.push(rasto[i]);
  }
  return {
    metros: Math.round(maisPerto),
    esteve: perto.length>0,
    parouS: perto.length ? Math.round((perto[perto.length-1][2]-perto[0][2])/1000) : 0
  };
}

/* O maior buraco de sinal, em segundos. Mesma ideia: calcula-se onde
   está o rasto e viaja só o número. */
function maiorBuraco(rasto){
  var mx=0;
  for(var i=1;i<(rasto||[]).length;i++)
    mx=Math.max(mx, (rasto[i][2]-rasto[i-1][2])/1000);
  return Math.round(mx);
}
/* ════════════════════════════════════════════════════════════
   A NUVEM
   O que liga o telemóvel do condutor ao ecrã do patrão.

   Antes, cada um guardava as suas coisas no seu telemóvel e nunca se
   viam. Agora há um sítio comum: o condutor escreve lá, o patrão lê de
   lá, e ao contrário. Quem está com a página aberta recebe as mudanças
   sozinho, em segundos — ninguém carrega em "actualizar".

   Três cuidados que mandam no desenho todo:

   1 · Escrever custa. Um turno de oito horas dá milhares de pontos de
       GPS; se cada um fosse uma escrita, a aplicação era travada e
       cortada por excesso. Por isso a posição sobe de 4 em 4 segundos
       (só se o carro mexeu) e o rasto inteiro é gravado de 45 em 45
       segundos, aos pedaços.

   2 · Cada papel escreve o seu. O condutor escreve o turno dele e onde
       está. O patrão escreve os carros, os condutores e as respostas
       aos alertas. Assim dois telemóveis nunca escrevem a mesma linha
       ao mesmo tempo.

   3 · Sem nuvem tem de funcionar na mesma. Se a nuvem não estiver
       disponível — sem rede, sem sessão iniciada — tudo continua a
       trabalhar com o que está guardado no próprio telemóvel, e sobe
       quando voltar. O condutor não pode ficar parado à porta de um
       cliente à espera de rede.
   ════════════════════════════════════════════════════════════ */
var Nuvem = (function(){
"use strict";

var RITMO_VIVO  = 4000;    /* de quanto em quanto tempo sobe a posição   */
var RITMO_RASTO = 45000;   /* de quanto em quanto tempo se grava o rasto */
var CAUDA       = 160;     /* pontos que viajam com a posição, para o
                              patrão ver logo o rabicho do carro         */
var PARTE_MAX   = 800;     /* pontos por pedaço de rasto gravado         */
var TECTO_VIVO  = 40000;   /* se a nuvem se queixar, abranda até aqui    */

var loja=null, quem=null, estado='a-ligar', ritmo=RITMO_VIVO, opGuardado={};
var ouvintes=[], subs=[], cacheRasto={};
var D = { frota:null, turnos:[], vivos:[] };

/* ════════════════════════════════════════════════════════
   A LOJA
   Onde as coisas ficam guardadas. Há duas, com a mesma porta:

   · a de longe — a base de dados partilhada. Liga telemóveis
     diferentes, em sítios diferentes. É esta que se quer.
   · a de perto — o próprio navegador. Liga separadores e janelas
     do mesmo aparelho, e mais nada. Serve quando a de longe não
     está disponível, e é o que faz o patrão ver o condutor quando
     os dois estão abertos no mesmo computador.

   O resto do ficheiro não sabe qual delas está a ser usada.
   ════════════════════════════════════════════════════════ */

/* ─── a loja do servidor ─── */
/* A melhor das três: o condutor abre um endereço no telemóvel dele,
   entra com o e-mail e o código que o patrão lhe deu, e pronto. Não
   precisa de conta em lado nenhum.

   O servidor manda as novidades por uma linha que fica aberta, por
   isso não se anda aqui a perguntar de dois em dois segundos se
   mudou alguma coisa. E é lá que se verifica quem pode escrever o
   quê — aqui num telemóvel isso era só boa vontade. */
function lojaDoServidor(){
  var espelho={}, ouve={}, fonte=null, eu=null;
  var tocar=function(c){
    (ouve[c]||[]).forEach(function(f){ try{ f(); }catch(e){} }); };
  var guardar=function(c,id,d){
    espelho[c]=espelho[c]||{};
    if(d===null) delete espelho[c][id]; else espelho[c][id]=d;
    tocar(c); };

  var pedir=function(rota, corpo){
    return fetch(rota, corpo
      ? {method:'POST', headers:{'content-type':'application/json'},
         body:JSON.stringify(corpo), credentials:'same-origin'}
      : {credentials:'same-origin'})
      .then(function(r){ return r.json().then(function(j){
        if(!r.ok) throw Object.assign(new Error(j.erro||('HTTP '+r.status)),
          {code: r.status===429?'resource_exhausted':'invalid_argument',
           porque:j.erro});
        return j; }); });
  };

  return {
    longe:true, servidor:true,
    entrar:function(email, codigo){
      return pedir('/api/entrar', {email:email, codigo:codigo})
        .then(function(j){ eu=j; return j; }); },
    sair:function(){ return pedir('/api/sair', {}).then(function(){ eu=null; }); },
    eu:function(){ return eu; },

    /* traz tudo de uma vez e depois fica à escuta */
    comecar:function(){
      return pedir('/api/eu').then(function(j){
        eu = j.papel ? j : null;
        if(!eu) return false;
        return pedir('/api/tudo').then(function(t){
          espelho.frota={};
          ['config','carros','condutores','exemplos'].forEach(function(k){
            if(t.frota[k]) espelho.frota[k]=t.frota[k]; });
          espelho.turnos={}; (t.turnos||[]).forEach(function(x){
            espelho.turnos[x.id]=x.d; });
          espelho.vivo={}; (t.vivo||[]).forEach(function(x){
            espelho.vivo[x.id]=x.d; });
          Object.keys(espelho).forEach(tocar);
          try{
            fonte=new EventSource('/api/eventos');
            fonte.onmessage=function(m){
              try{ var x=JSON.parse(m.data); guardar(x.c, x.id, x.d); }catch(e){} };
          }catch(e){}
          return true;
        });
      }).catch(function(){ return false; });
    },

    ler:function(c,id){
      return Promise.resolve((espelho[c]||{})[id] || null); },
    por:function(c,id,v){
      guardar(c,id,v);                        /* mostra já, confirma depois */
      return pedir('/api/doc', {c:c, id:id, d:v}); },
    tirar:function(c,id){
      guardar(c,id,null);
      return pedir('/api/apagar', {c:c, id:id}); },
    verDoc:function(c,id,fn){
      (ouve[c]=ouve[c]||[]).push(function(){ fn((espelho[c]||{})[id]||null); });
      setTimeout(function(){ fn((espelho[c]||{})[id]||null); },0);
      return function(){}; },
    verColeccao:function(c,fn,err,ordem,quantos){
      var dar=function(){
        var v=Object.keys(espelho[c]||{}).map(function(k){ return espelho[c][k]; });
        if(ordem) v.sort(function(a,b){ return (b[ordem]||0)-(a[ordem]||0); });
        fn(quantos?v.slice(0,quantos):v); };
      (ouve[c]=ouve[c]||[]).push(dar);
      setTimeout(dar,0);
      return function(){}; },
    ondeCampo:function(c,campo,valor){
      if(c==='rastos')
        return pedir('/api/rasto/'+encodeURIComponent(valor)).then(function(j){
          return (j.pts&&j.pts.length)?[{turno:valor, parte:0, pts:j.pts}]:[]; });
      return Promise.resolve(Object.keys(espelho[c]||{})
        .map(function(k){ return espelho[c][k]; })
        .filter(function(x){ return x[campo]===valor; })); },
    /* a frota vem já semeada do servidor; os turnos de exemplo
       são o patrão que os traz, e só ele os pode escrever */
    licenca:function(){ return Promise.resolve(!!(eu&&eu.papel==='dono')); }
  };
}

/* ─── a loja de longe ─── */
function lojaDeLonge(db){
  return {
    longe:true,
    ler:function(c,id){ return db.doc(c+'/'+id).get().then(function(s){
      return s.exists?s.data():null; }); },
    por:function(c,id,v){ return db.doc(c+'/'+id).set(v); },
    tirar:function(c,id){ return db.doc(c+'/'+id).delete(); },
    verDoc:function(c,id,fn,err){
      return db.doc(c+'/'+id).onSnapshot(function(s){
        fn(s.exists?s.data():null); }, err); },
    verColeccao:function(c,fn,err,ordem,quantos){
      var q=db.collection(c);
      if(ordem) q=q.orderBy(ordem,'desc');
      if(quantos) q=q.limit(quantos);
      return q.onSnapshot(function(s){
        fn(s.docs.map(function(d){ return d.data(); })); }, err); },
    ondeCampo:function(c,campo,valor){
      return db.collection(c).where(campo,'==',valor).get().then(function(s){
        return s.docs.map(function(d){ return d.data(); }); }); },
    licenca:function(c,id,ms){
      return db.doc(c+'/'+id).acquire({holder:'semeador', ttlMs:ms})
        .then(function(r){ return !!r.acquired; }); }
  };
}

/* ─── a loja de perto ─── */
/* Guarda cada documento numa chave do navegador e avisa os outros
   separadores. O navegador só avisa as OUTRAS janelas, por isso quem
   escreve avisa-se também a si próprio. */
function lojaDePerto(){
  var raiz='fcv:', ouve={}, canal=null;
  try{ canal=new BroadcastChannel('fleetcv'); }catch(e){}
  var chave=function(c,id){ return raiz+c+'/'+id; };
  var lerJson=function(k){
    try{ var r=localStorage.getItem(k); return r?JSON.parse(r):null; }
    catch(e){ return null; } };
  var tocar=function(c){
    (ouve[c]||[]).forEach(function(f){ try{ f(); }catch(e){} }); };
  var avisar=function(c){
    tocar(c);
    try{ if(canal) canal.postMessage(c); }catch(e){} };
  try{ if(canal) canal.onmessage=function(e){ tocar(e.data); }; }catch(e){}
  try{ window.addEventListener('storage', function(e){
    if(e.key&&e.key.indexOf(raiz)===0) tocar(e.key.slice(raiz.length).split('/')[0]);
  }); }catch(e){}

  var todos=function(c){
    var v=[], pre=raiz+c+'/';
    try{
      for(var i=0;i<localStorage.length;i++){
        var k=localStorage.key(i);
        if(k&&k.indexOf(pre)===0){ var d=lerJson(k); if(d) v.push(d); } }
    }catch(e){}
    return v; };
  var seguir=function(c,fn){
    (ouve[c]=ouve[c]||[]).push(fn);
    setTimeout(fn,0);
    return function(){ ouve[c]=(ouve[c]||[]).filter(function(x){ return x!==fn; }); }; };

  return {
    longe:false,
    ler:function(c,id){ return Promise.resolve(lerJson(chave(c,id))); },
    por:function(c,id,v){
      try{ localStorage.setItem(chave(c,id), JSON.stringify(v)); }
      catch(e){ return Promise.reject({code:'quota_exceeded'}); }
      avisar(c); return Promise.resolve(); },
    tirar:function(c,id){
      try{ localStorage.removeItem(chave(c,id)); }catch(e){}
      avisar(c); return Promise.resolve(); },
    verDoc:function(c,id,fn){
      return seguir(c, function(){ fn(lerJson(chave(c,id))); }); },
    verColeccao:function(c,fn,err,ordem,quantos){
      return seguir(c, function(){
        var v=todos(c);
        if(ordem) v.sort(function(a,b){ return (b[ordem]||0)-(a[ordem]||0); });
        fn(quantos?v.slice(0,quantos):v); }); },
    ondeCampo:function(c,campo,valor){
      return Promise.resolve(todos(c).filter(function(x){ return x[campo]===valor; })); },
    /* num só aparelho não há corrida que valha a pena travar */
    licenca:function(){ return Promise.resolve(true); }
  };
}

/* ─── a frota de estreia ────────────────────────────────── */
var DONO_EXEMPLO={email:'patrao@exemplo.cv', codigo:'9999', nome:'Dona Fátima'};

/* Os dois painéis precisam da mesma, com os mesmos números, senão o
   condutor escolhia um carro que o patrão não tem. Fica aqui, uma

function frotaNova(){

      {id:'c1',matricula:'CV-01-AB',marca:'Toyota',modelo:'Corolla',ano:2015,

    condutores:[
      {id:'m1',nome:'António Semedo',email:'antonio@exemplo.cv',codigo:'1234',

}

/* ─── avisar quem está a ver ────────────────────────────── */
function avisar(){
  for(var i=0;i<ouvintes.length;i++){ try{ ouvintes[i](); }catch(e){} } }

/* ─── a gaveta do próprio telemóvel ─────────────────────── */
function local(chave, valor){
  try{
    if(valor===undefined){
      var r=localStorage.getItem('fleetcv-'+chave);
      return r?JSON.parse(r):null; }
    localStorage.setItem('fleetcv-'+chave, JSON.stringify(valor));
  }catch(e){}
  return null;
}

/* ─── arrancar ──────────────────────────────────────────── */
/* op.frotaNova()  · a frota de estreia, se ainda não houver nenhuma
   op.exemplos(f)  · turnos de exemplo, para não abrir um ecrã vazio   */
/* Só há servidor quando a página vem de um. Aberta como ficheiro, ou
   publicada no Claude, não há — e passa-se aos outros motores. */
function haServidor(){
  if(typeof fetch!=='function') return Promise.resolve(false);
  if(!/^https?:$/.test(location.protocol)) return Promise.resolve(false);
  var corta=new Promise(function(ok){ setTimeout(function(){ ok(false); }, 4000); });
  return Promise.race([
    fetch('/api/ping', {credentials:'same-origin'})
      .then(function(r){ return r.ok?r.json():null; })
      .then(function(j){ return !!(j&&j.fleetcv); })
      .catch(function(){ return false; }),
    corta ]);
}

function arrancar(op){
  op=op||{}; opGuardado=op;
  D.frota  = local('frota')  || frotaNova();
  D.turnos = local('turnos') || [];
  avisar();
  var pedido;
  try{ pedido = (window.claude && claude.use) ? claude.use('db')
                                              : Promise.resolve(null); }
  catch(e){ pedido = Promise.resolve(null); }
  var seguir=function(x){
    loja = x ? lojaDeLonge(x) : lojaDePerto();
    if(x){ try{ if(claude.use) claude.use('user').then(function(u){ quem=u; }); }
           catch(e){} }
    return semear(op).then(escutar).then(function(){
      estado = loja.longe ? 'ligada' : 'perto'; avisar(); });
  };
  /* Primeiro pergunta-se se há servidor. Havendo, é ele — é o único
     dos três em que o condutor entra com o código do patrão e não
     precisa de conta em mais lado nenhum. */
  haServidor().then(function(sim){
    if(!sim) return pedido.then(seguir);
    var s=lojaDoServidor();
    loja=s;
    return s.comecar().then(function(entrou){
      estado = entrou ? 'servidor' : 'servidor-por-entrar';
      if(!entrou){ avisar(); return; }
      return semear(op).then(escutar).then(avisar);
    });
  }).catch(function(){
    try{ seguir(null); }catch(e){ estado='sozinha'; avisar(); } });
}

/* ─── a primeira vez: pôr lá a frota ────────────────────── */
/* Dois telemóveis podem abrir a aplicação ao mesmo tempo na estreia.
   A licença curta garante que só um é que semeia. */
function semear(op){
  return semearFrota().then(function(){ return semearExemplos(op); })
    .catch(function(){});
}

/* A frota tem de existir para o condutor poder escolher um carro.
   Qualquer um dos painéis a pode semear — dá o mesmo resultado, com
   os mesmos números — e a licença curta garante que só um o faz. */
function semearFrota(){
  return loja.ler('frota','config').then(function(s){
    if(s) return;
    return loja.licenca('frota','config',20000).then(function(posso){
      if(!posso) return;
      return loja.ler('frota','config').then(function(s2){
        if(s2) return;
        var f=D.frota||frotaNova();
        return Promise.all([
          loja.por('frota','config',{precoLitro:f.precoLitro,
                                     nome:f.nome||'A minha frota'}),
          loja.por('frota','carros',{lista:f.carros||[]}),
          loja.por('frota','condutores',{lista:f.condutores||[]})]);
      });
    });
  });
}

/* Os turnos de exemplo são outra história, e por isso têm a sua
   própria marca: só o painel do patrão os traz, e se o condutor
   tiver aberto a aplicação primeiro — semeando a frota — o patrão
   ainda assim abre com turnos para ver em vez de um ecrã vazio.
   Uma vez semeados, nunca mais: a partir daí os turnos são os
   verdadeiros. */
function semearExemplos(op){
  if(!op.exemplos) return Promise.resolve();
  return loja.ler('frota','exemplos').then(function(m){
    if(m) return;
    return loja.licenca('frota','exemplos',20000).then(function(posso){
      if(!posso) return;
      return loja.ler('frota','exemplos').then(function(m2){
        if(m2) return;
        return loja.ler('frota','carros').then(function(c){
          var f={ nome:(D.frota||{}).nome, precoLitro:(D.frota||{}).precoLitro,
                  carros:(c&&c.lista)||[], condutores:[] };
          return loja.ler('frota','condutores').then(function(m3){
            f.condutores=(m3&&m3.lista)||[];
            if(!f.carros.length||!f.condutores.length) return;
            return (op.exemplos(f)||[]).reduce(function(pr,t){
              return pr.then(function(){ return gravarTurnoNovo(t); }); },
              Promise.resolve())
              .then(function(){
                return loja.por('frota','exemplos',{quando:Date.now()}); });
          });
        });
      });
    });
  });
}

/* ─── ficar à escuta ────────────────────────────────────── */
function escutar(){
  var erro=function(e){ if(e&&e.code==='revoked'){ estado='sozinha'; avisar(); } };

  var frotaNova=function(mudar){
    var f=D.frota||{};
    var n={nome:f.nome, precoLitro:f.precoLitro,
           carros:f.carros||[], condutores:f.condutores||[]};
    mudar(n); D.frota=n; local('frota', n); avisar(); };

  subs.push(loja.verDoc('frota','config', function(d){
    if(d) frotaNova(function(n){ n.precoLitro=d.precoLitro; n.nome=d.nome; }); },
    erro));

  subs.push(loja.verDoc('frota','carros', function(d){
    if(d) frotaNova(function(n){ n.carros=d.lista||[]; }); }, erro));

  subs.push(loja.verDoc('frota','condutores', function(d){
    if(d) frotaNova(function(n){ n.condutores=d.lista||[]; }); }, erro));

  /* os turnos já fechados: o histórico */
  subs.push(loja.verColeccao('turnos', function(lista){
    var v=lista.filter(function(t){ return t && t.fim; });
    D.turnos=v; local('turnos', v.slice(0,60)); avisar(); },
    erro, 'inicio', 200));

  /* quem está a andar agora, com a posição ao vivo */
  subs.push(loja.verColeccao('vivo', function(lista){
    var agora=Date.now();
    D.vivos=lista.filter(function(t){
      /* um turno que não dá notícias há mais de 10 minutos já não
         está ao vivo: o telemóvel morreu ou ficou sem rede */
      return t && !t.fim && t.momento && agora-t.momento <= 600000;
    }).map(function(t){ t.aoVivo=true; return t; });
    avisar(); }, erro));

  return Promise.resolve();
}

/* ════════════════════════════════════════════════════════
   ESCREVER
   ════════════════════════════════════════════════════════ */
function semRasto(t){
  var c={}; for(var k in t) if(k!=='rasto'&&k!=='todos') c[k]=t[k];
  return c;
}

function gravarTurnoNovo(t){
  if(!loja) return Promise.resolve();
  var p=[loja.por('turnos', t.id, semRasto(t))];
  if((t.rasto||[]).length) p.push(gravarRasto(t.id, t.rasto));
  return Promise.all(p).catch(function(){});
}

/* O rasto vai aos pedaços: um documento não leva mais do que cabe, e
   assim uma gravação que falha não leva o turno todo à frente. */
function gravarRasto(id, pts){
  if(!loja||!pts||!pts.length) return Promise.resolve();
  var partes=[];
  for(var i=0;i<pts.length;i+=PARTE_MAX)
    partes.push(pts.slice(i, i+PARTE_MAX));
  return partes.reduce(function(p, pedaco, n){
    return p.then(function(){
      return loja.por('rastos', id+'_'+n, {turno:id, parte:n, pts:pedaco});
    });
  }, Promise.resolve()).catch(function(){});
}

/* Ler o rasto todo de um turno — só quando alguém abre o mapa dele. */
function rastoDe(id){
  if(cacheRasto[id]) return Promise.resolve(cacheRasto[id]);
  if(!loja) return Promise.resolve(null);
  return loja.ondeCampo('rastos','turno',id).then(function(ds){
    var partes=[];
    ds.forEach(function(x){ partes[x.parte]=x.pts||[]; });
    var todos=[];
    for(var i=0;i<partes.length;i++) if(partes[i]) todos=todos.concat(partes[i]);
    cacheRasto[id]=todos;
    return todos;
  }).catch(function(){ return null; });
}

/* ─── a posição ao vivo ─────────────────────────────────── */
/* Chamada a cada ponto de GPS, mas só sobe de 4 em 4 segundos e só se
   o carro mexeu. É este travão que faz caber um dia de trabalho. */
var pendente=null, relogioVivo=null, ultimaSubida=0, aEscrever=false;

function posicao(t, extra, jaa){
  if(!t||!t.id) return;
  var u=(t.rasto||[])[(t.rasto||[]).length-1];
  pendente = {
    id:t.id, carroId:t.carroId, matricula:t.matricula, condutor:t.condutor,
    condutorId:t.condutorId||null, inicio:t.inicio, fim:null,
    kmInicio:t.kmInicio, totalCve:t.totalCve||0,
    abast:(t.abast||[]).map(function(a){
      return {hora:a.hora, valor:a.valor, posto:a.posto, lat:a.lat, lon:a.lon,
              litrosTalao:a.litrosTalao||null, temFoto:!!a.foto||!!a.temFoto}; }),
    lat:u?u[0]:null, lon:u?u[1]:null, precisao:u?u[3]:null, vel:u?u[4]:0,
    kmGps: extra&&extra.kmGps!=null ? +extra.kmGps.toFixed(2) : null,
    bateria: extra?extra.bateria:null,
    onde: extra?extra.onde:null,
    simulado: !!t.simulado,
    rasto:(t.rasto||[]).slice(-CAUDA),
    momento: Date.now()
  };
  if(!relogioVivo) relogioVivo=setInterval(subir, 1000);
  subir(jaa);
}

function subir(jaa){
  if(!loja||!pendente||aEscrever) return;
  var agora=Date.now();
  if(!jaa && agora-ultimaSubida < ritmo) return;
  var p=pendente; pendente=null; ultimaSubida=agora; aEscrever=true;
  loja.por('vivo', p.id, p).then(function(){
    aEscrever=false;
    if(ritmo>RITMO_VIVO) ritmo=Math.max(RITMO_VIVO, ritmo-4000);
  }).catch(function(e){
    aEscrever=false;
    /* a nuvem queixou-se do ritmo: abrandar em vez de insistir */
    if(e&&e.code==='resource_exhausted') ritmo=Math.min(TECTO_VIVO, ritmo*2);
  });
}

/* ─── abrir, ir gravando, e fechar ──────────────────────── */
var relogioRasto=null;

function abrirTurno(t){
  if(!loja) return Promise.resolve();
  return loja.por('turnos', t.id, semRasto(t)).catch(function(){});
}

function guardandoRasto(dar){
  if(relogioRasto) clearInterval(relogioRasto);
  relogioRasto=setInterval(function(){
    var t=dar(); if(!t||!t.id||!(t.rasto||[]).length) return;
    gravarRasto(t.id, t.rasto);
  }, RITMO_RASTO);
}

function fecharTurno(t){
  pendente=null;
  if(relogioRasto){ clearInterval(relogioRasto); relogioRasto=null; }
  if(relogioVivo){ clearInterval(relogioVivo); relogioVivo=null; }
  if(!loja) return Promise.resolve();
  cacheRasto[t.id]=(t.rasto||[]).slice();
  return gravarRasto(t.id, t.rasto)
    .then(function(){ return loja.por('turnos', t.id, semRasto(t)); })
    .then(function(){ return loja.tirar('vivo', t.id); })
    .catch(function(){});
}

/* ─── o patrão a mexer na frota e a responder aos alertas ─ */
function guardarFrota(f){
  /* As listas copiam-se ANTES de escrever. Gravar avisa quem está à
     escuta, e esse aviso volta aqui a substituir as listas — se se
     escrevesse directamente de f, a segunda gravação já ia com a
     lista velha que o aviso acabou de lá pôr, e a alteração
     perdia-se sem dar erro nenhum. */
  var cfg={precoLitro:f.precoLitro, nome:f.nome||''};
  var carros=(f.carros||[]).slice();
  var conds=(f.condutores||[]).slice();
  D.frota={nome:cfg.nome, precoLitro:cfg.precoLitro,
           carros:carros, condutores:conds};
  local('frota', D.frota);
  if(!loja) return Promise.resolve();
  return Promise.all([
    loja.por('frota','config',cfg),
    loja.por('frota','carros',{lista:carros}),
    loja.por('frota','condutores',{lista:conds})
  ]).catch(function(){});
}
function guardarTurno(t){
  if(!loja) return Promise.resolve();
  return loja.por('turnos', t.id, semRasto(t)).catch(function(){});
}
function apagarTurno(id){
  if(!loja) return Promise.resolve();
  return loja.tirar('turnos', id).catch(function(){});
}

/* ════════════════════════════════════════════════════════ */
return {
  arrancar:arrancar,
  aoMudar:function(f){ ouvintes.push(f); },
  estado:function(){ return estado; },
  dados:function(){ return D; },
  podeEscrever:function(){
    if(!quem||!quem.can) return null;
    try{ return quem.can('data.write'); }catch(e){ return null; } },
  abrirTurno:abrirTurno,
  guardandoRasto:guardandoRasto,
  posicao:posicao,
  fecharTurno:fecharTurno,
  guardarFrota:guardarFrota,
  guardarTurno:guardarTurno,
  gravarTurnoNovo:gravarTurnoNovo,
  apagarTurno:apagarTurno,
  rastoDe:rastoDe,
  local:local,
  frotaNova:frotaNova,
  /* Entrar. Com servidor é ele que confere o código e devolve quem é —
     e só ele conhece os códigos todos. Sem servidor, confere-se com a
     lista da frota, como até aqui. */
  temServidor:function(){ return !!(loja&&loja.servidor); },
  entrar:function(email, codigo){
    var e=String(email||'').trim().toLowerCase(), c=String(codigo||'').trim();
    if(loja&&loja.servidor)
      return loja.entrar(e,c).then(function(j){
        return loja.comecar().then(function(){
          return semear(opGuardado).then(escutar).then(function(){
            estado='servidor'; avisar();
            return {papel:j.papel, id:j.id, nome:j.nome}; }); });
      }).catch(function(x){
        return {erro: x.porque || 'Não foi possível entrar.'}; });
    return Promise.resolve(entrarCaDentro(e,c));
  },
  sair:function(){
    if(loja&&loja.servidor) return loja.sair().catch(function(){});
    return Promise.resolve();
  }
};

/* Sem servidor: a lista da frota é o que há. Serve para experimentar;
   não é segurança nenhuma, e por isso o servidor existe. */
function entrarCaDentro(email, codigo){
  var f=D.frota||{};
  var m=(f.condutores||[]).filter(function(x){
    return String(x.email||'').toLowerCase()===email
        && String(x.codigo||'')===codigo; })[0];
  if(m&&m.estado!=='INACTIVO')
    return {papel:'condutor', id:m.id, nome:m.nome};
  if(email===DONO_EXEMPLO.email && codigo===DONO_EXEMPLO.codigo)
    return {papel:'dono', id:'dono', nome:DONO_EXEMPLO.nome};
  return {erro:'E-mail ou código errados.'};
}
})();
/*MAPA>>>*/
</script>

<script>
(function(){
"use strict";

/* ─── a frota ────────────────────────────────────────────
   Não está escrita aqui: é o patrão que a define no painel dele, e
   chega a este telemóvel pela nuvem. Se o patrão acrescentar um carro
   às três da tarde, ele aparece nesta lista sem ninguém reinstalar
   nada. Estes valores são só o que se mostra enquanto a nuvem não
   responde. */
var FROTA = { precoLitro:145, carros:[], condutores:[] };

/* Os postos são os verdadeiros do OpenStreetMap (ver mapa_praia). */
var POSTOS = MAPA_PRAIA.postos;
var LIM = {gapKm:3, kmMax:500, precisaoMax:50, velMax:180, divLitros:3};

var S = {ecra:'entrar', eu:null, carro:null, turno:null, turnos:[],
         gps:{estado:'desligado', precisao:null, vel:0, porque:null, autoriz:null}, bateria:null,
         foto:null, r:{}, aviso:null, simular:false, verTurno:null};
var vigia=null, tic=null, cronoSim=null, ultima=null, vista={}, primeiroTiro=null;
var salvo=null;
var medida={W:400,H:620};

/* ─── utilitários ────────────────────────────────────────── */
function nf(v,d){ d=d||0; var p=Math.abs(Number(v)||0).toFixed(d).split('.');
  p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.');
  return (Number(v)<0?'−':'')+p.join(','); }
function hms(s){ s=Math.max(0,Math.floor(s));
  return String(Math.floor(s/3600)).padStart(2,'0')+':'+
         String(Math.floor(s%3600/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function hh(ms){ var d=new Date(ms);
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function dt(ms){ var d=new Date(ms), a=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'],
  m=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  return a[d.getDay()]+' '+d.getDate()+' '+m[d.getMonth()]; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function el(id){ return document.getElementById(id); }
function dist(a,b,c,d){ var R=6371000,g=Math.PI/180;
  return 2*R*Math.asin(Math.sqrt(Math.pow(Math.sin((c-a)*g/2),2)+
    Math.cos(a*g)*Math.cos(c*g)*Math.pow(Math.sin((d-b)*g/2),2))); }
function kmRasto(p){ var m=0,a=null;
  for(var i=0;i<(p||[]).length;i++){ var x=p[i];
    if(x[3]!=null&&x[3]>LIM.precisaoMax) continue;
    if(a){ var s=(x[2]-a[2])/1000, d=dist(a[0],a[1],x[0],x[1]);
      if(s>0&&(d/s)*3.6<=LIM.velMax) m+=d; }
    a=x; }
  return m/1000; }
/* Guarda-se sempre no próprio telemóvel — é o que segura o turno se
   a rede cair ou a bateria acabar — e a nuvem leva-o ao patrão. */
function guardar(){
  Nuvem.local('condutor', {eu:S.eu&&S.eu.id, carro:S.carro&&S.carro.id,
    turno:S.turno, turnos:S.turnos.slice(0,20)});
  if(S.turno&&!S.turno.fim)
    Nuvem.posicao(S.turno, {kmGps:kmRasto(S.turno.rasto), bateria:S.bateria,
      onde:ondeEstou()});
}
function carregar(){ return Nuvem.local('condutor'); }
function ondeEstou(){
  var u=S.ultimaPos||(S.turno&&S.turno.rasto.length
    ? S.turno.rasto[S.turno.rasto.length-1] : null);
  return u?bairroDe(u[0],u[1]):null; }

/* ─── GPS ────────────────────────────────────────────────── */
/* Três coisas diferentes fazem o GPS "não funcionar", e a mensagem
   tem de dizer qual delas é, senão o condutor fica preso no ecrã:
     1) a página está dentro de uma moldura (é assim que o Claude a
        mostra) e o telemóvel nem chega a perguntar;
     2) o condutor recusou, ou a localização do telemóvel está
        desligada;
     3) está dentro de um prédio e ainda não apanhou satélites.    */
function emMoldura(){ try{ return window.self!==window.top; }catch(e){ return true; } }

function verAutorizacao(){
  if(!navigator.permissions||!navigator.permissions.query) return;
  try{ navigator.permissions.query({name:'geolocation'}).then(function(a){
    S.gps.autoriz=a.state;
    a.onchange=function(){ S.gps.autoriz=a.state;
      if(a.state==='granted'&&S.gps.estado!=='ligado') ligarGps(); else pintarTopo(); };
  }).catch(function(){}); }catch(e){}
}

function ligarGps(){
  if(S.simular) return;
  if(!navigator.geolocation){
    S.gps.estado='indisponivel';
    S.gps.porque='Este telemóvel não sabe dar a localização ao navegador.';
    pintar(); return; }
  if(!window.isSecureContext){
    S.gps.estado='indisponivel';
    S.gps.porque='A página tem de abrir em https:// para o telemóvel dar a localização.';
    pintar(); return; }
  if(vigia!=null) return;
  S.gps.estado='a-procurar'; S.gps.porque=null; verAutorizacao(); pintar();
  var op={enableHighAccuracy:true, maximumAge:4000, timeout:30000};
  /* um primeiro tiro rápido e grosseiro, para não ficar parado em
     "a procurar" enquanto o GPS fino não acerta */
  try{ navigator.geolocation.getCurrentPosition(aceitarGps, falhouGps,
    {enableHighAccuracy:false, maximumAge:60000, timeout:8000}); }catch(e){}
  try{ vigia=navigator.geolocation.watchPosition(aceitarGps, falhouGps, op); }
  catch(e){ falhouGps({code:2}); }
  primeiroTiro=setTimeout(function(){
    if(S.gps.estado==='a-procurar'&&!S.gps.porque){
      S.gps.porque='Já vão '+15+' segundos à procura. À janela ou na rua costuma apanhar '+
        'em poucos segundos.'; pintar(); } }, 15000);
}

function aceitarGps(pos){
  var c=pos.coords, antes=S.gps.estado;
  if(primeiroTiro){ clearTimeout(primeiroTiro); primeiroTiro=null; }
  S.gps.estado='ligado'; S.gps.porque=null; S.gps.precisao=Math.round(c.accuracy);
  var kmh = c.speed!=null&&c.speed>=0 ? c.speed*3.6 : calcVel(pos);
  S.gps.vel = S.gps.vel*0.55 + kmh*0.45;
  if(S.turno&&!S.turno.fim&&c.accuracy<=120)
    S.turno.rasto.push([+c.latitude.toFixed(6), +c.longitude.toFixed(6),
      pos.timestamp, Math.round(c.accuracy), Math.round(kmh)]);
  S.ultimaPos=[c.latitude, c.longitude];
  if(S.turno&&!S.turno.fim)
    Nuvem.posicao(S.turno, {kmGps:kmRasto(S.turno.rasto), bateria:S.bateria,
      onde:ondeEstou()});
  if(S.ecra==='gps'&&antes!=='ligado') pintar();
  else if(S.ecra==='volante') pintar(); else pintarTopo();
}

function falhouGps(e){
  var moldura=emMoldura();
  if(e.code===3){
    if(S.gps.estado!=='ligado'){ S.gps.estado='a-procurar';
      S.gps.porque='O telemóvel ainda não apanhou satélites. Dentro de um prédio '+
        'demora; à janela ou na rua apanha em segundos.'; }
  } else if(e.code===1){
    S.gps.estado='recusado';
    S.gps.porque = moldura
      ? 'Esta página está dentro de uma janela do Claude e o telemóvel não deixa pedir '+
        'a localização daqui. Abra o mesmo link num separador só dele — no canto da '+
        'janela há o botão de abrir — e a localização passa a funcionar.'
      : (S.gps.autoriz==='denied'
        ? 'A localização está bloqueada para este site. No navegador: cadeado ao lado '+
          'do endereço → Localização → Permitir, e recarregue a página.'
        : 'Não foi dada autorização. Carregue outra vez em "Ligar o GPS" e responda '+
          '"Permitir" à pergunta do telemóvel.');
  } else {
    S.gps.estado='sem-sinal';
    S.gps.porque='O telemóvel não conseguiu a posição. Veja se a localização está '+
      'ligada nas definições do telemóvel (não só no navegador).';
  }
  if(vigia!=null&&e.code===1){ navigator.geolocation.clearWatch(vigia); vigia=null; }
  pintar();
}
function calcVel(pos){
  var a={lat:pos.coords.latitude, lon:pos.coords.longitude, t:pos.timestamp}, v=0;
  if(ultima){ var s=(a.t-ultima.t)/1000;
    if(s>0.5) v=Math.min(dist(ultima.lat,ultima.lon,a.lat,a.lon)/s*3.6, LIM.velMax); }
  ultima=a; return v;
}
function desligarGps(){ if(vigia!=null){ navigator.geolocation.clearWatch(vigia); vigia=null; }
  if(primeiroTiro){ clearTimeout(primeiroTiro); primeiroTiro=null; }
  if(cronoSim){ clearInterval(cronoSim); cronoSim=null; }
  S.gps.estado='desligado'; S.gps.vel=0; S.gps.porque=null; ultima=null; vista={}; }
function bateria(){ if(!navigator.getBattery) return;
  navigator.getBattery().then(function(b){ S.bateria=Math.round(b.level*100);
    b.addEventListener('levelchange',function(){ S.bateria=Math.round(b.level*100);
      pintarTopo(); }); pintarTopo(); }).catch(function(){}); }

/* ─── experimentar sem conduzir ──────────────────────────── */
/* O carro do ensaio anda pelas ruas verdadeiras da Praia e vira nos
   cruzamentos, para o condutor ver ao certo o que vai ver na rua. */
function simular(){
  var r=Date.now()%99991;
  var rnd=function(){ r=(r*1103515245+12345)%2147483648; return r/2147483648; };
  var caminho=percursoPorRuas(rnd, 1200, 28);
  if(caminho.length<10){ caminho=[]; var la=14.9177, lo=-23.5092;
    for(var z=0;z<300;z++){ la+=0.00012; lo+=0.00009*(z%40<20?1:-1);
      caminho.push([la,lo]); } }
  var n=0;
  cronoSim=setInterval(function(){
    if(!S.turno||S.turno.fim){ clearInterval(cronoSim); cronoSim=null; return; }
    for(var q=0;q<2;q++){
      var p=caminho[n%caminho.length];
      var vel=(n%23<3)?0:(20+Math.round(rnd()*30));   /* semáforos e paragens */
      S.turno.rasto.push([+p[0].toFixed(6), +p[1].toFixed(6),
        S.turno.inicio+n*4000, 8, vel]);
      S.gps.vel=vel; S.ultimaPos=[p[0],p[1]]; n++;
    }
    S.gps.estado='ligado'; S.gps.precisao=8;
    Nuvem.posicao(S.turno, {kmGps:kmRasto(S.turno.rasto), bateria:S.bateria,
      onde:ondeEstou()});
    if(S.ecra==='volante') pintar();
  }, 420);
}

/* ─── foto ───────────────────────────────────────────────── */
function lerFoto(f,cb){ var fr=new FileReader();
  fr.onload=function(){ var im=new Image();
    im.onload=function(){ var k=Math.min(1,520/Math.max(im.width,im.height));
      var cv=document.createElement('canvas');
      cv.width=Math.round(im.width*k); cv.height=Math.round(im.height*k);
      cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
      try{ cb(cv.toDataURL('image/jpeg',0.6)); }catch(e){ cb(fr.result); } };
    im.onerror=function(){ cb(fr.result); }; im.src=fr.result; };
  fr.readAsDataURL(f); }

/* ─── contas do turno ────────────────────────────────────── */
function contas(t){
  var v=[], kmQ=t.kmFim-t.kmInicio, kmG=kmRasto(t.rasto), dif=0;
  v.push({ok:true, t1:'Quilometragem registada',
    t2:nf(t.kmInicio)+' → '+nf(t.kmFim), vl:nf(kmQ)+' km'});
  if(t.gap>LIM.gapKm){
    v.push({ok:false, t1:'O carro andou fora do turno',
      t2:'estava '+nf(t.gap)+' km à frente de onde ficou', vl:'+'+nf(t.gap)+' km'});
    dif += Math.round(t.gap*7.5/100*FROTA.precoLitro);
  }
  if(t.rasto.length>5){
    var d=kmQ>0?(kmQ-kmG)/kmQ*100:0;
    var bate=Math.abs(d)<15;
    v.push({ok:bate, t1:'O GPS bate com o conta-quilómetros',
      t2:bate?'diferença de '+nf(d,1)+'%, o normal':
        nf(kmQ-kmG)+' km andados sem se saber para onde', vl:nf(kmG,1)+' km'});
  } else v.push({ok:false, t1:'Percurso gravado', t2:'o GPS não esteve ligado', vl:'—'});

  t.abast.forEach(function(a){
    var litros=a.valor/FROTA.precoLitro;
    v.push({ok:!!a.foto, t1:'Talão fotografado',
      t2:esc(a.posto)+' · '+hh(a.hora), vl:nf(a.valor)+' CVE'});
    v.push({ok:litros<=t.deposito*1.05, t1:'Os litros cabem no depósito',
      t2:nf(litros,2)+' num depósito de '+nf(t.deposito), vl:nf(litros,2)+' l'});
    if(a.litrosTalao){
      var dd=Math.abs(a.litrosTalao-litros)/litros*100, b2=dd<=LIM.divLitros;
      var noTalao=Math.round(a.litrosTalao*FROTA.precoLitro);
      v.push({ok:b2, t1:'O que escreveu bate com o talão',
        t2:b2?'escreveu '+nf(a.valor)+' CVE e o talão diz o mesmo'
             :'escreveu '+nf(a.valor)+' CVE · o talão dá '+nf(noTalao)+' CVE',
        vl:b2?'bate':nf(a.valor-noTalao)+' CVE'});
      if(!b2) dif += a.valor-noTalao;
    }
  });
  return {v:v, dif:dif, kmQ:kmQ, kmG:kmG};
}

/* ─── mapa ───────────────────────────────────────────────── */
/* O desenho está em desenharMapa(); aqui só se decide o que
   mostrar ao condutor enquanto conduz. */
function mapa(rasto, seguir){
  var pts=(rasto||[]).filter(function(p){ return p[3]==null||p[3]<=LIM.precisaoMax; });
  var aviso=null;
  if(!pts.length) aviso = S.gps.estado==='recusado'||S.gps.estado==='indisponivel'
    ? 'sem GPS — conta pelo quadrante' : 'à espera do GPS…';
  return desenharMapa({
    pts:pts, W:medida.W, H:medida.H, pad:26, seguir:seguir!==false, vista:vista,
    minSpan:0.0125, minSpanVazio:0.05, pulsar:true, aviso:aviso, margemBaixo:62,
    centro: S.ultimaPos || [14.9195,-23.5087],
    abast: (S.turno&&S.turno.abast||[]).map(function(a){
      return {lat:a.lat, lon:a.lon, posto:a.posto}; }),
    rotulo:'O caminho do carro no mapa da Praia'});
}
function arco(v){
  var f=Math.max(0,Math.min(v/120,1)), C=Math.PI*22;
  var cor=v>90?'var(--crit)':(v>70?'var(--warn)':'var(--accent)');
  return '<svg class="arco" viewBox="0 0 52 30" aria-hidden="true">'+
    '<path d="M4 26 A22 22 0 0 1 48 26" fill="none" stroke="var(--line)" '+
    'stroke-width="4.5" stroke-linecap="round" opacity=".5"/>'+
    '<path d="M4 26 A22 22 0 0 1 48 26" fill="none" stroke="'+cor+'" stroke-width="4.5" '+
    'stroke-linecap="round" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+
    (C*(1-f)).toFixed(1)+'" style="transition:stroke-dashoffset .35s ease"/></svg>';
}
function caixaFoto(t,d){
  return S.foto
    ? '<label class="foto feita"><img src="'+S.foto+'" alt="'+esc(t)+'">'+
      '<span class="re">Repetir</span><input type="file" accept="image/*" '+
      'capture="environment" id="ff"></label>'
    : '<label class="foto"><span class="ic">📷</span><span class="t">'+esc(t)+'</span>'+
      '<span class="t2">'+esc(d)+'</span><input type="file" accept="image/*" '+
      'capture="environment" id="ff"></label>';
}
function postosPerto(lat,lon,n){
  if(lat==null) return [];
  return POSTOS.map(function(p){ return {p:p, m:Math.round(dist(lat,lon,p.lat,p.lon))}; })
    .sort(function(a,b){ return a.m-b.m; }).slice(0,n||4);
}

function ajustarMapa(){
  var cx=document.querySelector('.volante'); if(!cx) return;
  var W=Math.round(cx.clientWidth), H=Math.round(cx.clientHeight);
  if(W<60||H<60) return;
  if(Math.abs(W-medida.W)<6&&Math.abs(H-medida.H)<6) return;
  medida={W:W, H:H}; vista={};
  var sv=cx.querySelector('.mapa');
  if(sv) sv.outerHTML=mapa(S.turno?S.turno.rasto:[], true);
}
function pintarTopo(){
  var p=[];
  if(S.ecra!=='entrar'){
    var r={ligado:'GPS ligado','a-procurar':'a procurar',recusado:'sem GPS',
      'sem-sinal':'sem sinal',indisponivel:'sem GPS',desligado:'GPS desligado'}[S.gps.estado];
    var c=S.gps.estado==='ligado'?'viva':(S.gps.estado==='recusado'||
      S.gps.estado==='indisponivel'?'morta':'');
    p.push('<span class="pill '+c+'">'+r+'</span>');
    if(S.bateria!=null) p.push('<span class="pill">'+S.bateria+'%</span>');
    /* se não houver ligação, o patrão não está a ver nada disto — e o
       condutor tem de o saber, senão julga que já entregou o turno */
    if(!/^(servidor|ligada|a-ligar)$/.test(Nuvem.estado()))
      p.push('<span class="pill" title="Sem ligação: o turno fica guardado '+
        'aqui e sobe quando houver rede">sem ligação</span>');
  }
  el('dir').innerHTML=p.join('');
}

document.addEventListener('visibilitychange', function(){
  if(document.visibilityState==='hidden') guardar(); });

  var t=e.target, id=t.id;

  if(id==='i-kmf'){ S.r.kmF=+t.value; suave(); }

});
var adiado=null;
function suave(){ clearTimeout(adiado); adiado=setTimeout(function(){
  var a=document.activeElement, id=a&&a.id, p=a&&a.selectionStart;
  pintar(); if(id){ var n=el(id); if(n){ n.focus();
    try{ n.setSelectionRange(p,p); }catch(x){} } } }, 300); }

document.addEventListener('change', function(e){
  if(e.target.id==='ff'&&e.target.files&&e.target.files[0])
    lerFoto(e.target.files[0], function(u){ S.foto=u; pintar(); });
});

document.addEventListener('click', function(e){
  var b=e.target.closest('[data-f],[data-carro],[data-posto],[data-ver]');
  if(!b) return;
  var d=b.dataset;
  if(d.carro){ S.carro=FROTA.carros.filter(function(c){ return c.id===d.carro; })[0];
    S.foto=null; S.r={km:S.carro.km}; S.ecra='km-inicio'; pintar(); return; }
  if(d.posto!=null){ S.r.posto=d.posto; pintar(); return; }
  if(d.ver){ S.verTurno=d.ver; S.ecra='resumo'; pintar(); return; }

  var f=d.f;
  if(f==='entrar'){
    var em=(S.r.email||'').trim().toLowerCase(), co=String(S.r.cod||'').trim();
    if(!em||!co){ S.aviso='Escreva o email e o código.'; pintar(); return; }
    /* Quem confere o código é a nuvem: havendo servidor é ele, e o
       código nunca chega a este telemóvel. */
    S.aviso='a entrar…'; pintar();
    Nuvem.entrar(em, co).then(function(r){
      if(r.erro||r.papel!=='condutor'){
        S.aviso = r.erro || 'Esta conta é do proprietário, não de condutor.';
        pintar(); return; }
      S.eu = FROTA.condutores.filter(function(c){ return c.id===r.id; })[0]
             || {id:r.id, nome:r.nome, email:em};
      S.aviso=null; S.r={}; guardar(); S.ecra='carro'; pintar();
    });
  }
  if(f==='sair'){
    Nuvem.sair();
    S.eu=null; S.r={}; guardar(); S.ecra='entrar'; pintar(); }
  if(f==='ir-carro'){ S.foto=null; S.r={}; S.ecra='carro'; pintar(); }
  if(f==='ir-meus'){ S.verTurno=null; S.ecra='meus'; pintar(); }
  if(f==='ir-gps'){ S.simular=false; ligarGps(); S.ecra='gps'; pintar(); }
  if(f==='pedir-gps'){ ligarGps(); pintar(); }
  if(f==='comecar') comecar(false);
  if(f==='comecar-sim') comecar(true);
  if(f==='ir-volante'){ S.foto=null; S.r={}; S.ecra='volante'; pintar(); }
  if(f==='ir-abast'){ S.foto=null; S.r={}; S.ecra='abastecer'; pintar(); }
  if(f==='guardar-abast'){
    var v=S.r.valor||0; if(v<=0) return;
    var u2=S.turno.rasto[S.turno.rasto.length-1];
    var pp=postosPerto(u2?u2[0]:null, u2?u2[1]:null, 1);
    S.turno.abast.push({hora:Date.now(), valor:v, litrosTalao:S.r.litros||null,
      foto:S.foto, posto:S.r.posto||(pp[0]?pp[0].p.nome:'posto'),
      lat:u2?u2[0]:null, lon:u2?u2[1]:null});
    S.turno.totalCve+=v;
    S.foto=null; S.r={};
    Nuvem.posicao(S.turno, {kmGps:kmRasto(S.turno.rasto), bateria:S.bateria,
      onde:ondeEstou()}, true);
    guardar(); S.ecra='volante'; pintar();
  }
  if(f==='ir-fim'){ S.foto=null; S.r={}; S.ecra='km-fim'; pintar(); }
  if(f==='terminar') terminar();
});

function comecar(sim){
  S.simular=!!sim;
  S.turno={ id:'t'+Date.now(), inicio:Date.now(), fim:null,
    carroId:S.carro.id, matricula:S.carro.matricula, condutor:S.eu.nome,
    kmInicio:(S.r.km==null?S.carro.km:S.r.km), kmFim:null,
    gap:(S.r.km==null?S.carro.km:S.r.km)-S.carro.km,
    deposito:S.carro.deposito, rasto:[], abast:[], totalCve:0,
    fotoInicio:S.foto, simulado:!!sim };
  S.turno.condutorId=S.eu.id;
  S.foto=null; S.r={};
  if(sim){ desligarGps(); simular(); } else ligarGps();
  if(!tic) tic=setInterval(function(){ if(S.ecra==='volante') pintar(); }, 1000);
  if(!salvo) salvo=setInterval(guardar, 8000);
  /* o patrão passa a ver este turno no mapa dele a partir de agora */
  Nuvem.abrirTurno(S.turno);
  Nuvem.guardandoRasto(function(){ return S.turno; });
  Nuvem.posicao(S.turno, {onde:ondeEstou()}, true);
  guardar(); S.ecra='volante'; pintar();
}

function terminar(){
  var t=S.turno;
  var kmF=S.r.kmF==null?t.kmInicio+Math.round(kmRasto(t.rasto)):S.r.kmF;
  if(kmF<t.kmInicio||kmF-t.kmInicio>LIM.kmMax) return;
  t.kmFim=kmF; t.fim=Date.now(); t.fotoFim=S.foto;
  t.kmGps=+kmRasto(t.rasto).toFixed(1);
  t.semSinalS=maiorBuraco(t.rasto);
  t.fotos=!!(t.fotoInicio&&t.fotoFim);
  t.precoLitro=FROTA.precoLitro;
  /* A prova de cada abastecimento calcula-se aqui, onde está o rasto
     inteiro. O patrão recebe dois números em vez de milhares de
     pontos de GPS. */
  (t.abast||[]).forEach(function(a){
    a.temFoto=!!a.foto;
    a.prova=provaDoPosto(t.rasto, a.posto, LIM.raioPosto); });
  desligarGps();
  if(tic){ clearInterval(tic); tic=null; }
  if(salvo){ clearInterval(salvo); salvo=null; }
  S.carro.km=kmF;
  S.turnos.unshift(t); S.turno=null; S.foto=null; S.r={}; S.simular=false;
  /* sobe o turno inteiro, com o rasto, e sai do mapa ao vivo */
  Nuvem.fecharTurno(t);
  if(S.carro) Nuvem.guardarFrota(FROTA);
  guardar(); S.ecra='resumo'; pintar();
}

/* ═══ ARRANQUE ═══════════════════════════════════════════
   A frota vem do patrão, pela nuvem, por isso não está cá quando a
   página abre. Mostra-se o que houver e completa-se quando chegar. */
var arrancado=false;

function comServidor(){ return Nuvem.temServidor(); }
function retomar(){
  var L=carregar();
  if(!L) return;
  var acha=function(lista,id){
    var r=null; (lista||[]).forEach(function(x){ if(x.id===id) r=x; }); return r; };
  if(L.turnos) S.turnos=L.turnos;
  if(!S.eu&&L.eu) S.eu=acha(FROTA.condutores, L.eu);
  if(!S.carro&&L.carro) S.carro=acha(FROTA.carros, L.carro);
  if(!S.turno&&L.turno&&!L.turno.fim&&S.eu){
    S.turno=L.turno;
    S.carro=acha(FROTA.carros, L.turno.carroId)||S.carro;
    S.simular=!!L.turno.simulado;
    S.ecra='volante';
    if(S.simular) simular(); else ligarGps();
    if(!tic) tic=setInterval(function(){ if(S.ecra==='volante') pintar(); },1000);
    if(!salvo) salvo=setInterval(guardar, 8000);
    Nuvem.guardandoRasto(function(){ return S.turno; });
  } else if(S.eu && S.ecra==='entrar') S.ecra='carro';
}

Nuvem.aoMudar(function(){
  var d=Nuvem.dados();
  if(d.frota){
    FROTA.precoLitro = d.frota.precoLitro || FROTA.precoLitro;
    FROTA.carros     = d.frota.carros     || FROTA.carros;
    FROTA.condutores = d.frota.condutores || FROTA.condutores;
    /* o patrão pode ter mudado a matrícula ou o preço a meio do turno */
    if(S.eu)    S.eu    = FROTA.condutores.filter(function(x){
                            return x.id===S.eu.id; })[0] || S.eu;
    if(S.carro) S.carro = FROTA.carros.filter(function(x){
                            return x.id===S.carro.id; })[0] || S.carro;
  }
  if(!arrancado && (FROTA.condutores.length || Nuvem.estado()!=='a-ligar')){
    arrancado=true; retomar();
  }
  pintar();
});
Nuvem.arrancar({});
/* se a nuvem não responder em 8 segundos, segue-se com o que há */
setTimeout(function(){ if(!arrancado){ arrancado=true; retomar(); pintar(); } }, 8000);
pintar();
bateria();
})();
</script>
