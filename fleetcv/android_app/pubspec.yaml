name: fleetcv
description: Controlo de frota para Cabo Verde — app do condutor.
publish_to: none
version: 0.3.0+3

environment:
  # O que a resolução real exigiu, não um palpite: com estas versões o
  # pubspec.lock pede Dart >= 3.12.
  sdk: ">=3.12.0 <4.0.0"

# Versões fixas, tiradas do pubspec.lock da primeira compilação que ficou verde
# (execução nº 3). Uma compilação que funciona hoje tem de funcionar amanhã.
dependencies:
  flutter:
    sdk: flutter
  geolocator: 14.0.3       # posição + isMocked + serviço em primeiro plano
  image_picker: 1.2.3      # câmara do telemóvel
  sqflite: 2.4.4           # turnos gravados no aparelho
  path: 1.9.1
  path_provider: 2.1.6
  battery_plus: 6.2.3      # distingue "acabou a bateria" de "desligou o GPS"
  # Intervalo largo enquanto a primeira compilação com este pacote não fica
  # verde; fixa-se a seguir, como os outros.
  share_plus: ">=10.1.0 <12.0.0"   # enviar os turnos ao dono pelo WhatsApp

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0

flutter:
  uses-material-design: true
