<title>FleetCV</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#EDF0F0; --surface:#FFFFFF; --surface2:#F4F7F7; --line:#D5DCDC; --line2:#E7ECEC;
  --ink:#0F1618; --muted:#5C6A6C; --fraco:#8A9696;
  --accent:#0B7F8E; --accent-ink:#FFFFFF; --accent-wash:#E3F1F3;
  --ok:#3E7B22; --ok-wash:#EAF2E4;
  --warn:#A86A05; --warn-wash:#F8EEDC;
  --crit:#B02E20; --crit-wash:#F8E6E3;
  --sombra:0 1px 2px rgba(15,22,24,.06), 0 10px 28px -20px rgba(15,22,24,.45);
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --sans:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  --display:'Archivo',var(--sans);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0B1011; --surface:#141A1B; --surface2:#1A2122; --line:#293233; --line2:#212929;
  --ink:#E3E9E8; --muted:#8A9897; --fraco:#6B7877;
  --accent:#3FC0CE; --accent-ink:#06191C; --accent-wash:#122E32;
  --ok:#77C34B; --ok-wash:#17280F;
  --warn:#DCA43C; --warn-wash:#2E2310;
  --crit:#E4776A; --crit-wash:#331714;
  --sombra:0 1px 2px rgba(0,0,0,.45), 0 10px 28px -20px rgba(0,0,0,.9);
}}
:root[data-theme="dark"]{
  --ground:#0B1011; --surface:#141A1B; --surface2:#1A2122; --line:#293233; --line2:#212929;
  --ink:#E3E9E8; --muted:#8A9897; --fraco:#6B7877;
  --accent:#3FC0CE; --accent-ink:#06191C; --accent-wash:#122E32;
  --ok:#77C34B; --ok-wash:#17280F;
  --warn:#DCA43C; --warn-wash:#2E2310;
  --crit:#E4776A; --crit-wash:#331714;
  --sombra:0 1px 2px rgba(0,0,0,.45), 0 10px 28px -20px rgba(0,0,0,.9);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0; background:var(--ground); color:var(--ink); font-family:var(--sans);
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column; overflow:hidden}
button{font:inherit; color:inherit}
.num{font-family:var(--mono); font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display); margin:0; letter-spacing:-.02em; text-wrap:balance}
h1{font-size:22px} h2{font-size:16px} h3{font-size:14px}

/* ── barra de cima ─────────────────────────────────────── */
.topo{background:var(--surface); border-bottom:1px solid var(--line);
  padding:10px 16px calc(10px); display:flex; gap:10px; align-items:center; flex:none;
  padding-top:calc(10px + env(safe-area-inset-top,0px))}
.logo{font-family:var(--display); font-weight:700; font-size:16px; display:flex;
  gap:7px; align-items:center}
.logo .pt{width:9px; height:9px; border-radius:50%; background:var(--accent); flex:none}
.logo small{font-weight:400; font-size:12px; color:var(--muted); font-family:var(--sans)}
.topo .dir{margin-left:auto; display:flex; gap:7px; align-items:center}
.pill{font-size:11px; font-weight:600; padding:3px 9px; border-radius:20px;
  background:var(--surface2); color:var(--muted); border:1px solid var(--line2);
  white-space:nowrap}
.pill.viva{background:var(--ok-wash); color:var(--ok); border-color:transparent}
.pill.morta{background:var(--crit-wash); color:var(--crit); border-color:transparent}
.pill.demo{background:var(--accent-wash); color:var(--accent); border-color:transparent}

/* ── corpo ─────────────────────────────────────────────── */
main{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch}
.col{max-width:620px; margin:0 auto; padding:16px; display:flex; flex-direction:column;
  gap:13px}
.tit{display:flex; align-items:baseline; gap:9px; flex-wrap:wrap}
.tit p{margin:0; font-size:13px; color:var(--muted)}
.sub{margin:0; font-size:13.5px; color:var(--muted)}

/* ── barra de baixo ────────────────────────────────────── */
.abaixo{flex:none; background:var(--surface); border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px)}
.nav{max-width:620px; margin:0 auto; display:flex}
.nav button{flex:1; border:none; background:none; padding:9px 4px 8px; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--muted);
  font-size:10.5px; font-weight:600; position:relative}
.nav button[aria-current="page"]{color:var(--accent)}
.nav .ic{font-size:18px; line-height:1}
.nav .bolha{position:absolute; top:5px; left:calc(50% + 7px); min-width:16px; height:16px;
  border-radius:9px; background:var(--crit); color:#fff; font-size:10px; font-weight:700;
  display:grid; place-items:center; padding:0 4px}
.accoes{max-width:620px; margin:0 auto; padding:10px 16px}
.accoes>*+*{margin-top:8px}

/* ── peças ─────────────────────────────────────────────── */
.cartao{background:var(--surface); border:1px solid var(--line); border-radius:12px;
  padding:14px}
.cartao.bom{background:var(--ok-wash); border-color:color-mix(in srgb,var(--ok) 30%,transparent)}
.cartao.aviso{background:var(--warn-wash); border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.cartao.mau{background:var(--crit-wash); border-color:color-mix(in srgb,var(--crit) 30%,transparent)}
.cartao.destaque{background:var(--accent-wash); border-color:color-mix(in srgb,var(--accent) 30%,transparent)}

.bt{display:block; width:100%; border:none; border-radius:11px; padding:15px;
  font-family:var(--display); font-weight:600; font-size:16px; cursor:pointer;
  text-align:center}
.bt:active{transform:scale(.995)}
.bt.pri{background:var(--accent); color:var(--accent-ink)}
.bt.sec{background:var(--surface2); color:var(--ink); border:1px solid var(--line)}
.bt.perigo{background:var(--crit); color:#fff}
.bt:disabled{opacity:.45; cursor:not-allowed}
.bt.pequeno{padding:11px; font-size:14px}
.par{display:flex; gap:8px} .par>*{flex:1}
.lig{background:none; border:none; color:var(--accent); font-weight:600; font-size:13.5px;
  cursor:pointer; padding:7px 0; text-decoration:underline; text-underline-offset:3px}

.campo{display:block}
.campo .lb{display:block; font-size:11.5px; font-weight:600; letter-spacing:.06em;
  text-transform:uppercase; color:var(--muted); margin-bottom:5px}
.campo .aj{display:block; font-size:12px; color:var(--muted); margin-top:5px}
input[type=text],input[type=number]{width:100%; padding:12px 13px; border-radius:10px;
  border:1px solid var(--line); background:var(--surface); color:var(--ink);
  font-family:var(--mono); font-size:17px; font-weight:500; -moz-appearance:textfield}
input[type=text]{font-family:var(--sans); font-size:15.5px}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input:focus-visible{outline:2px solid var(--accent); outline-offset:1px}

/* números grandes */
.tiles{display:grid; grid-template-columns:repeat(2,1fr); gap:1px; background:var(--line2);
  border:1px solid var(--line2); border-radius:12px; overflow:hidden}
.tiles>div{background:var(--surface); padding:13px}
.tiles b{display:block; font-family:var(--mono); font-size:23px; font-weight:500;
  letter-spacing:-.02em; line-height:1.15}
.tiles span{font-size:10.5px; color:var(--muted); text-transform:uppercase;
  letter-spacing:.06em; font-weight:600}
.tiles .mau b{color:var(--crit)} .tiles .bom b{color:var(--ok)}

/* linhas de lista */
.linha{display:flex; gap:11px; align-items:center; width:100%; text-align:left;
  background:var(--surface); border:1px solid var(--line); border-radius:11px;
  padding:12px 13px; cursor:pointer}
.linha:hover{border-color:var(--accent)}
.linha .p{font-weight:600; font-size:14px}
.linha .s{font-size:12.5px; color:var(--muted)}
.linha .d{margin-left:auto; text-align:right}
.selo{font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:6px; white-space:nowrap}
.selo.s{background:var(--ok-wash); color:var(--ok)}
.selo.n{background:var(--warn-wash); color:var(--warn)}
.selo.c{background:var(--crit-wash); color:var(--crit)}
.selo.i{background:var(--surface2); color:var(--muted)}

/* verificações */
.vf{display:flex; gap:11px; padding:11px 0; border-bottom:1px solid var(--line2);
  align-items:flex-start}
.vf:last-child{border-bottom:none}
.vf .mk{flex:none; width:21px; height:21px; border-radius:50%; display:grid;
  place-items:center; font-size:12px; font-weight:700; margin-top:1px}
.vf .mk.s{background:var(--ok-wash); color:var(--ok)}
.vf .mk.n{background:var(--crit-wash); color:var(--crit)}
.vf .mk.z{background:var(--surface2); color:var(--muted)}
.vf .tx{flex:1; min-width:0}
.vf .t1{font-size:13.5px; font-weight:600}
.vf .t2{font-size:12px; color:var(--muted); margin-top:1px}
.vf .vl{font-family:var(--mono); font-size:13px; white-space:nowrap; color:var(--muted)}

/* foto */
.foto{position:relative; display:block; border:2px dashed var(--line); border-radius:12px;
  padding:22px 14px; text-align:center; background:var(--surface2); cursor:pointer}
.foto.feita{border-style:solid; border-color:var(--ok); padding:0; overflow:hidden}
.foto img{width:100%; display:block; max-height:220px; object-fit:cover}
.foto input{position:absolute; inset:0; opacity:0; width:100%; height:100%; cursor:pointer}
.foto .ic{font-size:26px} .foto .t{font-weight:600; margin-top:7px; font-size:14.5px}
.foto .t2{font-size:12.5px; color:var(--muted); margin-top:2px}
.foto .re{position:absolute; right:8px; bottom:8px; background:rgba(0,0,0,.72); color:#fff;
  font-size:11.5px; font-weight:600; padding:5px 10px; border-radius:7px}

/* turno a decorrer */
.relogio{text-align:center; padding:6px 0 2px}
.relogio .t{font-family:var(--mono); font-size:42px; font-weight:500; line-height:1;
  letter-spacing:-.03em}
.relogio .l{font-size:12px; color:var(--muted); margin-top:5px}
.medidores{display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--line2);
  border:1px solid var(--line2); border-radius:10px; overflow:hidden; margin-top:12px}
.medidores>div{background:var(--surface); padding:9px 6px; text-align:center}
.medidores b{display:block; font-family:var(--mono); font-size:18px; font-weight:500}
.medidores span{font-size:10px; color:var(--muted); text-transform:uppercase;
  letter-spacing:.05em; font-weight:600}

.mapinha{width:100%; height:auto; display:block; border-radius:10px;
  background:var(--surface2); border:1px solid var(--line2)}
.fotos-g{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.fotos-g figure{margin:0}
.fotos-g img{width:100%; border-radius:9px; border:1px solid var(--line); display:block}
.fotos-g figcaption{font-size:11px; color:var(--muted); margin-top:4px; text-align:center}

.vazio{text-align:center; padding:22px 14px; color:var(--muted); font-size:13.5px}
.nota{font-size:12.5px; color:var(--muted); line-height:1.55}
.nota b{color:var(--ink)}
.passos{display:flex; gap:6px; margin-bottom:4px}
.passos span{flex:1; height:4px; border-radius:2px; background:var(--line)}
.passos span.on{background:var(--accent)}
.scroll{overflow-x:auto; border:1px solid var(--line); border-radius:11px;
  background:var(--surface)}
table{border-collapse:collapse; width:100%; min-width:460px; font-size:13.5px}
th{text-align:left; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase;
  color:var(--muted); font-weight:600; padding:9px 12px; background:var(--surface2);
  border-bottom:1px solid var(--line); white-space:nowrap}
td{padding:9px 12px; border-bottom:1px solid var(--line2)}
tbody tr:last-child td{border-bottom:none}
td.n{font-family:var(--mono); text-align:right; white-space:nowrap}
tr.total td{font-weight:700; background:var(--surface2)}
.barra{height:6px; border-radius:3px; background:var(--line2); overflow:hidden; margin-top:6px}
.barra span{display:block; height:100%; border-radius:3px}
/* ── o volante ─────────────────────────────────────────── */
.col.cheia{height:100%; padding-bottom:10px}
.volante{position:relative; border-radius:16px; overflow:hidden; border:1px solid var(--line);
  background:var(--surface2); box-shadow:var(--sombra); flex:1; min-height:300px;
  display:flex}
.mapa-vivo{position:absolute; inset:0; width:100%; height:100%; display:block;
  background:var(--surface2)}
.col:not(.cheia) .volante{flex:none; display:block}
.col:not(.cheia) .mapa-vivo{position:static; height:auto}
.hud{position:absolute; top:0; left:0; right:0; padding:14px 16px 0;
  display:flex; align-items:flex-start; justify-content:space-between;
  pointer-events:none}
.vel{display:flex; align-items:baseline; gap:6px;
  background:color-mix(in srgb, var(--surface) 82%, transparent);
  backdrop-filter:blur(8px); border:1px solid var(--line2); border-radius:12px;
  padding:7px 13px 6px}
.vel .n{font-family:var(--mono); font-size:44px; font-weight:600; line-height:1;
  letter-spacing:-.045em; font-variant-numeric:tabular-nums}
.vel .u{font-size:11.5px; font-weight:600; color:var(--muted); letter-spacing:.06em;
  text-transform:uppercase}
.arco{width:86px; height:48px; opacity:.95}
.hud-baixo{position:absolute; left:0; right:0; bottom:0; display:grid;
  grid-template-columns:repeat(3,1fr);
  background:color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter:blur(8px); border-top:1px solid var(--line2)}
.hud-baixo>div{padding:9px 6px; text-align:center}
.hud-baixo>div+div{border-left:1px solid var(--line2)}
.hud-baixo b{display:block; font-family:var(--mono); font-size:19px; font-weight:500;
  letter-spacing:-.02em}
.gravando{display:inline-block; width:7px; height:7px; border-radius:50%;
  background:var(--crit); margin-right:6px; vertical-align:middle;
  animation:pulsar 2s ease-in-out infinite}
@keyframes pulsar{0%,100%{opacity:1} 50%{opacity:.25}}
.hud-baixo span{font-size:10px; color:var(--muted); text-transform:uppercase;
  letter-spacing:.06em; font-weight:600}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="topo">
  <div class="logo"><span class="pt"></span>FleetCV<small id="logo-sub"></small></div>
  <div class="dir" id="topo-dir"></div>
</div>
<main><div class="col" id="ecra"></div></main>
<div class="abaixo"><div class="accoes" id="accoes"></div><div class="nav" id="nav"></div></div>
<script>
(function(){
"use strict";

/* ════════════════════════════════════════════════════════════
   FleetCV — controlo de frota para Cabo Verde
   Um só endereço, dois papéis: condutor e dono.
   Os limites são os mesmos do motor SQL (SPEC §15) e da app Android.
   ════════════════════════════════════════════════════════════ */

var LIM = {
  gapKm:3,             // o carro andou sem turno aberto
  kmMax:500,           // km plausíveis num turno
  divAviso:15,         // divergência entre conta-quilómetros e GPS
  divCritica:25,
  semSinalS:900,       // 15 minutos sem sinal
  precisaoMax:50,      // pontos de GPS maus
  velMax:180,          // saltos impossíveis
  divLitrosPct:3,      // talão contra valor escrito
  raioPostoM:150,
  paragemMinS:120
};
var PENAL = { A04:50, A06:40, A19:30, A15:30, A16:30, A14:30, A13:25, A12:25,
              A08:15, A09:15, A11:10, A20:10, A21:5 };
var DIAS_UTEIS_MES = 22;

var S = {
  pronto:false, papel:'dono', ecra:'hoje', passo:0,
  frota:null, turnos:[], turno:null, eu:{nome:'', carroId:null},
  db:null, podeEscrever:true,
  gps:{estado:'desligado', precisao:null, velocidade:0}, bateria:null,
  sessao:null,
  fotos:{}, rasc:{}, detalhe:null, fotosDetalhe:null, aviso:null,
  demo:{ligado:false, aCorrer:false, passo:0, turnoFalso:false}
};
var vigia=null, relogio=null, cronoDemo=null;

/* ─── números e datas ─────────────────────────────────────── */
function nf(v,d){ d=d||0;
  var p=Math.abs(Number(v)||0).toFixed(d).split('.');
  p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.');
  return (Number(v)<0?'−':'')+p.join(','); }
function hms(s){ s=Math.max(0,Math.floor(s));
  return String(Math.floor(s/3600)).padStart(2,'0')+':'+
         String(Math.floor(s%3600/60)).padStart(2,'0')+':'+
         String(s%60).padStart(2,'0'); }
function hh(ms){ var d=new Date(ms);
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function dia(ms){ var d=new Date(ms),
  ds=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'],
  ms2=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  return ds[d.getDay()]+' '+d.getDate()+' '+ms2[d.getMonth()]; }
function eHoje(ms){ var a=new Date(ms), b=new Date();
  return a.toDateString()===b.toDateString(); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,
  function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function uid(p){ return (p||'t')+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

/* ─── geografia ───────────────────────────────────────────── */
function dist(a,b,c,d){ var R=6371000,g=Math.PI/180;
  return 2*R*Math.asin(Math.sqrt(Math.pow(Math.sin((c-a)*g/2),2)+
    Math.cos(a*g)*Math.cos(c*g)*Math.pow(Math.sin((d-b)*g/2),2))); }
function kmDoRasto(pts){ var m=0, ant=null;
  for(var i=0;i<(pts||[]).length;i++){ var p=pts[i];
    if(p[3]!=null&&p[3]>LIM.precisaoMax) continue;
    if(ant){ var s=(p[2]-ant[2])/1000, d=dist(ant[0],ant[1],p[0],p[1]);
      if(s>0&&(d/s)*3.6<=LIM.velMax) m+=d; }
    ant=p; }
  return m/1000; }
function maiorFalha(pts){ var mx=0;
  for(var i=1;i<(pts||[]).length;i++){
    if((pts[i-1][5]==null?100:pts[i-1][5])<=5) continue;
    mx=Math.max(mx,(pts[i][2]-pts[i-1][2])/1000); }
  return mx; }
function semSinal(pts){ var t=0;
  for(var i=1;i<(pts||[]).length;i++){
    if((pts[i-1][5]==null?100:pts[i-1][5])<=5) continue;
    var g=(pts[i][2]-pts[i-1][2])/1000; if(g>300) t+=g; }
  return t; }

/* ─── frota ───────────────────────────────────────────────── */
function frotaNova(){ return { nome:'', ilha:'Santiago', precoLitro:145, carros:[],
  condutores:[], criadaEm:Date.now() }; }
function carroDe(id){
  var c=(S.frota.carros||[]).filter(function(x){ return x.id===id; });
  return c[0]||S.frota.carros[0]||null; }

/* ─── guardar ─────────────────────────────────────────────── */
function guardarLocal(){ try{ localStorage.setItem('fleetcv3', JSON.stringify(
  {frota:S.frota, eu:S.eu, papel:S.papel, turno:S.turno, sessao:S.sessao,
   turnos:S.turnos.slice(0,40), demo:{ligado:S.demo.ligado}})); }catch(e){} }
function lerLocal(){ try{ var r=localStorage.getItem('fleetcv3');
  return r?JSON.parse(r):null; }catch(e){ return null; } }
function leve(t){ var c={}; for(var k in t) if(k!=='fotos') c[k]=t[k];
  if(c.rasto&&c.rasto.length>800){ var r=[],p=Math.ceil(c.rasto.length/800);
    for(var i=0;i<c.rasto.length;i+=p) r.push(c.rasto[i]);
    r.push(c.rasto[c.rasto.length-1]); c.rasto=r; }
  return c; }
var aEscrever=false, pendente=null;
function guardarTurno(t, comFotos){
  guardarLocal();
  if(!S.db||!S.podeEscrever) return Promise.resolve();
  if(aEscrever){ pendente=t; return Promise.resolve(); }
  aEscrever=true;
  return S.db.doc('turnos/'+t.id).set(leve(t)).then(function(){
    if(!comFotos||!t.fotos) return;
    var ps=[]; for(var k in t.fotos) if(t.fotos[k])
      ps.push(S.db.doc('turnos/'+t.id+'/fotos/'+k).set({img:t.fotos[k]}).catch(function(){}));
    return Promise.all(ps);
  }).catch(function(e){ if(e&&e.code==='invalid_argument') S.podeEscrever=false; })
    .then(function(){ aEscrever=false;
      if(pendente){ var p=pendente; pendente=null; return guardarTurno(p,false); } }); }
function guardarFrota(){ guardarLocal();
  if(S.db&&S.podeEscrever) S.db.doc('config/frota').set(S.frota).catch(function(){}); }

/* ─── fotografia ──────────────────────────────────────────── */
function lerFoto(f,cb){ var fr=new FileReader();
  fr.onload=function(){ var im=new Image();
    im.onload=function(){ var k=Math.min(1,520/Math.max(im.width,im.height));
      var cv=document.createElement('canvas');
      cv.width=Math.round(im.width*k); cv.height=Math.round(im.height*k);
      cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
      try{ cb(cv.toDataURL('image/jpeg',0.6)); }catch(e){ cb(fr.result); } };
    im.onerror=function(){ cb(fr.result); }; im.src=fr.result; };
  fr.readAsDataURL(f); }

/* ─── GPS ─────────────────────────────────────────────────── */
function ligarGps(){
  // Só um turno explicitamente simulado dispensa o GPS. Ter dados de exemplo
  // gravados não é razão para não ligar a localização de um turno a sério.
  if(S.demo.turnoFalso) return;
  if(!navigator.geolocation){ S.gps.estado='indisponivel'; return; }
  if(vigia!=null) return;
  S.gps.estado='a-procurar'; pintarTopo();
  vigia=navigator.geolocation.watchPosition(function(pos){
    S.gps.estado='ligado'; S.gps.precisao=Math.round(pos.coords.accuracy);
    // Alguns telemóveis não dão velocidade: calcula-se a partir dos dois
    // últimos pontos, e suaviza-se para o número não saltar no ecrã.
    var kmh = pos.coords.speed!=null && pos.coords.speed>=0
      ? pos.coords.speed*3.6 : velocidadeCalculada(pos);
    S.gps.velocidade = S.gps.velocidade*0.55 + kmh*0.45;
    if(S.turno&&S.turno.estado==='ABERTO'){ var c=pos.coords;
      S.turno.rasto.push([+c.latitude.toFixed(6), +c.longitude.toFixed(6), pos.timestamp,
        Math.round(c.accuracy), c.speed==null?null:Math.round(c.speed*3.6), S.bateria]);
      if(S.turno.rasto.length%20===0) guardarTurno(S.turno,false); }
    if(S.ecra==='gps') pintar(); else pintarTopo();
  }, function(err){ S.gps.estado=err.code===1?'recusado':'sem-sinal'; pintarTopo(); },
     {enableHighAccuracy:true, maximumAge:4000, timeout:25000}); }
var ultimaPos=null;
function velocidadeCalculada(pos){
  var agora={lat:pos.coords.latitude, lon:pos.coords.longitude, t:pos.timestamp};
  var v=0;
  if(ultimaPos){
    var s=(agora.t-ultimaPos.t)/1000;
    if(s>0.5){ var d=dist(ultimaPos.lat,ultimaPos.lon,agora.lat,agora.lon);
      v=Math.min((d/s)*3.6, LIM.velMax); }
  }
  ultimaPos=agora; return v;
}
function desligarGps(){ if(vigia!=null){ navigator.geolocation.clearWatch(vigia); vigia=null; }
  S.gps.estado='desligado'; S.gps.velocidade=0; ultimaPos=null; }
function lerBateria(){ if(!navigator.getBattery) return;
  navigator.getBattery().then(function(b){ S.bateria=Math.round(b.level*100);
    b.addEventListener('levelchange',function(){ S.bateria=Math.round(b.level*100);
      pintarTopo(); });
    pintarTopo(); }).catch(function(){}); }

/* ════════════════════════════════════════════════════════════
   AS REGRAS — as mesmas contas do motor SQL
   ════════════════════════════════════════════════════════════ */
function avaliar(t){
  var v=[], al=[];
  var kmQ=(t.kmFinal||0)-t.kmInicial;
  var kmG=t.kmGps!=null?t.kmGps:kmDoRasto(t.rasto);
  var temRasto=(t.rasto||[]).length>5;
  var fotosOk=!!(t.fotoKeys&&t.fotoKeys.indexOf('abertura')>=0&&
                 t.fotoKeys.indexOf('fecho')>=0);

  v.push({ok:fotosOk, t1:'Fotografou o conta-quilómetros nas duas pontas',
    t2:nf(t.kmInicial)+' → '+nf(t.kmFinal), vl:nf(kmQ)+' km'});
  if(!fotosOk) al.push({c:'A11', n:'AVISO', d:'Turno sem foto do conta-quilómetros'});

  if((t.pontosFalsos||0)>0){
    v.push({ok:false, mk:'n', t1:'A localização é verdadeira',
      t2:'o telemóvel denunciou uma aplicação de GPS falso', vl:'falsa'});
    al.push({c:'A04', n:'CRITICO', d:'Localização falsa detectada'});
  }

  if(t.gap>LIM.gapKm){
    v.push({ok:false, mk:'n', t1:'O carro não andou fora do turno',
      t2:'o conta-quilómetros de hoje está à frente de onde ficou ontem',
      vl:'+'+nf(t.gap)+' km'});
    al.push({c:'A19', n:'CRITICO',
      d:'O carro andou '+nf(t.gap)+' km sem turno aberto',
      dif:Math.round(t.gap*(t.consumoRef||7.5)/100*t.precoLitro)});
  } else {
    v.push({ok:true, t1:'O carro não andou fora do turno',
      t2:'o conta-quilómetros continua onde ficou', vl:'bate'});
  }

  if(temRasto){
    var div=kmQ>0?(kmQ-kmG)/kmQ*100:0;
    var gpsFrente=kmG>kmQ*1.10;
    var critico=gpsFrente||div>=LIM.divCritica;
    var aviso=!critico&&Math.abs(div)>=LIM.divAviso;
    v.push({ok:!critico&&!aviso, mk:critico?'n':(aviso?'n':'s'),
      t1:'Os km do GPS batem com o conta-quilómetros',
      t2:(critico||aviso)
        ? nf(kmQ-kmG)+' km andados sem se saber para onde'
        : 'diferença de '+nf(div,1)+'% — normal, o GPS perde sinal às vezes',
      vl:nf(kmG,1)+' km'});
    if(critico) al.push({c:gpsFrente?'A09':'A08', n:'CRITICO',
      d:'Conta-quilómetros e GPS não batem ('+nf(div,1)+'%)',
      dif:gpsFrente?0:Math.round((kmQ-kmG)*(t.consumoRef||7.5)/100*t.precoLitro)});
    else if(aviso) al.push({c:'A07', n:'AVISO',
      d:'Diferença de km de '+nf(div,1)+'%'});

    var falha=maiorFalha(t.rasto);
    v.push({ok:falha<=LIM.semSinalS, t1:'O sinal de GPS não teve buracos',
      t2:falha>LIM.semSinalS
        ? 'e a bateria chegou ao fim do turno, por isso não foi o telemóvel a morrer'
        : 'gravou o turno inteiro',
      vl:nf(falha/60)+' min'});
    if(falha>LIM.semSinalS) al.push({c:'A03', n:'AVISO',
      d:'Sem sinal de GPS durante '+nf(falha/60)+' minutos'});
  } else {
    v.push({ok:false, t1:'Percurso gravado', t2:'o GPS não esteve ligado', vl:'—'});
    al.push({c:'A03', n:'AVISO', d:'Turno sem percurso gravado'});
  }

  (t.abastecimentos||[]).forEach(function(a){
    v.push({ok:!!a.temFoto, t1:'Fotografou o talão',
      t2:'abastecimento das '+hh(a.hora), vl:nf(a.valor)+' CVE'});
    if(!a.temFoto) al.push({c:'A11', n:'AVISO', d:'Abastecimento sem talão'});

    var litros=a.valor/t.precoLitro, cabe=litros<=t.deposito*1.05;
    v.push({ok:cabe, mk:cabe?'s':'n', t1:'Os litros cabem no depósito',
      t2:nf(litros,2)+' litros num depósito de '+nf(t.deposito),
      vl:nf(litros,2)+' l'});
    if(!cabe) al.push({c:'A13', n:'CRITICO',
      d:'Declarou '+nf(litros,2)+' litros num depósito de '+nf(t.deposito)});

    if(a.litrosTalao){
      var d2=Math.abs(a.litrosTalao-litros)/litros*100, bate=d2<=LIM.divLitrosPct;
      var noTalao=Math.round(a.litrosTalao*t.precoLitro);
      v.push({ok:bate, mk:bate?'s':'n', t1:'O que escreveu bate com o talão',
        t2:bate ? 'escreveu '+nf(a.valor)+' CVE, e o talão diz o mesmo'
                : 'escreveu '+nf(a.valor)+' CVE · o talão dá '+nf(noTalao)+' CVE',
        vl:bate?'bate':nf(a.valor-noTalao)+' CVE'});
      if(!bate) al.push({c:'A12', n:'AVISO',
        d:'Escreveu '+nf(a.valor)+' CVE mas o talão dá '+nf(noTalao)+' CVE',
        dif:a.valor-noTalao});
    }

    if(temRasto&&a.lat!=null){
      var parado=0, ant=null;
      t.rasto.forEach(function(p){
        if(dist(p[0],p[1],a.lat,a.lon)<=LIM.raioPostoM){
          if(ant!=null) parado+=(p[2]-ant)/1000; ant=p[2];
        } else ant=null; });
      var okP=parado>=LIM.paragemMinS;
      v.push({ok:okP, mk:okP?'s':'n', t1:'O carro esteve mesmo parado no posto',
        t2:'o percurso mostra '+nf(parado/60,1)+' min parado no sítio do talão',
        vl:okP?'confirmado':'não'});
      if(!okP) al.push({c:'A14', n:'CRITICO',
        d:'O percurso não mostra o carro parado no posto'});
    }
  });

  return {verificacoes:v, alertas:al, kmQuadrante:kmQ, kmGps:kmG};
}
function alertasDe(t){ return (t.alertas&&t.alertas.length!==undefined)
  ? t.alertas : avaliar(t).alertas; }
function porResolver(t){ var r=t.resolucoes||{};
  return alertasDe(t).filter(function(a){ return !r[a.c]; }); }
function dinheiroDe(t){ var r=t.resolucoes||{};
  return alertasDe(t).reduce(function(s,a){
    if(r[a.c]&&r[a.c].r==='ERRO_SISTEMA') return s;
    return s+(a.dif||0); },0); }
function score(nome){
  var lim=Date.now()-30*864e5, pen=0, limpos=0, n=0;
  S.turnos.forEach(function(t){
    if(t.condutor!==nome||t.estado!=='FECHADO'||t.inicio<lim) return;
    n++;
    var r=t.resolucoes||{}, maus=0;
    alertasDe(t).forEach(function(a){
      if(r[a.c]&&r[a.c].r==='ERRO_SISTEMA') return;
      pen+=PENAL[a.c]||0; maus++; });
    pen+=Math.min(Math.floor((t.semSinalS||0)/600),20);
    if(!maus) limpos++; });
  return {valor:Math.max(0,Math.min(100,100-pen+limpos*3)), turnos:n, limpos:limpos};
}

/* ════════════════════════════════════════════════════════════
   MODO DEMONSTRAÇÃO
   Para testar tudo sem carro, sem telemóvel, sem esperar duas
   semanas. Os turnos são inventados; as contas que os avaliam
   são exactamente as mesmas dos turnos verdadeiros.
   ════════════════════════════════════════════════════════════ */

var PRAIA = [14.9177, -23.5092];

// Um táxi a andar numa malha de ruas: troços rectos e viragens.
function percurso(semente, nPontos, inicioMs, intervaloS, opcoes){
  opcoes = opcoes || {};
  var r = semente, rnd = function(){ r=(r*1103515245+12345)%2147483648; return r/2147483648; };
  var pts=[], lat=PRAIA[0], lon=PRAIA[1], rumo=Math.floor(rnd()*4)*90, t=0;
  for(var i=0;i<nPontos;i++){
    if(i%9===0) rumo += (rnd()<0.5?-90:90);
    var rad=rumo*Math.PI/180, v=22+rnd()*26;           // 22 a 48 km/h
    var d=v/3.6*intervaloS;
    lat += Math.cos(rad)*d/111320 + (rnd()-0.5)*0.00008;
    lon += Math.sin(rad)*d/(111320*Math.cos(lat*Math.PI/180)) + (rnd()-0.5)*0.00008;
    if(Math.abs(lat-PRAIA[0])>0.035) rumo=(rumo+180)%360;
    if(Math.abs(lon-PRAIA[1])>0.035) rumo=(rumo+180)%360;
    t += intervaloS;
    var bat = Math.round(100 - 45*i/nPontos);
    pts.push([+lat.toFixed(6), +lon.toFixed(6), inicioMs+t*1000, 8+Math.round(rnd()*8),
              Math.round(v), bat]);
  }
  // paragem no posto, a meio
  var meio=Math.floor(nPontos*0.5), posto=pts[meio];
  var extra=[];
  for(var k=1;k<=7;k++)
    extra.push([posto[0], posto[1], posto[2]+k*60000, 7, 0, posto[5]]);
  pts = pts.slice(0,meio+1).concat(extra,
        pts.slice(meio+1).map(function(p){ return [p[0],p[1],p[2]+7*60000,p[3],p[4],p[5]]; }));

  // buraco: o motorista desligou o GPS
  if(opcoes.buracoMin){
    var a=Math.floor(pts.length*0.62), b=Math.floor(pts.length*0.80);
    var salto=opcoes.buracoMin*60000;
    pts = pts.slice(0,a).concat(pts.slice(b).map(function(p){
      return [p[0],p[1],p[2]+salto,p[3],p[4],p[5]]; }));
  }
  return {pontos:pts, postoLat:posto[0], postoLon:posto[1], postoMs:posto[2]+120000};
}

// Os cinco casos que o sistema tem de saber distinguir.
var CASOS = [
  {id:'limpo',  nome:'Dia normal',            peso:10},
  {id:'talao',  nome:'Inflacionou o talão',   peso:0},
  {id:'noite',  nome:'Usou o carro à noite',  peso:0},
  {id:'gps',    nome:'Desligou o GPS',        peso:0},
  {id:'bidao',  nome:'Encheu um bidão',       peso:0}
];

function turnoInventado(caso, carro, condutor, quando, semente){
  var intervalo=30, n=300 + (semente % 7)*22;   // turnos de durações diferentes
  var p = percurso(semente, n, quando, intervalo,
                   {buracoMin: caso==='gps' ? 52 : 0});
  var kmG = kmDoRasto(p.pontos);
  var kmQ = Math.round(kmG*1.035);                    // o GPS fica sempre um pouco abaixo
  if(caso==='gps') kmQ = Math.round(kmG+40);          // andou sem sinal
  var gap = caso==='noite' ? 37 : 0;
  var litros = Math.max(10, kmQ*(carro.consumoRef||7.5)/100*1.25);
  var valor = Math.round(litros*S.frota.precoLitro/50)*50;
  var litrosTalao = valor/S.frota.precoLitro;
  if(caso==='talao') litrosTalao = +(litrosTalao*0.62).toFixed(2);
  if(caso==='bidao'){ valor = Math.round(40*S.frota.precoLitro);
                      litrosTalao = 40; }

  var t = {
    id:uid('d'), estado:'FECHADO', demo:true,
    inicio:quando, fim:p.pontos[p.pontos.length-1][2],
    carroId:carro.id, matricula:carro.matricula, condutor:condutor,
    kmInicial:carro.kmActual+gap, kmFinal:carro.kmActual+gap+kmQ, gap:gap,
    precoLitro:S.frota.precoLitro, deposito:carro.deposito,
    consumoRef:carro.consumoRef||7.5,
    rasto:p.pontos, kmGps:+kmG.toFixed(1),
    semSinalS:Math.round(semSinal(p.pontos)),
    bateriaFim:p.pontos[p.pontos.length-1][5],
    abastecimentos:[{hora:p.postoMs, valor:valor, litrosTalao:+litrosTalao.toFixed(2),
                     temFoto:true, lat:p.postoLat, lon:p.postoLon}],
    totalCve:valor, totalLitros:valor/S.frota.precoLitro,
    fotoKeys:['abertura','talao1','fecho'], pontosFalsos:0,
    caso:caso
  };
  t.alertas = avaliar(t).alertas;
  carro.kmActual = t.kmFinal;
  return t;
}

/// Gera duas semanas de operação com os cinco casos lá dentro.
function gerarDemonstracao(){
  if(!S.frota.carros.length) return;
  if(!S.frota.condutores.length)
    S.frota.condutores = [
      {id:uid('m'), nome:'António Semedo', email:'antonio@exemplo.cv', codigo:'1234'},
      {id:uid('m'), nome:'Jorge Tavares',  email:'jorge@exemplo.cv',   codigo:'2345'},
      {id:uid('m'), nome:'Nuno Rocha',     email:'nuno@exemplo.cv',    codigo:'3456'}];
  var condutores = S.frota.condutores.map(function(c){ return c.nome; });
  var casos = ['limpo','limpo','limpo','talao','limpo','limpo','noite','limpo',
               'gps','limpo','limpo','bidao','limpo','limpo','limpo'];
  var novos = [], semente = 7;
  var nCarros = S.frota.carros.length;
  var nDias = Math.ceil(casos.length / nCarros);
  var base = new Date(); base.setHours(0,0,0,0);
  for(var i=0;i<casos.length;i++){
    var carro = S.frota.carros[i % nCarros];
    var condutor = condutores[i % condutores.length];
    var d = Math.floor(i / nCarros);
    // termina ontem e recua; cada carro sai a uma hora diferente, como na vida real
    var quando = base.getTime() - (nDias-d)*864e5 + (6*60 + (i%nCarros)*35)*60000;
    novos.push(turnoInventado(casos[i], carro, condutor, quando, semente+=13));
  }
  S.turnos = novos.concat(S.turnos.filter(function(t){ return !t.demo; }))
    .sort(function(a,b){ return b.inicio-a.inicio; });
  S.demo.ligado = true;
  guardarFrota(); guardarLocal();
  if(S.db&&S.podeEscrever) novos.forEach(function(t){
    S.db.doc('turnos/'+t.id).set(leve(t)).catch(function(){}); });
}

function limparDemonstracao(){
  var fora = S.turnos.filter(function(t){ return t.demo; });
  S.turnos = S.turnos.filter(function(t){ return !t.demo; });
  S.demo.ligado = false;
  if(S.db&&S.podeEscrever) fora.forEach(function(t){
    S.db.doc('turnos/'+t.id).delete().catch(function(){}); });
  guardarLocal();
}

/* ─── turno de demonstração ao vivo ───────────────────────── */
function arrancarTurnoDemo(){
  var carro = carroDe(S.eu.carroId);

/* ════════════════════════════════════════════════════════════
   PEÇAS DO ECRÃ
   ════════════════════════════════════════════════════════════ */
function el(id){ return document.getElementById(id); }

function mapinha(rasto, altura){
  var pts=(rasto||[]).filter(function(p){ return p[3]==null||p[3]<=LIM.precisaoMax; });
  if(pts.length<3) return '';
  var la=pts.map(function(p){return p[0];}), lo=pts.map(function(p){return p[1];});
  var mnA=Math.min.apply(null,la), mxA=Math.max.apply(null,la);
  var mnO=Math.min.apply(null,lo), mxO=Math.max.apply(null,lo);
  var W=480, H=altura||240, pad=18, kx=Math.cos(mnA*Math.PI/180);
  var sO=(mxO-mnO)*kx||1e-9, sA=(mxA-mnA)||1e-9;
  var s=Math.min((W-2*pad)/sO,(H-2*pad)/sA), ox=(W-sO*s)/2, oy=(H-sA*s)/2;
  var X=function(x){ return ox+(x-mnO)*kx*s; }, Y=function(y){ return H-(oy+(y-mnA)*s); };
  // parte o traço onde houve um salto grande de tempo: é ali o buraco do sinal
  var partes=[], act=[];
  for(var i=0;i<pts.length;i++){
    if(i&&(pts[i][2]-pts[i-1][2])>300000){ if(act.length>1) partes.push(act); act=[]; }
    act.push((act.length?'L':'M')+X(pts[i][1]).toFixed(1)+' '+Y(pts[i][0]).toFixed(1));
  }
  if(act.length>1) partes.push(act);
  var svg='<svg class="mapinha" viewBox="0 0 '+W+' '+H+'" role="img" '+
    'aria-label="Percurso do turno">'+
    '<defs><pattern id="g'+H+'" width="32" height="32" patternUnits="userSpaceOnUse">'+
    '<path d="M32 0H0V32" fill="none" stroke="var(--line2)" stroke-width="1"/></pattern></defs>'+
    '<rect width="'+W+'" height="'+H+'" fill="url(#g'+H+')"/>';
  partes.forEach(function(p){ svg+='<path d="'+p.join(' ')+'" fill="none" '+
    'stroke="var(--accent)" stroke-width="2.3" stroke-linejoin="round" '+
    'stroke-linecap="round"/>'; });
  if(partes.length>1) svg+='<text x="'+(W/2)+'" y="16" fill="var(--crit)" font-size="11" '+
    'font-weight="700" text-anchor="middle" font-family="IBM Plex Sans,sans-serif">'+
    'o traço está cortado onde o sinal falhou</text>';
  svg+='<circle cx="'+X(pts[0][1]).toFixed(1)+'" cy="'+Y(pts[0][0]).toFixed(1)+
    '" r="4.5" fill="var(--ok)"/>'+
    '<circle cx="'+X(pts[pts.length-1][1]).toFixed(1)+'" cy="'+
    Y(pts[pts.length-1][0]).toFixed(1)+'" r="4.5" fill="var(--ink)"/></svg>';
  return svg;
}

function verifs(vs){
  return '<div class="cartao">'+vs.map(function(v){
    var mk=v.mk||(v.ok?'s':'n');
    return '<div class="vf"><span class="mk '+mk+'">'+
      (mk==='z'?'~':(mk==='s'?'✓':'!'))+'</span>'+
      '<span class="tx"><span class="t1">'+esc(v.t1)+'</span><br>'+
      '<span class="t2">'+esc(v.t2)+'</span></span>'+
      '<span class="vl">'+esc(v.vl)+'</span></div>'; }).join('')+'</div>';
}

function caixaFoto(chave, titulo, dica){
  var f=S.fotos[chave];
  return f
    ? '<label class="foto feita"><img src="'+f+'" alt="'+esc(titulo)+'">'+
      '<span class="re">Repetir</span>'+
      '<input type="file" accept="image/*" capture="environment" data-foto="'+chave+'"></label>'

function linhaTurno(t){
  var pr=porResolver(t);
  var cls=pr.some(function(x){return x.n==='CRITICO';})?'c':(pr.length?'n':'s');
  var rot=cls==='s'?'tudo bem':(cls==='n'?pr.length+' a ver':'a investigar');
  return '<button class="linha" data-turno="'+t.id+'">'+
    '<span><span class="p">'+nf((t.kmFinal||0)-t.kmInicial)+' km · '+esc(t.matricula)+
    (t.demo?' <span class="selo i">exemplo</span>':'')+'</span><br>'+
    '<span class="s">'+esc(t.condutor||'—')+' · '+dia(t.inicio)+' · '+
    hh(t.inicio)+'–'+hh(t.fim)+' · '+nf(t.totalCve)+' CVE</span></span>'+
    '<span class="d"><span class="selo '+cls+'">'+rot+'</span></span></button>';
}

/* ════════════════════════════════════════════════════════════
   POSTOS DE COMBUSTÍVEL DA PRAIA
   Coordenadas aproximadas. O GPS escolhe o mais perto; se estiver
   errado, o condutor corrige numa lista. Editável nas definições.
   ════════════════════════════════════════════════════════════ */
var POSTOS = [
  {id:'p1', nome:'Enacol Plateau',            lat:14.91950, lon:-23.50870},
  {id:'p2', nome:'Vivo Sucupira',             lat:14.92000, lon:-23.50600},
  {id:'p3', nome:'Enacol Fazenda',            lat:14.92100, lon:-23.51300},
  {id:'p4', nome:'Enacol Achada St. António', lat:14.92600, lon:-23.51700},
  {id:'p5', nome:'Vivo Palmarejo',            lat:14.91500, lon:-23.52400},
  {id:'p6', nome:'Enacol Terra Branca',       lat:14.92800, lon:-23.52300},
  {id:'p7', nome:'Vivo Tira Chapéu',          lat:14.93300, lon:-23.52900},
  {id:'p8', nome:'Enacol Achadinha',          lat:14.93100, lon:-23.51100},
  {id:'p9', nome:'Vivo Palmarejo Grande',     lat:14.91100, lon:-23.52900},
  {id:'p10',nome:'Enacol Aeroporto',          lat:14.94300, lon:-23.48700}
];
function postosPerto(lat, lon, quantos){
  if(lat==null) return [];
  return POSTOS.map(function(p){
    return {p:p, m:Math.round(dist(lat,lon,p.lat,p.lon))}; })
    .sort(function(a,b){ return a.m-b.m; })
    .slice(0, quantos||4);
}

/* ════════════════════════════════════════════════════════════
   ECRÃ 2 · O CONDUTOR
   Sete passos, um de cada vez, sem nada a mais no ecrã.
   ════════════════════════════════════════════════════════════ */
function condutorActual(){
  if(!S.sessao) return null;
  var c=S.frota.condutores.filter(function(x){ return x.id===S.sessao; });
  return c[0]||null;
}

function ecraCondutor(){
  var h='', b='';

  /* ── entrar ──────────────────────────────────────────── */
  if(S.ecra==='entrar'){
    h='<div style="height:14px"></div>'+
      '<div class="tit"><h1>Entrar</h1></div>'+
      '<p class="sub">O email e o código de quatro números que o patrão lhe deu.</p>'+
      '<label class="campo"><span class="lb">Email</span>'+
      '<input type="text" id="e-email" value="'+esc(S.rasc.email||'')+
      '" placeholder="o.seu@email.cv" autocomplete="username"></label>'+
      '<label class="campo"><span class="lb">Código</span>'+
      '<input type="number" inputmode="numeric" id="e-codigo" value="'+
      esc(S.rasc.codigo||'')+'" placeholder="0000"></label>';
    if(S.aviso) h+='<div class="cartao mau"><p class="nota">'+esc(S.aviso)+'</p></div>';
    var quantos=S.frota.condutores.length;
    if(quantos) h+='<p class="nota">Se não souber o seu código, peça ao patrão: '+
      'ele vê-o no separador <b>Equipa</b>.</p>';
    b='<button class="bt pri" data-fazer="entrar">Entrar</button>'+
      '<button class="lig" data-fazer="papel-dono">Sou o patrão</button>';
  }

  /* ── escolher o carro ────────────────────────────────── */
  else if(S.ecra==='carro'){
    h='<div class="tit"><h1>Que carro vai levar?</h1></div>'+
      '<p class="sub">Olá, '+esc((condutorActual()||{}).nome||'')+'.</p>';
    h+=S.frota.carros.map(function(c){
      return '<button class="linha" data-carro="'+c.id+'">'+
        '<span><span class="p" style="font-family:var(--mono);font-size:16px">'+
        esc(c.matricula)+'</span><br><span class="s">'+
        esc((c.marca||'')+' '+(c.modelo||''))+' · depósito de '+nf(c.deposito)+' l</span></span>'+
        '<span class="d"><span class="num" style="font-size:14px">'+nf(c.kmActual)+
        '</span><br><span class="s" style="font-size:11px">km</span></span></button>';
      }).join('');
    b='<button class="lig" data-fazer="sair">Sair</button>';
  }

  /* ── quilometragem de abertura ───────────────────────── */
  else if(S.ecra==='km-inicio'){
    var carro=carroDe(S.eu.carroId);
    var km=S.rasc.km==null?carro.kmActual:S.rasc.km;
    var gap=km-carro.kmActual;
    h='<div class="tit"><h1>Quantos km marca?</h1></div>'+
      '<p class="sub">'+esc(carro.matricula)+' · fotografe o conta-quilómetros, '+
      'ou escreva o número. Um dos dois chega.</p>'+
      caixaFoto('abertura','Fotografar o conta-quilómetros','abre a câmara do telemóvel')+
      '<label class="campo"><span class="lb">Ou escreva aqui</span>'+
      '<input type="number" inputmode="numeric" id="km" value="'+km+'">'+
      '<span class="aj">Da última vez este carro ficou em '+nf(carro.kmActual)+' km.</span>'+
      '</label>';
    if(gap>LIM.gapKm)
      h+='<div class="cartao mau"><h3>São '+nf(gap)+' km a mais</h3>'+
        '<p class="nota" style="margin-top:5px">O carro andou desde que o turno anterior '+
        'fechou. Fica registado. Se foi à oficina, diga ao patrão.</p></div>';
    if(gap<0)
      h+='<div class="cartao mau"><h3>Parece a menos</h3><p class="nota" '+
        'style="margin-top:5px">O conta-quilómetros não anda para trás. Confirme o número.</p></div>';
    b='<button class="bt pri" data-fazer="ir-gps"'+(gap<0?' disabled':'')+'>Continuar</button>'+
      '<button class="lig" data-fazer="ir-carro">Trocar de carro</button>';
  }

  /* ── autorizar o GPS ─────────────────────────────────── */
  else if(S.ecra==='gps'){
    var e=S.gps.estado;
    h='<div class="tit"><h1>Ligar o GPS</h1></div>'+
      '<p class="sub">É o GPS que grava o caminho que o carro faz. Sem ele o turno '+
      'funciona à mesma, mas fica sem percurso.</p>'+
      '<div class="cartao"><div class="vf"><span class="mk s">✓</span>'+
      '<span class="tx"><span class="t1">Só durante o turno</span>'+
      '<br><span class="t2">Quando fechar, deixa de haver localização. '+
      'Nem o patrão a pode ver.</span></span></div>'+
      '<div class="vf"><span class="mk s">✓</span><span class="tx">'+
      '<span class="t1">O senhor vê tudo o que fica gravado</span>'+
      '<br><span class="t2">O mapa aparece-lhe no ecrã enquanto conduz.</span></span></div></div>';
    if(!S.demo.ligado)
      h+='<p class="nota">Quer só ver como é, sem sair do sítio? '+
        'Use «Experimentar sem conduzir» — o carro anda sozinho.</p>';
    if(e==='ligado')
      h+='<div class="cartao bom"><h3>GPS ligado</h3><p class="nota" style="margin-top:4px">'+
        'Encontrou o carro com '+(S.gps.precisao||'—')+' metros de precisão. Pode começar.</p></div>';
    else if(e==='recusado')
      h+='<div class="cartao aviso"><h3>O telemóvel não deixou</h3>'+
        '<p class="nota" style="margin-top:4px">Pode começar na mesma — o turno conta os '+
        'quilómetros pelo conta-quilómetros. Para gravar o caminho, autorize a localização '+
        'nas definições do telemóvel e volte aqui.</p></div>';
    else if(e==='a-procurar')
      h+='<div class="cartao"><p class="nota">A procurar sinal… se estiver dentro de '+
        'um edifício pode demorar.</p></div>';
    b = (e==='ligado'
      ? '<button class="bt pri" data-fazer="comecar">Começar turno</button>'
      : '<button class="bt pri" data-fazer="pedir-gps">Ligar o GPS</button>'+
        '<button class="lig" data-fazer="comecar">Começar sem GPS</button>')+
      '<button class="lig" data-fazer="comecar-demo">Experimentar sem conduzir</button>';
  }

  /* ── o volante ───────────────────────────────────────── */
  else if(S.ecra==='volante'){
    return volante();
  }

  /* ── abastecer ───────────────────────────────────────── */
  else if(S.ecra==='abastecer'){
    var t=S.turno, c2=carroDe(t.carroId);
    var u=t.rasto[t.rasto.length-1];
    var perto=postosPerto(u?u[0]:null, u?u[1]:null, 4);
    var escolhido=S.rasc.posto || (perto[0]?perto[0].p.nome:'');
    var val=S.rasc.valor||0, lt=val?val/t.precoLitro:0;

    h='<div class="tit"><h1>Abastecer</h1></div>';
    if(perto.length)
      h+='<div class="cartao destaque"><h3>Onde está</h3>'+
        '<p class="nota" style="margin:4px 0 9px">O GPS diz que o posto mais perto é '+
        'este. Se não for, escolha outro.</p>'+
        perto.map(function(x){
          return '<button class="linha" data-posto="'+esc(x.p.nome)+'" '+
            'style="margin-bottom:6px;'+(escolhido===x.p.nome
              ?'border-color:var(--accent);background:var(--surface)':'')+'">'+
            '<span><span class="p">'+esc(x.p.nome)+'</span><br>'+
            '<span class="s">a '+(x.m<1000?x.m+' metros':nf(x.m/1000,1)+' km')+'</span></span>'+
            (escolhido===x.p.nome?'<span class="d" style="color:var(--accent);'+
              'font-size:18px">✓</span>':'')+'</button>'; }).join('')+
        '<label class="campo" style="margin-top:4px"><span class="lb">Ou escreva o nome</span>'+
        '<input type="text" id="posto-outro" value="" placeholder="outro posto"></label></div>';
    else
      h+='<label class="campo"><span class="lb">Em que posto está</span>'+
        '<input type="text" id="posto-outro" value="'+esc(escolhido)+
        '" placeholder="nome do posto"><span class="aj">Sem GPS não dá para adivinhar.</span>'+
        '</label>';

    h+=caixaFoto('talao','Fotografar o talão','ou a bomba, se o talão não der')+
      '<label class="campo"><span class="lb">Quanto pagou (CVE)</span>'+
      '<input type="number" inputmode="numeric" id="valor" value="'+(val||'')+'" placeholder="0">'+
      '<span class="aj">'+(val
        ? 'A '+nf(t.precoLitro,2)+' por litro, são <b>'+nf(lt,2)+' litros</b>.'
        : 'Preço do mês: '+nf(t.precoLitro,2)+' CVE por litro.')+'</span></label>'+
      '<label class="campo"><span class="lb">Litros escritos no talão</span>'+
      '<input type="number" inputmode="decimal" step="0.01" id="litros" value="'+
      (S.rasc.litros||'')+'" placeholder="se der para ler"></label>';
    if(lt>c2.deposito*1.05)
      h+='<div class="cartao mau"><h3>Não cabe no depósito</h3><p class="nota" '+
        'style="margin-top:5px">'+nf(lt,2)+' litros num depósito de '+nf(c2.deposito)+
        '. Confirme o valor.</p></div>';
    b='<button class="bt pri" data-fazer="guardar-abast"'+(val>0?'':' disabled')+
      '>Registar</button><button class="lig" data-fazer="ir-volante">Voltar ao turno</button>';
  }

  /* ── fechar ──────────────────────────────────────────── */
  else if(S.ecra==='km-fim'){
    var t2=S.turno, kmF=S.rasc.kmF==null?t2.kmInicial+Math.round(kmDoRasto(t2.rasto)):S.rasc.kmF;
    var perc=kmF-t2.kmInicial;
    h='<div class="tit"><h1>Terminar o turno</h1></div>'+
      '<p class="sub">Última vez: quantos km marca o conta-quilómetros agora?</p>'+
      caixaFoto('fecho','Fotografar o conta-quilómetros','ou escreva o número em baixo')+
      '<label class="campo"><span class="lb">Km agora</span>'+
      '<input type="number" inputmode="numeric" id="kmF" value="'+kmF+'">'+
      '<span class="aj">Começou com '+nf(t2.kmInicial)+' km · '+
      (perc>=0?'andou <b>'+nf(perc)+' km</b>':'<b>não pode ser menos do que de manhã</b>')+
      '</span></label>';
    if(perc>LIM.kmMax)
      h+='<div class="cartao mau"><h3>Parece a mais</h3><p class="nota" style="margin-top:5px">'+
        nf(perc)+' km num turno é pouco provável. Quase sempre é um algarismo a mais.</p></div>';
    b='<button class="bt pri" data-fazer="fechar-turno"'+
      (perc>=0&&perc<=LIM.kmMax?'':' disabled')+'>Terminar</button>'+
      '<button class="lig" data-fazer="ir-volante">Voltar ao turno</button>';
  }

  /* ── os meus turnos ──────────────────────────────────── */
  else if(S.ecra==='meus'){
    var eu=condutorActual();
    var meus=S.turnos.filter(function(t){ return t.estado==='FECHADO'&&
      (!eu||t.condutor===eu.nome); });
    h='<div class="tit"><h1>Os meus turnos</h1></div>';
    h+= meus.length ? meus.slice(0,20).map(linhaTurno).join('')
      : '<div class="cartao"><div class="vazio">Ainda não fechou nenhum turno.</div></div>';
  }
  return [h,b];
}

/* ════════════════════════════════════════════════════════════
   O VOLANTE — o ecrã que o condutor vê enquanto conduz
   Mapa a ocupar tudo, velocidade grande, e mais nada.
   ════════════════════════════════════════════════════════════ */
function volante(){
  var t=S.turno;
  var kms=kmDoRasto(t.rasto);
  var vel=S.gps.velocidade||0;
  var decorrido=(Date.now()-t.inicio)/1000;

  var h='<div class="volante">'+
    mapaVivo(t.rasto)+
    '<div class="hud">'+
      '<div class="vel"><span class="n num">'+Math.round(vel)+'</span>'+
      '<span class="u">km/h</span></div>'+
      arcoVelocidade(vel)+
    '</div>'+
    '<div class="hud-baixo">'+
      '<div><b class="num">'+nf(kms,1)+'</b><span>km</span></div>'+
      '<div><b class="num">'+hms(decorrido)+'</b>'+
      '<span><i class="gravando"></i>a gravar</span></div>'+
      '<div><b class="num">'+nf(t.totalCve)+'</b><span>CVE</span></div>'+
    '</div></div>';

  if(t.abastecimentos.length)
    h+='<div class="cartao" style="margin-top:12px"><h3>Já abasteceu</h3>'+
      t.abastecimentos.map(function(a){
        return '<div class="vf"><span class="mk s">✓</span><span class="tx">'+
          '<span class="t1">'+nf(a.valor)+' CVE · '+nf(a.valor/t.precoLitro,2)+' litros</span>'+
          '<br><span class="t2">'+hh(a.hora)+' · '+esc(a.posto||'posto')+'</span></span></div>';
      }).join('')+'</div>';

  if(t.demo)
    h+='<div class="cartao destaque" style="margin-top:12px"><p class="nota">'+
      '<b>Turno de demonstração.</b> O carro anda sozinho e depressa — umas horas de '+
      'trabalho em quinze segundos. Pode abastecer e terminar como num turno a sério.'+
      '</p></div>';
  else if(S.gps.estado!=='ligado')
    h+='<div class="cartao aviso" style="margin-top:12px"><p class="nota">'+
      'Sem sinal de GPS neste momento. O turno continua; o caminho é que não fica gravado.'+
      '</p></div>';

  var b='<div class="par"><button class="bt sec" data-fazer="ir-abastecer">Abastecer</button>'+
    '<button class="bt perigo" data-fazer="ir-km-fim">Terminar</button></div>';
  return [h,b];
}

/* Arco de velocidade — um conta-rotações simples, sem exageros. */
function arcoVelocidade(v){
  var max=120, f=Math.max(0, Math.min(v/max, 1));
  var R=54, C=Math.PI*R;                       // meia circunferência
  var cor = v>90 ? 'var(--crit)' : (v>70 ? 'var(--warn)' : 'var(--accent)');
  return '<svg class="arco" viewBox="0 0 128 72" aria-hidden="true">'+
    '<path d="M10 64 A54 54 0 0 1 118 64" fill="none" stroke="var(--line)" '+
    'stroke-width="6" stroke-linecap="round" opacity=".5"/>'+
    '<path d="M10 64 A54 54 0 0 1 118 64" fill="none" stroke="'+cor+'" '+
    'stroke-width="6" stroke-linecap="round" stroke-dasharray="'+C.toFixed(1)+'" '+

}

/* Mapa ao vivo: o percurso feito, e o carro na ponta com o nariz virado
   para onde vai. Aproxima-se à medida que o carro anda. */
function mapaVivo(rasto){
  var pts=(rasto||[]).filter(function(p){ return p[3]==null||p[3]<=LIM.precisaoMax; });
  var W=400, H=620;
  if(pts.length<2)
    return '<svg class="mapa-vivo" viewBox="0 0 '+W+' '+H+'" '+
      'preserveAspectRatio="xMidYMid meet" role="img" aria-label="À espera do GPS"><rect width="'+W+'" height="'+H+
      '" fill="var(--surface2)"/>'+
      '<text x="'+(W/2)+'" y="'+(H/2)+'" text-anchor="middle" fill="var(--muted)" '+
      'font-size="13" font-family="IBM Plex Sans,sans-serif">à espera do GPS…</text></svg>';

  var la=pts.map(function(p){return p[0];}), lo=pts.map(function(p){return p[1];});
  var mnA=Math.min.apply(null,la), mxA=Math.max.apply(null,la);
  var mnO=Math.min.apply(null,lo), mxO=Math.max.apply(null,lo);
  var pad=46, kx=Math.cos(mnA*Math.PI/180);
  var sO=(mxO-mnO)*kx||1e-9, sA=(mxA-mnA)||1e-9;
  var s=Math.min((W-2*pad)/sO,(H-2*pad)/sA);
  s=Math.min(s, 900000);                                   // não aproximar demasiado
  var ox=(W-sO*s)/2, oy=(H-sA*s)/2;
  var X=function(x){ return ox+(x-mnO)*kx*s; }, Y=function(y){ return H-(oy+(y-mnA)*s); };

  var partes=[], act=[];
  for(var i=0;i<pts.length;i++){
    if(i&&(pts[i][2]-pts[i-1][2])>300000){ if(act.length>1) partes.push(act); act=[]; }
    act.push((act.length?'L':'M')+X(pts[i][1]).toFixed(1)+' '+Y(pts[i][0]).toFixed(1));
  }
  if(act.length>1) partes.push(act);

  var u=pts[pts.length-1], ant=pts[Math.max(0,pts.length-4)];
  var ang=Math.atan2(X(u[1])-X(ant[1]), -(Y(u[0])-Y(ant[0])))*180/Math.PI;

  var svg='<svg class="mapa-vivo" viewBox="0 0 '+W+' '+H+'" '+
    'preserveAspectRatio="xMidYMid meet" role="img" '+
    'aria-label="O caminho que o carro fez">'+
    '<defs><pattern id="gv" width="40" height="40" patternUnits="userSpaceOnUse">'+
    '<path d="M40 0H0V40" fill="none" stroke="var(--line2)" stroke-width="1"/></pattern>'+
    '<filter id="brilho"><feGaussianBlur stdDeviation="3.2" result="b"/>'+
    '<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>'+
    '<rect width="'+W+'" height="'+H+'" fill="var(--surface2)"/>'+
    '<rect width="'+W+'" height="'+H+'" fill="url(#gv)"/>';
  partes.forEach(function(p){
    svg+='<path d="'+p.join(' ')+'" fill="none" stroke="var(--accent)" stroke-width="3" '+
      'stroke-linejoin="round" stroke-linecap="round" opacity=".35"/>'; });
  // a ponta do percurso brilha: é ali que o carro vai
  var ultima=partes[partes.length-1];
  if(ultima&&ultima.length>1)
    svg+='<path d="'+ultima.slice(-14).join(' ').replace(/^L/,'M')+'" fill="none" '+
      'stroke="var(--accent)" stroke-width="3.5" stroke-linecap="round" '+
      'filter="url(#brilho)"/>';
  svg+='<circle cx="'+X(pts[0][1]).toFixed(1)+'" cy="'+Y(pts[0][0]).toFixed(1)+
    '" r="5" fill="none" stroke="var(--ok)" stroke-width="2"/>'+
    '<g transform="translate('+X(u[1]).toFixed(1)+','+Y(u[0]).toFixed(1)+') rotate('+
    ang.toFixed(0)+')">'+
    '<circle r="13" fill="var(--accent)" opacity=".16"/>'+
    '<path d="M0 -9 L6.5 8 L0 4.5 L-6.5 8 Z" fill="var(--accent)" '+
    'stroke="var(--surface)" stroke-width="1.5" stroke-linejoin="round"/></g>'+
    '</svg>';
  return svg;
}

  else if(S.ecra==='alertas'){

      : '<div class="cartao"><div class="vazio">Ainda não há contas para fazer.</div></div>';

    h+='<button class="bt sec pequeno" data-fazer="mais-carro">+ Acrescentar carro</button>';
    b='<button class="bt pri" data-fazer="guardar-definicoes">Guardar</button>'+

  return [h,b];

];

  {id:'volante', ic:'🚕', nm:'Turno'},
  {id:'meus', ic:'📋', nm:'Os meus'}
];

                      'km-fim','meus'];

function pintarTopo(){
  var p=[];
  if(S.papel==='condutor'&&S.ecra!=='entrar'){
    var rot={ligado:'GPS ligado','a-procurar':'a procurar',recusado:'sem GPS',
      'sem-sinal':'sem sinal',indisponivel:'sem GPS',desligado:'GPS desligado'}[S.gps.estado];
    var cls=S.gps.estado==='ligado'?'viva':
      (S.gps.estado==='recusado'||S.gps.estado==='indisponivel'?'morta':'');

    if(S.bateria!=null) p.push('<span class="pill">'+S.bateria+'%</span>');
  }
  if(S.demo.ligado) p.push('<span class="pill demo">exemplo</span>');
  var e=el('topo-dir'); if(e) e.innerHTML=p.join('');
  var l=el('logo-sub');
  if(l) l.textContent = S.frota&&S.frota.nome ? ' · '+S.frota.nome : '';
}

function pintarNav(){
  var n=el('nav');
  if(SEM_NAV.indexOf(S.ecra)>=0 || !S.pronto){ n.innerHTML=''; return; }
  var tabs = S.papel==='dono' ? TABS_DONO : TABS_CONDUTOR;
  var nAl = S.turnos.reduce(function(s,t){ return s+porResolver(t).length; },0);
  n.innerHTML = tabs.map(function(t){
    var activo = S.ecra===t.id ||
      (t.id==='turnos'&&S.ecra==='turno-detalhe') ||
      (t.id==='mais'&&(S.ecra==='definicoes'||S.ecra==='relatorio'));
    return '<button data-tab="'+t.id+'"'+(activo?' aria-current="page"':'')+'>'+
      '<span class="ic">'+t.ic+'</span>'+t.nm+
      (t.id==='alertas'&&nAl?'<span class="bolha">'+nAl+'</span>':'')+'</button>';
  }).join('');
}

function pintar(){
  var r;
  if(S.ecra==='setup'||!S.pronto) r=ecraSetup();
  else if(S.papel==='condutor'&&ECRAS_CONDUTOR.indexOf(S.ecra)>=0) r=ecraCondutor();
  else r=ecraDono();
  el('ecra').className = (S.ecra==='volante' ? 'col cheia' : 'col');
  el('ecra').innerHTML=r[0];
  el('accoes').innerHTML=r[1]||'';
  pintarTopo(); pintarNav();
}
var adiado=null;
function pintarSuave(){ clearTimeout(adiado); adiado=setTimeout(function(){
  var a=document.activeElement, id=a&&a.id, pos=a&&a.selectionStart;
  pintar();
  if(id){ var x=el(id); if(x){ x.focus(); try{ x.setSelectionRange(pos,pos); }catch(e){} } }
}, 300); }
function irPara(x){ S.ecra=x; pintar(); el('ecra').parentNode.scrollTop=0; }

/* ════════════════════════════════════════════════════════════
   O QUE OS BOTÕES FAZEM
   ════════════════════════════════════════════════════════════ */
function novoCarro(){ return {id:uid('c'), matricula:'', marca:'', modelo:'',
  deposito:45, kmActual:0, consumoRef:7.5}; }
function novoCondutor(){ return {id:uid('m'), nome:'', email:'', codigo:codigoNovo()}; }

function entrar(){
  var email=(S.rasc.email||'').trim().toLowerCase();
  var cod=String(S.rasc.codigo||'').trim();
  var c=S.frota.condutores.filter(function(x){
    return (x.email||'').trim().toLowerCase()===email && String(x.codigo)===cod; })[0];
  if(!c){
    S.aviso = email ? 'Email ou código errados. Confirme com o patrão.'
                    : 'Escreva o email e o código.';
    pintar(); return;
  }
  S.sessao=c.id; S.eu.nome=c.nome; S.aviso=null; S.rasc={};
  guardarLocal();
  irPara(S.turno&&S.turno.estado==='ABERTO' ? 'volante' : 'carro');
}
function sair(){ S.sessao=null; S.eu.nome=''; S.rasc={}; guardarLocal(); irPara('entrar'); }

function comecarTurno(falso){
  var carro=carroDe(S.eu.carroId);
  var km=S.rasc.km==null?carro.kmActual:S.rasc.km;
  if(km<carro.kmActual) return;
  S.turno={ id:uid(), estado:'ABERTO', inicio:Date.now(), fim:null,
    carroId:carro.id, matricula:carro.matricula,
    condutor:(condutorActual()||{}).nome||'Condutor',
    kmInicial:km, kmFinal:null, gap:km-carro.kmActual,
    precoLitro:S.frota.precoLitro, deposito:carro.deposito,
    consumoRef:carro.consumoRef||7.5, rasto:[], abastecimentos:[],
    totalCve:0, totalLitros:0, pontosFalsos:0, demo:!!falso,
    fotoKeys:S.fotos.abertura?['abertura']:[],
    fotos:S.fotos.abertura?{abertura:S.fotos.abertura}:{} };
  S.fotos={}; S.rasc={};
  S.demo.turnoFalso=!!falso;
  guardarTurno(S.turno,true);
  // Um turno só é simulado se o condutor o pedir. Ter dados de exemplo
  // gravados não pode transformar um turno verdadeiro num turno inventado.
  if(falso) arrancarTurnoDemo(); else ligarGps();
  if(!relogio) relogio=setInterval(function(){
    if(S.ecra==='volante') pintar(); }, 1000);
  irPara('volante');
}

function guardarAbastecimento(){
  var v=S.rasc.valor||0; if(v<=0||!S.turno) return;
  var n=S.turno.abastecimentos.length+1;
  var u=S.turno.rasto[S.turno.rasto.length-1];
  var perto=postosPerto(u?u[0]:null, u?u[1]:null, 1);
  S.turno.abastecimentos.push({hora:Date.now(), valor:v,
    litrosTalao:S.rasc.litros||null, temFoto:!!S.fotos.talao,
    posto:S.rasc.posto || (perto[0]?perto[0].p.nome:'posto'),
    lat:u?u[0]:null, lon:u?u[1]:null});
  S.turno.totalCve+=v; S.turno.totalLitros+=v/S.turno.precoLitro;
  if(S.fotos.talao){ S.turno.fotos['talao'+n]=S.fotos.talao;
    S.turno.fotoKeys.push('talao'+n); }
  guardarTurno(S.turno,true);
  S.fotos={}; S.rasc={}; irPara('volante');
}

function fecharTurno(){
  var t=S.turno, kmF=S.rasc.kmF; if(!t) return;
  if(kmF==null) kmF=t.kmInicial+Math.round(kmDoRasto(t.rasto));
  var perc=kmF-t.kmInicial;
  if(perc<0||perc>LIM.kmMax) return;
  t.kmFinal=kmF; t.fim=Date.now(); t.estado='FECHADO';
  if(S.fotos.fecho){ t.fotos.fecho=S.fotos.fecho; t.fotoKeys.push('fecho'); }
  t.kmGps=+kmDoRasto(t.rasto).toFixed(1);
  t.semSinalS=Math.round(semSinal(t.rasto));
  t.bateriaFim=S.bateria;
  t.alertas=avaliar(t).alertas;
  pararTurnoDemo(); desligarGps();
  if(relogio){ clearInterval(relogio); relogio=null; }
  var c=carroDe(t.carroId); if(c) c.kmActual=kmF;
  S.turnos=S.turnos.filter(function(x){ return x.id!==t.id; });
  S.turnos.unshift(t); S.turno=null; S.fotos={}; S.rasc={};
  guardarTurno(t,true); guardarFrota();
  verTurno(t.id);
}

function verTurno(id){
  var t=S.turnos.filter(function(x){ return x.id===id; })[0]; if(!t) return;
  S.detalhe=t; S.fotosDetalhe=t.fotos||null;
  S.papel='dono'; irPara('turno-detalhe');
  if(S.db&&!t.demo&&t.fotoKeys&&t.fotoKeys.length&&!t.fotos){
    var got={};
    Promise.all(t.fotoKeys.map(function(k){
      return S.db.doc('turnos/'+t.id+'/fotos/'+k).get().then(function(s){
        if(s.exists&&s.data().img) got[k]=s.data().img; }).catch(function(){});
    })).then(function(){
      if(S.detalhe&&S.detalhe.id===t.id){ S.fotosDetalhe=got; pintar(); } });
  }
}

function resolver(idT, cod, r){
  var t=S.turnos.filter(function(x){ return x.id===idT; })[0]; if(!t) return;
  t.resolucoes=t.resolucoes||{}; t.resolucoes[cod]={r:r, quando:Date.now()};
  guardarLocal();
  if(S.db&&S.podeEscrever)
    S.db.doc('turnos/'+t.id).update({resolucoes:t.resolucoes}).catch(function(){});
  pintar();
}

function lerCampos(){
  [['s-nome','nome'],['s-preco','preco'],['d-preco','preco']].forEach(function(x){
    var n=el(x[0]); if(!n) return;
    if(x[1]==='nome') S.frota.nome=n.value;
    if(x[1]==='preco') S.frota.precoLitro=+n.value||S.frota.precoLitro;
  });
}

document.addEventListener('input', function(ev){
  var t=ev.target, id=t.id;
  if(id==='km'){ S.rasc.km=+t.value; pintarSuave(); }
  if(id==='valor'){ S.rasc.valor=+t.value; pintarSuave(); }
  if(id==='litros') S.rasc.litros=+t.value;
  if(id==='kmF'){ S.rasc.kmF=+t.value; pintarSuave(); }
  if(id==='e-email') S.rasc.email=t.value;
  if(id==='e-codigo') S.rasc.codigo=t.value;
  if(id==='posto-outro') S.rasc.posto=t.value;
  if(t.dataset.c!=null){
    var c=S.frota.carros[+t.dataset.i]; if(!c) return;
    if(t.dataset.c==='mat') c.matricula=t.value;
    if(t.dataset.c==='km') c.kmActual=+t.value||0;
    if(t.dataset.c==='dep') c.deposito=+t.value||45;
  }
  if(t.dataset.d!=null){
    while(S.frota.condutores.length<=+t.dataset.i) S.frota.condutores.push(novoCondutor());
    var m=S.frota.condutores[+t.dataset.i];
    if(t.dataset.d==='nome') m.nome=t.value;
    if(t.dataset.d==='email') m.email=t.value;
    if(t.dataset.d==='codigo') m.codigo=t.value;
  }
});

document.addEventListener('change', function(ev){
  var i=ev.target;
  if(i.dataset&&i.dataset.foto&&i.files&&i.files[0])
    lerFoto(i.files[0], function(u){ S.fotos[i.dataset.foto]=u; pintar(); });
});

document.addEventListener('click', function(ev){
  var b=ev.target.closest('[data-fazer],[data-tab],[data-turno],[data-res],'+
    '[data-carro],[data-posto]');
  if(!b) return;
  var d=b.dataset;

  if(d.tab){ S.detalhe=null; irPara(d.tab); return; }
  if(d.turno){ verTurno(d.turno); return; }
  if(d.res){ resolver(d.t, d.c, d.res); return; }
  if(d.carro){ S.eu.carroId=d.carro; S.fotos={}; 
    S.rasc={km:carroDe(d.carro).kmActual}; guardarLocal(); irPara('km-inicio'); return; }
  if(d.posto!=null){ S.rasc.posto=d.posto; pintar(); return; }

  var f=d.fazer;
  if(f==='passo0'){ lerCampos(); S.passo=0; pintar(); }
  if(f==='passo1'){ lerCampos();
    if(!S.frota.carros.length) S.frota.carros.push(novoCarro());
    S.passo=1; pintar(); }
  if(f==='passo2'){ lerCampos();
    if(!S.frota.condutores.length) S.frota.condutores.push(novoCondutor());
    S.passo=2; pintar(); }
  if(f==='mais-carro'){ lerCampos(); S.frota.carros.push(novoCarro()); pintar(); }
  if(f==='tirar-carro'){ S.frota.carros.splice(+d.i,1); pintar(); }
  if(f==='mais-condutor'){ lerCampos(); S.frota.condutores.push(novoCondutor()); pintar(); }
  if(f==='terminar'){
    lerCampos();
    S.frota.carros=S.frota.carros.filter(function(c){ return c.matricula.trim(); });
    if(!S.frota.carros.length) S.frota.carros=[Object.assign(novoCarro(),
      {matricula:'CV-01-AB', kmActual:120000, deposito:50})];
    S.frota.condutores=S.frota.condutores.filter(function(c){ return (c.nome||'').trim(); });
    S.frota.condutores.forEach(function(c){ if(!c.codigo) c.codigo=codigoNovo(); });
    S.eu.carroId=S.frota.carros[0].id;
    guardarFrota(); S.pronto=true; S.papel='dono'; irPara('hoje'); }
  if(f==='demo-rapida'){
    lerCampos();
    if(!S.frota.nome) S.frota.nome='Táxis Praia, Lda';
    S.frota.carros=[
      Object.assign(novoCarro(),{matricula:'CV-01-AB',marca:'Toyota',modelo:'Corolla',
        kmActual:120000,deposito:50}),
      Object.assign(novoCarro(),{matricula:'CV-02-CD',marca:'Nissan',modelo:'Almera',
        kmActual:208400,deposito:46}),
      Object.assign(novoCarro(),{matricula:'CV-03-EF',marca:'Hyundai',modelo:'Accent',
        kmActual:64300,deposito:45})];
    S.frota.condutores=[];
    S.eu.carroId=S.frota.carros[0].id;
    S.pronto=true; S.papel='dono';
    gerarDemonstracao(); irPara('hoje'); }
  if(f==='gerar-demo'){ gerarDemonstracao(); irPara('hoje'); }
  if(f==='limpar-demo'){ limparDemonstracao(); pintar(); }

  if(f==='entrar') entrar();
  if(f==='sair') sair();
  if(f==='ir-carro'){ S.fotos={}; S.rasc={}; irPara('carro'); }
  if(f==='ir-gps'){ ligarGps(); irPara('gps'); }
  if(f==='pedir-gps'){ ligarGps(); pintar(); }
  if(f==='comecar') comecarTurno(false);
  if(f==='comecar-demo') comecarTurno(true);
  if(f==='ir-volante') irPara('volante');
  if(f==='ir-abastecer'){ S.fotos={}; S.rasc={}; irPara('abastecer'); }
  if(f==='guardar-abast') guardarAbastecimento();
  if(f==='ir-km-fim'){ S.fotos={}; S.rasc={}; irPara('km-fim'); }
  if(f==='fechar-turno') fecharTurno();

  if(f==='ir-alertas') irPara('alertas');
  if(f==='ir-relatorio') irPara('relatorio');
  if(f==='ir-definicoes') irPara('definicoes');
  if(f==='guardar-definicoes'){ lerCampos(); guardarFrota(); irPara('mais'); }
  if(f==='voltar'){ S.detalhe=null; irPara(S.papel==='dono'?'hoje':'meus'); }
  if(f==='papel-condutor'){ S.papel='condutor'; guardarLocal();
    irPara(S.sessao ? (S.turno?'volante':'carro') : 'entrar'); }
  if(f==='papel-dono'){ S.papel='dono'; guardarLocal(); irPara('hoje'); }
});

/* ════════════════════════════════════════════════════════════
   ARRANQUE
   ════════════════════════════════════════════════════════════ */
var L=lerLocal();
S.frota = (L&&L.frota) || frotaNova();
if(!S.frota.condutores) S.frota.condutores=[];
S.eu = (L&&L.eu) || S.eu;
S.sessao = (L&&L.sessao) || null;
S.turnos = (L&&L.turnos) || [];
S.papel = (L&&L.papel) || 'dono';
S.demo.ligado = !!(L&&L.demo&&L.demo.ligado);
S.turno = (L&&L.turno&&L.turno.estado==='ABERTO') ? L.turno : null;
S.pronto = !!(S.frota.carros && S.frota.carros.length);

if(!S.pronto){ S.ecra='setup'; S.passo=0; }
else {
  if(!carroDe(S.eu.carroId)) S.eu.carroId=S.frota.carros[0].id;
  if(S.papel==='condutor'){
    if(!S.sessao) S.ecra='entrar';
    else if(S.turno){ S.ecra='volante';
      if(S.turno.demo){ S.demo.turnoFalso=true; arrancarTurnoDemo(); } else ligarGps();
      relogio=setInterval(function(){ if(S.ecra==='volante') pintar(); },1000); }
    else S.ecra='carro';
  } else S.ecra='hoje';
}
pintar();
lerBateria();

// A base partilhada chega depois. A aplicação já está de pé sem ela.
if(window.claude&&window.claude.use){
  window.claude.use('db').then(function(db){
    if(!db) return;
    S.db=db;
    db.doc('config/frota').get().then(function(s){
      if(s.exists&&s.data().carros&&s.data().carros.length){
        S.frota=s.data();
        if(!S.frota.condutores) S.frota.condutores=[];
        if(!carroDe(S.eu.carroId)) S.eu.carroId=S.frota.carros[0].id;
        if(!S.pronto){ S.pronto=true; S.ecra=S.papel==='dono'?'hoje':'entrar'; }
        pintar();
      } else if(S.pronto) guardarFrota();
    }).catch(function(){});

    db.collection('turnos').orderBy('inicio','desc').limit(60)
      .onSnapshot(function(q){
        var meu=S.turno?S.turno.id:null, mapa={};
        q.docs.map(function(d){ return d.data(); })
          .filter(function(t){ return t&&t.id&&t.inicio&&t.id!==meu; })
          .forEach(function(t){ mapa[t.id]=t; });
        S.turnos.forEach(function(t){ if(!mapa[t.id]&&t.id!==meu) mapa[t.id]=t; });
        S.turnos=Object.keys(mapa).map(function(k){ return mapa[k]; })
          .sort(function(a,b){ return b.inicio-a.inicio; });
        S.demo.ligado = S.turnos.some(function(t){ return t.demo; });
        guardarLocal();
        if(['setup','km-inicio','abastecer','km-fim','entrar'].indexOf(S.ecra)<0) pintar();
      }, function(){});
  }).catch(function(){});
}
})();
</script>
