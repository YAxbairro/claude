<!doctype html><html lang="pt"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FleetCV · sem rede</title>
<style>
  :root{--accent:#0B7F8E; --ink:#0F1618; --muted:#5B6B6E; --bg:#F4F7F7}
  @media (prefers-color-scheme: dark){ :root{--accent:#3FC0CE; --ink:#E3E9E8; --muted:#9AA9AB; --bg:#0F1618} }
  body{margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
       font:16px/1.45 system-ui, sans-serif; padding:24px; box-sizing:border-box; text-align:center}
  h1{font-size:22px; margin:0 0 8px} p{color:var(--muted); margin:0 0 20px; max-width:30ch}
  button{font:inherit; font-weight:700; border:0; border-radius:12px; padding:14px 22px;
         background:var(--accent); color:#fff}
</style>
<body><div>
  <h1>Sem ligação à internet</h1>
  <p>A FleetCV precisa de rede para abrir. Ligue os dados ou o Wi-Fi e tente outra vez.</p>
  <button onclick="location.replace('https://fleetcv.vercel.app/app#condutor')">Tentar outra vez</button>
</div></body></html>
